name: 'Build setup basics'
description: 'Setup build environment'

inputs:

  GH_RUNS_ON:
    default: 'ubuntu-latest'
    required: false
    description: "GitHub runs-on"

  PLATFORMS:
    required: false
    default: linux/amd64,linux/arm64
    description: "Platform(s) to build"

runs:
  using: 'composite'

  steps:

    - name: "🧰 Set up gh cli"
      uses: dev-hanz-ops/install-gh-cli-action@v0.2.1
      if: ${{ !startsWith(inputs.GH_RUNS_ON, 'ubuntu') }}

    - name: "🧰 Set up QEMU"
      uses: docker/setup-qemu-action@v3

    - name: "🧰 Set up Docker Buildx ${{ inputs.PLATFORMS }}"
      uses: docker/setup-buildx-action@v3
      with:
        platforms: ${{ inputs.PLATFORMS }}
