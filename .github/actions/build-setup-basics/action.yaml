name: 'Build setup basics'
description: 'Setup build environment'

inputs:

  GH_RUNS_ON:
    default: 'ubuntu-latest'
    required: false
    description: "GitHub runs-on"

  PLATFORMS:
    required: false
    default: linux/amd64,linux/arm64
    description: "Platform(s) to build"

  QEMU_BINARY_IMAGE_TAG:
    required: false
    default: qemu-v10.0.4
    description: "QEMU binary image tag.  See https://hub.docker.com/r/tonistiigi/binfmt/tags"

runs:
  using: 'composite'

  steps:

    - name: "🧰 Set up gh cli"
      uses: dev-hanz-ops/install-gh-cli-action@v0.2.1
      if: ${{ !startsWith(inputs.GH_RUNS_ON, 'ubuntu') }}

    - name: "🧰 Set up QEMU"
      uses: docker/setup-qemu-action@v3
      env:
        # Override the default binfmt image so it comes from GAR mirror instead of Docker Hub
        QEMU_BINARY_IMAGE: us-central1-docker.pkg.dev/favedom-dev/dockerhub-remote/tonistiigi/binfmt:${{ inputs.QEMU_BINARY_IMAGE_TAG }}

    - name: "🧰 Create BuildKit config with registry mirror"
      shell: bash
      run: |
        mkdir -p /tmp/buildkit
        cat > /tmp/buildkit/config.toml <<EOF
        [registry."docker.io"]
          mirrors = ["https://us-central1-docker.pkg.dev/favedom-dev/dockerhub-remote"]
        EOF

    - name: "🧰 Set up Docker Buildx ${{ inputs.PLATFORMS }}"
      uses: docker/setup-buildx-action@v3
      with:
        platforms: ${{ inputs.PLATFORMS }}
        driver: docker-container
        buildkitd-flags: --config /tmp/buildkit/config.toml
