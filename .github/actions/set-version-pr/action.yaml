name: "Set PR Version"
description: "Sets version and build-version for pull requests"

inputs:
  event-name:
    description: "GitHub event name (e.g., pull_request)"
    required: true
  pr-number:
    description: "Pull request number (github.event.number)"
    required: true
  run-number:
    description: "Workflow run number (github.run_number)"
    required: true
  run-attempt:
    description: "Workflow run attempt (github.run_attempt)"
    required: true

outputs:
  version:
    description: "PR version string"
    value: ${{ steps.set-pr-version.outputs.version }}
  build-version:
    description: "PR build version string"
    value: ${{ steps.set-pr-version.outputs.build-version }}

runs:
  using: "composite"
  steps:
    - name: "Set PR Version"
      id: set-pr-version
      # if: ${{ inputs.event-name == 'pull_request' }}
      env:
        pr_number: ${{ inputs.pr-number }}
      run: |
        if [ -z "${pr_number}" ]; then
          pr_number="00"
          echo "pr_number=${pr_number}"
        else
          echo "pr_number=input.pr-number"
        fi

        pr_run_number="${{ inputs.run-number }}"
        pr_run_attempt="${{ inputs.run-attempt }}"
        build_version="${pr_number}.${pr_run_number}.${pr_run_attempt}"

        echo "PR Number        (github.event.number) : ${pr_number}"
        echo "PR Run Number    (github.run_number)   : ${pr_run_number}"
        echo "PR Run Attempt   (github.run_attempt)  : ${pr_run_attempt}"
        echo "PR Build Version                       : ${build_version}"

        echo "build-version=${build_version}" >> $GITHUB_OUTPUT
        echo "version=0.0.0-SNAPSHOT-PR-${pr_number}-${pr_run_number}-${pr_run_attempt}" >> $GITHUB_OUTPUT
      shell: bash
