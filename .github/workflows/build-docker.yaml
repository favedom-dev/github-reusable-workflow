name: Docker
# Reusable workflow to build and push a Docker image to Google Artifact Registry.

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      NAME:
        description: "Name of service"
        required: true
        type: string

      VERSION:
        description: "Version tag for the build artifact"
        required: true
        type: string

      SECRETS_TO_FETCH:
        description: "Secrets to fetch from Google Secret Manager"
        required: false
        type: string

      DEFAULT_SECRETS_TO_FETCH:
        description: "Default secrets to fetch from Google Secret Manager"
        required: false
        type: string
        default: |
          GH_TOKEN:projects/1054075584205/secrets/core_GITHUB_FAVEDOM_DEV_PASSWORD

      FILE_DOWNLOAD_BASE_URL:
        description: "Base URL for downloading reusable workflow scripts"
        default: 'https://raw.githubusercontent.com/favedom-dev/github-reusable-workflow'
        required: false
        type: string

      FILE_GIT_BRANCH:
        default: 'v2.1'
        required: false
        type: string
        description: "Used typically for testing new non-merged helm changes"

      VAR_DOCKER_SCRIPT_NAME:
        description: "Name of the Docker variables script"
        default: 'var-docker.sh'
        required: false
        type: string

      PLATFORMS:
        description: "Target platforms for multi-arch builds"
        required: false
        type: string
        default: linux/amd64,linux/arm64

      PROJECT_ID:
        description: "GCP project ID"
        default: 'favedom-dev'
        required: false
        type: string

      GAR_LOCATION:
        description: "Google Artifact Registry location"
        default: 'us-central1'
        required: false
        type: string

      GCR_LOCATION:
        description: "Google Container Registry location"
        default: 'gcr.io'
        required: false
        type: string

      DOCKER_NAME:
        description: "Override Docker image name (defaults to NAME)"
        required: false
        type: string

      DOCKER_ENABLE_CACHE:
        type: string
        default: 'false'
        required: false
        description: "Enable Docker layer caching (true or false)"

      DOCKER_FILE:
        description: "Path to Dockerfile"
        required: false
        type: string

      DOCKER_REGISTRY:
        description: "Docker registry name in Artifact Registry"
        default: 'docker'
        required: false
        type: string

      DOCKER_CONTEXT:
        description: "Docker build context directory"
        default: '.'
        required: false
        type: string

      DOCKER_PUSH:
        description: "Whether to push the Docker image"
        default: 'true'
        required: false
        type: string

      DOCKER_PUSH_PR:
        description: "Whether to push the Docker image on pull requests"
        default: ''
        required: false
        type: string

      JOBS_TIMEOUT:
        description: "Timeout in minutes for the workflow jobs"
        default: 10
        required: false
        type: number

      GH_RUNS_ON:
        description: "GitHub Actions runner label to use"
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

    outputs:
      ARTIFACT_URL:
        description: "Artifcat URL to specific tag"
        value: ${{ jobs.docker.outputs.ARTIFACT_URL }}

jobs:

  docker:
    timeout-minutes: ${{ inputs.JOBS_TIMEOUT }}
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    env:
      # GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      DOCKER_BUILDKIT: 1
      ARTIFACT_LINK_SCRIPT_NAME: artifact-link.sh
      NAME: ${{ inputs.NAME }}
      VERSION: ${{ inputs.VERSION }}
    outputs:
      ARTIFACT_URL: ${{ steps.build-docker.outputs.ARTIFACT_URL }}

    steps:

      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "⬇️ Get Reusable Files"
        uses: favedom-dev/github-reusable-workflow/.github/actions/get-reusable-files@v2.1
        id: get-reusable-files
        with:
          FILE_GIT_BRANCH: ${{ inputs.FILE_GIT_BRANCH }}
          FILE_DOWNLOAD_BASE_URL: ${{ inputs.FILE_DOWNLOAD_BASE_URL }}
          FILES_TO_DOWNLOAD: |
            [
              { "subdirectory": ".github/scripts", "filename": "${{ inputs.VAR_DOCKER_SCRIPT_NAME }}" },
              { "subdirectory": ".github/scripts", "filename": "${{ env.ARTIFACT_LINK_SCRIPT_NAME }}" }
            ]

      - name: "🏷️ Set up variables"
        id: setup-variables
        env:
          DOCKER_NAME: ${{ inputs.DOCKER_NAME }}
          DOCKER_PUSH: ${{ inputs.DOCKER_PUSH }}
          DOCKER_PUSH_PR: ${{ inputs.DOCKER_PUSH_PR }}
          DOCKER_REGISTRY: ${{ inputs.DOCKER_REGISTRY }}
          GAR_LOCATION: ${{ inputs.GAR_LOCATION }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NAME: ${{ inputs.NAME }}
          PROJECT_ID: ${{ inputs.PROJECT_ID }}
        run: ../${{ inputs.VAR_DOCKER_SCRIPT_NAME }}

      - name: "🔐 Get Secrets"
        uses: favedom-dev/github-reusable-workflow/.github/actions/get-google-secrets@v2.1
        id: get-secrets
        with:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          SECRETS_TO_FETCH: ${{ inputs.SECRETS_TO_FETCH }}
          DEFAULT_SECRETS_TO_FETCH: ${{ inputs.DEFAULT_SECRETS_TO_FETCH }}

      - name: "🧰 Set up build basics"
        uses: favedom-dev/github-reusable-workflow/.github/actions/build-setup-basics@v2.1
        id: build-setup-basics
        with:
          GH_RUNS_ON: ${{ inputs.GH_RUNS_ON }}
          PLATFORMS: ${{ inputs.PLATFORMS }}

      - name: "🐳 Docker"
        uses: favedom-dev/github-reusable-workflow/.github/actions/build-docker@v2.1
        id: build-docker
        with:
          ACCESS_TOKEN: ${{ steps.get-secrets.outputs.access-token }}
          ARTIFACT_LINK_SCRIPT_NAME: ${{ env.ARTIFACT_LINK_SCRIPT_NAME }}
          DOCKER_CONTEXT: ${{ inputs.DOCKER_CONTEXT }}
          DOCKER_ENABLE_CACHE: ${{ inputs.DOCKER_ENABLE_CACHE }}
          DOCKER_FILE: ${{ inputs.DOCKER_FILE }}
          DOCKER_LOCATION: ${{ steps.setup-variables.outputs.DOCKER_LOCATION }}
          DOCKER_PUSH: ${{ steps.setup-variables.outputs.DOCKER_PUSH }}
          DOCKER_URL: ${{ steps.setup-variables.outputs.DOCKER_URL }}
          GAR_LOCATION:  ${{ inputs.GAR_LOCATION }}
          GH_RUNS_ON: ${{ inputs.GH_RUNS_ON }}
          NAME: ${{ inputs.NAME }}
          PLATFORMS: ${{ inputs.PLATFORMS }}
          VERSION: ${{ inputs.VERSION }}
