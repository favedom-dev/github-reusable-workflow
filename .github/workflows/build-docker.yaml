name: Docker

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      NAME:
        description: "Name of service"
        required: true
        type: string

      VERSION:
        required: true
        type: string

      SCRIPTS_DOWNLOAD_BASE_URL:
        default: 'https://raw.githubusercontent.com/favedom-dev/github-reusable-workflow'
        required: false
        type: string

      SCRIPT_GIT_BRANCH:
        # default: 'v2'  # TODO
        default: 'pr-docker'
        required: false
        type: string

      VAR_DOCKER_SCRIPT_NAME:
        default: 'var-docker.sh'
        required: false
        type: string

      PLATFORMS:
        required: false
        type: string
        default: linux/amd64,linux/arm64

      PROJECT_ID:
        default: 'favedom-dev'
        required: false
        type: string

      GAR_LOCATION:
        default: 'us-central1'
        required: false
        type: string

      GCR_LOCATION:
        default: 'gcr.io'
        required: false
        type: string

      DOCKER_NAME:
        required: false
        type: string

      # DOCKERFILE_FILE:
      #   default: './Dockerfile'
      #   required: false
      #   type: string

      DOCKER_REGISTRY:
        default: 'docker'
        required: false
        type: string

      DOCKER_CONTEXT:
        default: '.'
        required: false
        type: string

      DOCKER_PUSH:
        default: 'true'
        required: false
        type: string

      DOCKER_PUSH_PR:
        default: ''
        required: false
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:
      GH_TOKEN:
        description: "GitHub token"
        required: true

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

jobs:

  docker:
    timeout-minutes: 10
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      DOCKER_BUILDKIT: 1
    steps:

      - name: "⬇️ Get scripts"
        id: get-scripts
        run: |
          get_script() {
            SCRIPT_URL=${SCRIPTS_DOWNLOAD_BASE_URL}/${SCRIPT_GIT_BRANCH}/.github/scripts/${SCRIPT_NAME}
            echo "Getting ${SCRIPT_NAME} from ${SCRIPT_URL}"
            curl -o ${SCRIPT_NAME} ${SCRIPT_URL}
            chmod 777 ./${SCRIPT_NAME}
          }
          SCRIPT_GIT_BRANCH=${{ inputs.SCRIPT_GIT_BRANCH }}
          SCRIPTS_DOWNLOAD_BASE_URL=${{ inputs.SCRIPTS_DOWNLOAD_BASE_URL }}

          SCRIPT_NAME=${{ inputs.VAR_DOCKER_SCRIPT_NAME }}
          get_script

      - name: "🏷️ Set up variables"
        id: setup-variables
        env:
          DOCKER_NAME: ${{ inputs.DOCKER_NAME }}
          DOCKER_PUSH: ${{ inputs.DOCKER_PUSH }}
          DOCKER_PUSH_PR: ${{ inputs.DOCKER_PUSH_PR }}
          DOCKER_REGISTRY: ${{ inputs.DOCKER_REGISTRY }}
          GAR_LOCATION: ${{ inputs.GAR_LOCATION }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NAME: ${{ inputs.NAME }}
          PROJECT_ID: ${{ inputs.PROJECT_ID }}
        run: |
          ./${{ inputs.VAR_DOCKER_SCRIPT_NAME }}
          # DOCKER_LOCATION=${{ inputs.GAR_LOCATION }}-docker.pkg.dev/${{ inputs.PROJECT_ID }}/${{ inputs.DOCKER_REGISTRY }}/${{ inputs.NAME }}
          # echo "DOCKER_LOCATION : ${DOCKER_LOCATION}"
          # echo "DOCKER_LOCATION=${DOCKER_LOCATION}" >> $GITHUB_ENV
          # echo "DOCKER_LOCATION=${DOCKER_LOCATION}" >> $GITHUB_OUTPUT

          # DOCKER_URL="https://console.cloud.google.com/artifacts/docker/${{ inputs.PROJECT_ID }}/${{ inputs.GAR_LOCATION }}/${{ inputs.DOCKER_REGISTRY }}/${{ inputs.NAME }}?project=${{ inputs.PROJECT_ID }}/"
          # echo "DOCKER_URL : ${DOCKER_URL}"
          # echo "DOCKER_URL=${DOCKER_URL}" >> $GITHUB_ENV
          # echo "DOCKER_URL=${DOCKER_URL}" >> $GITHUB_OUTPUT

          # DOCKER_PUSH="${{ inputs.DOCKER_PUSH }}"
          # if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${DOCKER_PUSH_PR}" ]; then
          #   DOCKER_PUSH="${{ inputs.DOCKER_PUSH_PR }}"
          # fi
          # echo "DOCKER_PUSH : ${DOCKER_PUSH}"
          # echo "DOCKER_PUSH=${DOCKER_PUSH}" >> $GITHUB_ENV
          # echo "DOCKER_PUSH=${DOCKER_PUSH}" >> $GITHUB_OUTPUT

      - name: "🧰 Set up gh cli"
        uses: dev-hanz-ops/install-gh-cli-action@v0.2.1
        if: ${{ !startsWith(inputs.GH_RUNS_ON, 'ubuntu') }}

      - name: "🧰 Set up QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "🧰 Set up Docker Buildx ${{ inputs.PLATFORMS }}"
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ inputs.PLATFORMS }}

      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔑 Google Auth Token"
        if: ${{ !env.ACT }}
        id: auth-gcp-token
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: "🔑 Docker Auth"
        if: ${{ !env.ACT }}
        id: auth-docker
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth-gcp-token.outputs.access_token }}'
          registry: '${{ inputs.GAR_LOCATION }}-docker.pkg.dev'  # Google Artifact Registry

      # - name: "👀 Display Values"
      #   if: ${{ env.DEBUG }}
      #   run: |
      #     echo "NAME: ${{ inputs.NAME }}"
      #     echo "VERSION: ${{ inputs.VERSION }}"
      #     echo "PROJECT_ID: ${{ inputs.PROJECT_ID }}"
      #     echo "GAR_LOCATION: ${{ inputs.GAR_LOCATION }}"
      #     echo "GCR_LOCATION: ${{ inputs.GCR_LOCATION }}"
      #     echo "DOCKER_REGISTRY: ${{ inputs.DOCKER_REGISTRY }}"

      - name: "🐳 Docker: build, tag, and push"
        uses: docker/build-push-action@v6
        if: ${{ !env.ACT }}
        with:
          context: ${{ inputs.DOCKER_CONTEXT }}
          platforms: ${{ inputs.PLATFORMS }}
          push: ${{ steps.setup-variables.outputs.DOCKER_PUSH }}
          tags: ${{ steps.setup-variables.outputs.DOCKER_LOCATION }}:${{ inputs.VERSION }},${{ steps.setup-variables.outputs.DOCKER_LOCATION }}:latest
        env:
          # Pass GitHub token as an environment variable for secure authentication
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔗 Link to Container"
        if: steps.setup-variables.outputs.DOCKER_PUSH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DOCKER_URL: ${{ steps.setup-variables.outputs.DOCKER_URL }}
# yamllint disable rule:line-length
        run: |-
          echo "${DOCKER_URL}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment ${{ github.event.number }} \
            --body "🐳 Container: [${{ inputs.NAME }} ${{ inputs.VERSION }}](${DOCKER_URL})"
          fi
# yamllint enable rule:line-length
