name: Setup
# Reusable workflow to derive cleanup-related setup variables for preview environments.

on:
  workflow_call:

    inputs:

      OVERRIDE_NAME:
        description: "Override for the derived service name"
        required: false
        type: string

      OVERRIDE_PREVIEW_NAMESPACE:
        description: "Override for the preview namespace"
        required: false
        type: string

      USE_REPO_NAME_PREVIEW_NAMESPACE:
        description: "Use repository name as preview namespace"
        default: false
        required: false
        type: boolean

      IS_STACKHAWK_READY:
        description: "Whether StackHawk scanning is configured"
        default: true
        required: false
        type: boolean

      STACKHAWK_DIRECTORY:
        description: "Directory for StackHawk configuration"
        default: 'stackhawk'
        required: false
        type: string

      STACKHAWK_TMPL_YML:
        description: "StackHawk YAML template file name"
        default: 'stackhawk-tmpl.yml'
        required: false
        type: string

      GH_RUNS_ON:
        description: "GitHub Actions runner label to use"
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

    outputs:
      NAME:
        description: "App/Service name"
        value: ${{ jobs.app.outputs.NAME }}

      PREVIEW_NAMESPACE:
        description: "Preview namespace"
        value: ${{ jobs.app.outputs.PREVIEW_NAMESPACE }}

      IS_STACKHAWK_READY:
        description: "Is Stackhawk ready"
        value: ${{ jobs.app.outputs.IS_STACKHAWK_READY }}

      STACKHAWK_DIRECTORY:
        description: "Stackhawk directory"
        value: ${{ jobs.app.outputs.STACKHAWK_DIRECTORY }}

      GH_RUNS_ON:
        # value: ${{ jobs.runner.outputs.GH_RUNS_ON }}
        value: ${{ inputs.GH_RUNS_ON }}

jobs:

  # runner:
  #   uses: favedom-dev/github-reusable-workflow/.github/workflows/setup-gha-runners.yaml@v2.1
  #   secrets: inherit

  app:
    uses: favedom-dev/github-reusable-workflow/.github/workflows/setup-app.yaml@v2.1
    # needs: [runner]
    with:
      GH_RUNS_ON: ${{ inputs.GH_RUNS_ON }}
      # IS_MONOREPO: ${{ inputs.IS_MONOREPO }}
      IS_STACKHAWK_READY: ${{ inputs.IS_STACKHAWK_READY }}
      OVERRIDE_NAME: ${{ inputs.OVERRIDE_NAME }}
      OVERRIDE_PREVIEW_NAMESPACE: ${{ inputs.OVERRIDE_PREVIEW_NAMESPACE }}
      STACKHAWK_DIRECTORY: ${{ inputs.STACKHAWK_DIRECTORY }}
      STACKHAWK_TMPL_YML: ${{ inputs.STACKHAWK_TMPL_YML }}
      USE_REPO_NAME_PREVIEW_NAMESPACE: ${{ inputs.USE_REPO_NAME_PREVIEW_NAMESPACE }}
    secrets: inherit
