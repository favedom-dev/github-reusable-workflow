name: Deploy Environment

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      NAME:
        required: true
        type: string

      VERSION:
        required: true
        type: string

      MONOREPO_APP:
        default: ''
        required: false
        type: string

      ENV_REPO_NAME:
        default: 'favedom-dev/argocd-deployments'
        required: false
        type: string

      ENV_REPO_BRANCH:
        default: 'master'
        required: false
        type: string

      ENV_REPO_PATH:
        default: 'env-repo'
        required: false
        type: string

      ENV_REPO_SUBDIR_BASE:
        default: 'dev/fanfuzenil'
        required: false
        type: string

      ENV_REPO_SUBDIR:
        required: false
        type: string

      OVERRIDE_SUBDIR_NAME:
        required: false
        type: string

      DO_PR_MERGE:
        default: 'true'
        required: false
        type: string

      VERSION_SCRIPT_BASE_URL:
        default: 'https://raw.githubusercontent.com/favedom-dev/github-reusable-workflow/'
        required: false
        type: string

      VERSION_SCRIPT_BRANCH:
        default: 'v2'
        required: false
        type: string

      VERSION_SCRIPT_DIR:
        default: '.github/scripts'
        required: false
        type: string

      VERSION_SCRIPT_NAME:
        default: 'update-values-tag.sh'
        required: false
        type: string

      YAML_FILE:
        default: 'values.yaml'
        required: false
        type: string

      GH_USER_EMAIL:
        default: 'github@powervz.com'
        required: false
        type: string

      GH_USER_NAME:
        default: 'PowerVZ GitHub Bot'
        required: false
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:
      GH_TOKEN:
        required: true

jobs:

  deploy-environment:
    timeout-minutes: 5
    runs-on: ${{ inputs.GH_RUNS_ON }}
    steps:

      - name: "⚠️ Deprecation Warning"
        run: |
          echo "::warning title=Deprecation Notice::This workflow is deprecated. Please use the new workflow instead: deploy-argocd-env.yaml"
          exit 1
