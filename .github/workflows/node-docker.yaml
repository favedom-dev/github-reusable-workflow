name: Node and Docker

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      NAME:
        description: "Name of service"
        required: true
        type: string

      VERSION:
        required: true
        type: string

      PLATFORMS:
        required: false
        type: string
        default: linux/amd64,linux/arm64

      HELM_REPO:
        default: 'https://charts.helm.sh/stable'
        required: false
        type: string

      NODE_VERSION:
        default: "20"
        required: false
        type: string

      UPLOAD_GS:
        default: false
        required: false
        type: boolean

      GS_BUCKET:
        default: 'peeq-public-assets.joinpeeq.com'
        required: false
        type: string

      DOCKER_NAME:
        required: false
        type: string

      DOCKERFILE_FILE:
        default: './Dockerfile'
        required: false
        type: string

      DOCKER_CONTEXT:
        default: '.'
        required: false
        type: string

      TAG2:
        default: 'latest'
        required: false
        type: string

      PROJECT_ID:
        default: 'favedom-dev'
        required: false
        type: string

      GAR_LOCATION:
        default: 'us-central1'
        required: false
        type: string

      DOCKER_REGISTRY:
        default: 'docker'
        required: false
        type: string

      INSTALL:
        default: true
        required: false
        type: boolean

      INSTALL_NAME:
        default: 'NPM install'
        required: false
        type: string

      INSTALL_CMD:
        default: 'npm install --legacy-peer-deps'
        required: false
        type: string

      TEST:
        default: true
        required: false
        type: boolean

      TEST_NAME:
        default: 'NPM test'
        required: false
        type: string

      TEST_CMD:
        default: 'npm test'
        required: false
        type: string

      BUILD:
        default: true
        required: false
        type: boolean

      BUILD_NAME:
        default: 'NPM build'
        required: false
        type: string

      BUILD_CMD:
        default: 'npm run build'
        required: false
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:
      GH_TOKEN:
        description: "GitHub token"
        required: true

      NPM_TOKEN:
        description: "NPM token"
        required: true

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

jobs:

  node-docker:
    timeout-minutes: 15
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    steps:

      - name: "⚠️ Deprecation Warning"
        run: |
          echo "::warning title=Deprecation Notice::This workflow is deprecated. Please use the new workflow instead: build-node-docker.yaml"
          exit 1
