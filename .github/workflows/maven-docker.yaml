name: Maven and Docker

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      NAME:
        description: "Name of service"
        required: true
        type: string

      VERSION:
        required: true
        type: string

      APP_WORKING_DIR:
        default: '.'
        required: false
        type: string

      JDK_VERSION:
        default: 21
        required: false
        type: number

      JDK_DISTRIBUTION:
        # default: 'temurin'
        default: 'corretto'
        required: false
        type: string

      MVN_VERSION:
        description: "See https://maven.apache.org/docs/history.html"
        default: "3.9.9"
        required: false
        type: string

      MVN_ENV_VARS:
        description: "-DmyVariable=someValue"
        required: false
        type: string

      MVN_ARGS:
        default: 'clean install'
        required: false
        type: string

      MVN_ARGS_EXTRA:
        required: false
        type: string

      PLATFORMS:
        required: false
        type: string
        default: linux/amd64,linux/arm64

      DOCKERFILE_FILE:
        default: './Dockerfile'
        required: false
        type: string

      TAG2:
        default: 'latest'
        required: false
        type: string

      PROJECT_ID:
        default: 'favedom-dev'
        required: false
        type: string

      GAR_LOCATION:
        default: 'us-central1'
        required: false
        type: string

      DOCKER_REGISTRY:
        default: 'docker'
        required: false
        type: string

      CREATE_CREDENTIALS_FILE:
        default: true
        required: false
        type: boolean

      EXPORT_ENVIRONMENT_VARIABLES:
        default: true
        required: false
        type: boolean

      RUN_GCP_JSON_KEY:
        default: false
        required: false
        type: boolean

      SCAN_JAR:
        default: './target/*.jar'
        required: false
        type: string

      VCS_PREFIX_CORRECTION:
        default: 'src/main/java'
        required: false
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:
      GH_TOKEN:
        description: "GitHub token"
        required: true

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

      MVN_ARGS_SECRETS:
        description: "Maven args that contain secrets"
        required: false

      GCP_JSON_KEY:
        required: false

      SHIFTLEFT_ACCESS_TOKEN:
        description: "Shiftleft/Qwiet token"
        required: false

jobs:

  maven-docker:
    timeout-minutes: 15
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    steps:

      - name: "⚠️ Deprecation Warning"
        run: |
          echo "::warning title=Deprecation Notice::This workflow is deprecated. Please use the new workflow instead: build-maven-docker.yaml"
          exit 1
