name: Maven and Docker

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      NAME:
        description: "Name of service"
        required: true
        type: string

      VERSION:
        required: true
        type: string

      APP_WORKING_DIR:
        default: '.'
        required: false
        type: string

      JDK_VERSION:
        default: 21
        required: false
        type: number

      JDK_DISTRIBUTION:
        # default: 'temurin'
        default: 'corretto'
        required: false
        type: string

      MVN_VERSION:
        description: "See https://maven.apache.org/docs/history.html"
        default: "3.9.9"
        required: false
        type: string

      MVN_ENV_VARS:
        description: "-DmyVariable=someValue"
        required: false
        type: string

      MVN_ARGS:
        default: 'clean install'
        required: false
        type: string

      MVN_ARGS_EXTRA:
        required: false
        type: string

      PLATFORMS:
        required: false
        type: string
        default: linux/amd64,linux/arm64

      DOCKERFILE_FILE:
        default: './Dockerfile'
        required: false
        type: string

      TAG2:
        default: 'latest'
        required: false
        type: string

      PROJECT_ID:
        default: 'favedom-dev'
        required: false
        type: string

      GAR_LOCATION:
        default: 'us-central1'
        required: false
        type: string

      DOCKER_REGISTRY:
        default: 'docker'
        required: false
        type: string

      CREATE_CREDENTIALS_FILE:
        default: true
        required: false
        type: boolean

      EXPORT_ENVIRONMENT_VARIABLES:
        default: true
        required: false
        type: boolean

      RUN_GCP_JSON_KEY:
        default: false
        required: false
        type: boolean

      SCAN_JAR:
        default: './target/*.jar'
        required: false
        type: string

      VCS_PREFIX_CORRECTION:
        default: 'src/main/java'
        required: false
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:
      GH_TOKEN:
        description: "GitHub token"
        required: true

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

      MVN_ARGS_SECRETS:
        description: "Maven args that contain secrets"
        required: false

      GCP_JSON_KEY:
        required: false

      SHIFTLEFT_ACCESS_TOKEN:
        description: "Shiftleft/Qwiet token"
        required: false

jobs:

  maven-docker:
    timeout-minutes: 15
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    steps:

      - name: "🔧 Setup variables"
        id: setup-variables
        run: |
          DOCKER_LOCATION=${{ inputs.GAR_LOCATION }}-docker.pkg.dev/${{ inputs.PROJECT_ID }}/${{ inputs.DOCKER_REGISTRY }}/${{ inputs.NAME }}
          echo "DOCKER_LOCATION : ${DOCKER_LOCATION}"
          echo "DOCKER_LOCATION=${DOCKER_LOCATION}" >> $GITHUB_ENV
          echo "DOCKER_LOCATION=${DOCKER_LOCATION}" >> $GITHUB_OUTPUT
          DOCKER_URL="https://console.cloud.google.com/artifacts/docker/${{ inputs.PROJECT_ID }}/${{ inputs.GAR_LOCATION }}/${{ inputs.DOCKER_REGISTRY }}/${{ inputs.NAME }}?project=${{ inputs.PROJECT_ID }}/"
          echo "DOCKER_URL : ${DOCKER_URL}"
          echo "DOCKER_URL=${DOCKER_URL}" >> $GITHUB_ENV
          echo "DOCKER_URL=${DOCKER_URL}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ inputs.PLATFORMS }}

      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "🔧 Google Auth Token"
        id: auth-gcp-token
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'
          create_credentials_file: ${{ inputs.CREATE_CREDENTIALS_FILE }}
          export_environment_variables: ${{ inputs.EXPORT_ENVIRONMENT_VARIABLES }}

      - name: "🔧 Google Auth JSON Key"
        id: auth-gcp-key
        if: inputs.RUN_GCP_JSON_KEY
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_JSON_KEY }}'

      # https://github.com/google-github-actions/setup-gcloud
      # - name: 'Set up Cloud SDK'
      #   uses: 'google-github-actions/setup-gcloud@v0'

      - name: "🔧 Docker Auth: GAR"
        if: ${{ !env.ACT }}
        id: auth-docker
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth-gcp-token.outputs.access_token }}'
          registry: '${{ inputs.GAR_LOCATION }}-docker.pkg.dev'  # Google Artifact Registry

      - name: "🔧 Set up JDK ${{ inputs.JDK_VERSION }} ${{ inputs.JDK_DISTRIBUTION }}"
        uses: actions/setup-java@v4
        with:
          java-version: '${{ inputs.JDK_VERSION }}'
          distribution: '${{ inputs.JDK_DISTRIBUTION }}'

      - name: "🔧 Set up Maven ${{ inputs.MVN_VERSION }}"
        uses: stCarolas/setup-maven@v5
        if: ${{ !startsWith(github.event.inputs.GH_RUNS_ON, 'ubuntu') }}
        with:
          maven-version: '${{ inputs.MVN_VERSION }}'

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ inputs.NAME }}-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ inputs.NAME }}-${{ runner.os }}-maven-

      - name: "🔧 Maven ~/.m2/settings.xml"
        run: |
          # wget https://raw.githubusercontent.com/favedom-dev/github-reusable-workflow/master/.m2/settings.xml

          # Input and output files
          INPUT_FILE="dl-settings.xml"
          # OUTPUT_FILE="~/.m2/settings.xml"
          OUTPUT_FILE="./settings.xml"

          curl -o ${INPUT_FILE} https://raw.githubusercontent.com/favedom-dev/github-reusable-workflow/master/.m2/settings.xml
          # envsubst < ./settings.xml > ~/.m2/settings.xml

          mkdir -p ~/.m2

          # Read the entire content of the file into a variable
          file_content=$(< "${INPUT_FILE}")

          # Replace variables dynamically in the file content
          # Escape quotes and use eval for variable expansion
          eval "echo \"$(echo "$file_content" | sed 's/"/\\"/g')\"" > "${OUTPUT_FILE}"

          echo "Variables replaced and saved to ${OUTPUT_FILE}"

          echo "====="
          cat ${OUTPUT_FILE}
          echo "====="

          mv "${OUTPUT_FILE}" ~/.m2/settings.xml
          echo "====="
          cat ~/.m2/settings.xml
          echo "====="

      - name: "🔨 Maven set version"
        working-directory: ${{ inputs.APP_WORKING_DIR }}
        env:
          VERSION: ${{ inputs.VERSION }}
        run: |
          mvn -B versions:set -DnewVersion=${VERSION}

      - name: "🔨 Build with Maven"
        working-directory: ${{ inputs.APP_WORKING_DIR }}
        env:
          GCP_ACCESS_TOKEN: '${{ steps.auth-gcp-token.outputs.access_token }}'
          GCP_ACCESS_TOKEN_EXPIRATION: '${{ steps.auth-gcp-token.outputs.access_token_expiration }}'
        run: |
          echo "MVN_ARGS        : ${{ inputs.MVN_ARGS }}"
          echo "MVN_ENV_VARS    : ${{ inputs.MVN_ENV_VARS }}"
          echo "MVN_ARGS_EXTRA  : ${{ inputs.MVN_ARGS_EXTRA }}"
          echo "MVN_ARGS_SECRETS: ${{ secrets.MVN_ARGS_SECRETS }}"
          mvn -B \
          ${{ secrets.MVN_ARGS_SECRETS }} \
          ${{ inputs.MVN_ENV_VARS }} \
          ${{ inputs.MVN_ARGS }} \
          ${{ inputs.MVN_ARGS_EXTRA }}

      - name: Download Qwiet CLI
        if: ${{ env.SHIFTLEFT_ACCESS_TOKEN != '' }}
        env:
          SHIFTLEFT_ACCESS_TOKEN: ${{ secrets.SHIFTLEFT_ACCESS_TOKEN }}
        run: |
          curl https://cdn.shiftleft.io/download/sl > $HOME/sl && chmod a+rx $HOME/sl

      # https://docs.shiftleft.io/cli/reference/analyze
      - name: Qwiet Analyze with NextGen Static Analysis
        if: ${{ env.SHIFTLEFT_ACCESS_TOKEN != '' }}
        env:
          SHIFTLEFT_ACCESS_TOKEN: ${{ secrets.SHIFTLEFT_ACCESS_TOKEN }}
        run: |
          $HOME/sl analyze \
          --app ${{ inputs.NAME }} \
          --java \
          --vcs-prefix-correction "*=${{ inputs.VCS_PREFIX_CORRECTION }}" \
          --cpg \
          ${{ inputs.SCAN_JAR }}

      - name: "🔧 Setup Docker tags"
        id: docker-tags
        working-directory: ${{ inputs.APP_WORKING_DIR }}
        env:
          DOCKER_LOCATION: ${{ steps.setup-variables.outputs.DOCKER_LOCATION }}
        run: |-
          DOCKER_TAGS=${{ env.DOCKER_LOCATION }}:${{ inputs.VERSION }}
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            DOCKER_TAGS=${DOCKER_TAGS},${{ env.DOCKER_LOCATION }}:latest
          fi
          echo "DOCKER_TAGS: ${DOCKER_TAGS}"
          echo "tags=${DOCKER_TAGS}" >> $GITHUB_OUTPUT

      - name: "🐳 Docker: build, tag, and push"
        uses: docker/build-push-action@v5
        if: ${{ !env.ACT }}
        with:
          context: ${{ inputs.APP_WORKING_DIR }}
          file: ${{ env.DOCKERFILE_FILE }}
          platforms: ${{ inputs.PLATFORMS }}
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}

      - name: "🌐 Link to Container"
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DOCKER_URL: ${{ steps.setup-variables.outputs.DOCKER_URL }}
# yamllint disable rule:line-length
        run: |-
          echo "${DOCKER_URL}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment ${{ github.event.number }} \
            --body "🐳 Container: [${{ inputs.NAME }} ${{ inputs.VERSION }}](${DOCKER_URL})"
          fi
# yamllint enable rule:line-length
