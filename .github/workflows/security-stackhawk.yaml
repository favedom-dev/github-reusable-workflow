name: Stackhawk

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      NAME:  # name of service, (ex: users)
        required: true
        type: string

      NAMESPACE:
        required: true
        type: string

      API_PATH:
        required: true
        type: string

      APP_HOST:
        required: false
        type: string

      APP_ID:
        required: false
        type: string

      SECRETS_TO_FETCH:
        description: "Secrets to fetch from Google Secret Manager"
        required: false
        type: string

      DEFAULT_SECRETS_TO_FETCH:
        description: "Default secrets to fetch from Google Secret Manager"
        required: false
        type: string
        default: |
          GH_TOKEN:projects/1054075584205/secrets/core_GITHUB_FAVEDOM_DEV_PASSWORD,
          HAWK_API_KEY:projects/1054075584205/secrets/cicd_HAWK_API_KEY

      TEST_USERNAME:
        default: 'stackhawk@velocityz.com'
        required: false
        type: string

      BASE_DOMAIN:
        default: 'dev.fanfuzenil.com'
        required: false
        type: string

      KEYCLOAK_REALM:
        default: 'fanfuzenil'
        required: false
        type: string

      HEALTH_PATH:
        default: 'actuator/health'
        required: false
        type: string

      HEALTH_RETRIES:
        default: 6
        required: false
        type: number

      HEALTH_RETRY_DELAY:
        default: 15
        required: false
        type: number

      FILE_GIT_BRANCH:
        default: 'v2.1'
        required: false
        type: string
        description: "Used typically for testing new non-merged helm changes"

      FILE_DOWNLOAD_BASE_URL:
        default: 'https://raw.githubusercontent.com/favedom-dev/github-reusable-workflow'
        required: false
        type: string

      CURL_ARGS:
        default: ''
        required: false
        type: string

      JDK_VERSION:
        default: 21
        required: false
        type: number

      JDK_DISTRIBUTION:
        default: 'temurin'
        required: false
        type: string

      AUTH0_AUDIENCE:
        default: ''
        required: false
        type: string

      AUTH0_DOMAIN:
        default: 'dev-r07m4b63j2tgnwyc.us.auth0.com'
        required: false
        type: string

      AUTH0_SCOPE:
        default: 'openid profile email'
        required: false
        type: string

      STACKHAWK_SLEEP_DELAY:
        required: false
        type: number

      STACKHAWK_SLEEP_DELAY_DEFAULT:
        default: 15
        required: false
        type: number

      STACKHAWK_SLEEP_DELAY_DEFAULT_JAVA:
        default: 30
        required: false
        type: number

      STACKHAWK_SETUP_SCRIPT_NAME:
        default: 'setup-stackhawk.sh'
        required: false
        type: string

      STACKHAWK_TMPL:
        default: 'stackhawk-tmpl.yml'
        required: false
        type: string

      STACKHAWK_TMPL_YML:
        default: 'stackhawk-tmpl.yml'
        description: "OBSOLETE"
        required: false
        type: string

      STACKHAWK_DIRECTORY:
        default: 'stackhawk'
        required: false
        type: string

      STACKHAWK_APP_ID:
        required: false
        type: string

      STACKHAWK_APP_ENV:
        default: 'Preview'
        required: false
        type: string

      STACKHAWK_DRYRUN:
        default: false
        required: false
        type: boolean

      STACKHAWK_VERBOSE:
        default: false
        required: false
        type: boolean

      STACKHAWK_DEBUG:
        default: true
        required: false
        type: boolean

      STACKHAWK_CODESCANNINGALERTS:
        default: true
        required: false
        type: boolean

      JOBS_TIMEOUT:
        default: 10
        required: false
        type: number

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

      # GH_TOKEN:  # GitHub token
      #   required: true

      # HAWK_API_KEY:
      #   required: true

      # TEST_PASSWORD:  # stackhawk peeq TEST_USERNAME password
      #   required: true

jobs:

  stackhawk:
    timeout-minutes: ${{ inputs.JOBS_TIMEOUT }}
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    steps:

#       - name: "⏩ SKIPPING Stackhawk"
#         run: |
#           echo "TODO: re-enable"

      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "🔐 Get Secrets"
        uses: favedom-dev/github-reusable-workflow/.github/actions/get-google-secrets@v2.1
        id: get-secrets
        with:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          SECRETS_TO_FETCH: ${{ inputs.SECRETS_TO_FETCH }}
          DEFAULT_SECRETS_TO_FETCH: ${{ inputs.DEFAULT_SECRETS_TO_FETCH }}

      - name: "⚙️ Set up JDK ${{ inputs.JDK_DISTRIBUTION }} ${{ inputs.JDK_VERSION }}"
        uses: actions/setup-java@v4
        with:
          java-version: '${{ inputs.JDK_VERSION }}'
          distribution: '${{ inputs.JDK_DISTRIBUTION }}'

      - name: "🏷️ Set up variables"
        id: setup-variables
        env:
          INPUT_APP_HOST: ${{ inputs.APP_HOST }}
          INPUT_AUTH0_AUDIENCE: ${{ inputs.AUTH0_AUDIENCE }}
          INPUT_AUTH0_DOMAIN: ${{ inputs.AUTH0_DOMAIN }}
          INPUT_AUTH0_SCOPE: ${{ inputs.AUTH0_SCOPE }}
          INPUT_STACKHAWK_TMPL: ${{ inputs.STACKHAWK_TMPL }}
          DEFAULT_APP_HOST: https://${{ inputs.NAMESPACE }}.${{ inputs.BASE_DOMAIN }}
        run: |
          APP_HOST=${DEFAULT_APP_HOST}
          echo "APP_HOST: ${APP_HOST}"
          if [ -n "${INPUT_APP_HOST}" ]; then
            APP_HOST=${INPUT_APP_HOST}
          fi
          echo "APP_HOST: ${APP_HOST}"
          echo "APP_HOST=${APP_HOST}" >> $GITHUB_OUTPUT
          echo "APP_HOST=${APP_HOST}" >> $GITHUB_ENV

          if [ -n "${INPUT_AUTH0_DOMAIN}" ]; then
            AUTH0_DOMAIN="${INPUT_AUTH0_DOMAIN}"
            echo "AUTH0_DOMAIN: ${AUTH0_DOMAIN}"
            echo "AUTH0_DOMAIN=${AUTH0_DOMAIN}" >> $GITHUB_OUTPUT
            echo "AUTH0_DOMAIN=${AUTH0_DOMAIN}" >> $GITHUB_ENV

            AUTH0_AUDIENCE="${INPUT_AUTH0_AUDIENCE:-https://${AUTH0_DOMAIN}/api/v2/}"
            echo "AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}"
            echo "AUTH0_AUDIENCE=${AUTH0_AUDIENCE}" >> $GITHUB_OUTPUT
            echo "AUTH0_AUDIENCE=${AUTH0_AUDIENCE}" >> $GITHUB_ENV
          fi

          if [ -n "${INPUT_AUTH0_SCOPE}" ]; then
            AUTH0_SCOPE="${INPUT_AUTH0_SCOPE}"
            echo "AUTH0_SCOPE: ${AUTH0_SCOPE}"
            echo "AUTH0_SCOPE=${AUTH0_SCOPE}" >> $GITHUB_OUTPUT
            echo "AUTH0_SCOPE=${AUTH0_SCOPE}" >> $GITHUB_ENV
          fi

          if [ -n "${INPUT_STACKHAWK_TMPL}" ]; then
            STACKHAWK_TMPL="${INPUT_STACKHAWK_TMPL}"
            echo "STACKHAWK_TMPL: ${STACKHAWK_TMPL}"
            echo "STACKHAWK_TMPL=${STACKHAWK_TMPL}" >> $GITHUB_OUTPUT
            echo "STACKHAWK_TMPL=${STACKHAWK_TMPL}" >> $GITHUB_ENV
          fi

      - name: "⬇️ Get reusable files"
        uses: favedom-dev/github-reusable-workflow/.github/actions/get-reusable-files@v2.1
        id: get-reusable-files
        # if: github.event_name != 'pull_request'
        with:
          FILE_GIT_BRANCH: ${{ inputs.FILE_GIT_BRANCH }}
          FILE_DOWNLOAD_BASE_URL: ${{ inputs.FILE_DOWNLOAD_BASE_URL }}
          FILES_TO_DOWNLOAD: |
            [
              { "subdirectory": "stackhawk", "filename": "${{ inputs.STACKHAWK_SETUP_SCRIPT_NAME }}" }
            ]

      - name: "🔧 Set up stackhawk"
        working-directory: ${{ inputs.STACKHAWK_DIRECTORY }}
        env:
          SCRIPT_NAME: ${{ inputs.STACKHAWK_SETUP_SCRIPT_NAME }}
          APP_NAME: ${{ inputs.NAME }}
          APP_HOST: ${{ steps.setup-variables.outputs.APP_HOST }}
          APP_ID: ${{ inputs.APP_ID }}
          NAMESPACE: ${{ inputs.NAMESPACE }}
          API_PATH: ${{ inputs.API_PATH }}
          TEST_USERNAME: ${{ inputs.TEST_USERNAME }}
          # TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_PASSWORD: ${{ env.TEST_PASSWORD }}
          KEYCLOAK_AUTH: https://identity.${{ inputs.BASE_DOMAIN }}/realms/${{ inputs.KEYCLOAK_REALM }}/protocol/openid-connect/token
        run: |
          env | sort
          if [ -f "${{ github.workspace }}/../${SCRIPT_NAME}" ]; then
            cp ${{ github.workspace }}/../${SCRIPT_NAME} ./${SCRIPT_NAME}
          else
            echo "File does not exist: ${{ github.workspace }}/../${SCRIPT_NAME}"
          fi

          chmod 777 ./${SCRIPT_NAME}
          ./${SCRIPT_NAME}

      - name: "🕸️ DEBUG: setup stackhawk"
        working-directory: ${{ inputs.STACKHAWK_DIRECTORY }}
        run: |
          # cat ./stackhawk.yml
          yq ./stackhawk.yml

      - name: "😴 Set Stackhawk sleep"
        id: 'set-stackhawk-sleep'
        working-directory: ${{ inputs.STACKHAWK_DIRECTORY }}
        env:
          STACKHAWK_SLEEP_DELAY: ${{ inputs.STACKHAWK_SLEEP_DELAY }}
          STACKHAWK_SLEEP_DELAY_DEFAULT: ${{ inputs.STACKHAWK_SLEEP_DELAY_DEFAULT }}
          STACKHAWK_SLEEP_DELAY_DEFAULT_JAVA: ${{ inputs.STACKHAWK_SLEEP_DELAY_DEFAULT_JAVA }}
        run: |
          if [ "${STACKHAWK_SLEEP_DELAY}" -gt 0 ]; then
            echo "Using STACKHAWK_SLEEP_DELAY : ${STACKHAWK_SLEEP_DELAY}"
          else
            STACKHAWK_SLEEP_DELAY="${STACKHAWK_SLEEP_DELAY_DEFAULT}"
            echo "Using STACKHAWK_SLEEP_DELAY_DEFAULT : ${STACKHAWK_SLEEP_DELAY}"
            if [ "$(yq -r '.app | has("graphqlConf")' ./stackhawk.yml)" = "true" ];then
              STACKHAWK_SLEEP_DELAY="${STACKHAWK_SLEEP_DELAY_DEFAULT_JAVA}"
              echo "Using STACKHAWK_SLEEP_DELAY_DEFAULT_JAVA : ${STACKHAWK_SLEEP_DELAY}"
            fi
          fi
          echo "STACKHAWK_SLEEP_DELAY : ${STACKHAWK_SLEEP_DELAY}"
          echo "STACKHAWK_SLEEP_DELAY=${STACKHAWK_SLEEP_DELAY}" >> $GITHUB_OUTPUT

      # - name: "💓 Check that service is alive"
      #   env:
      #     APP_HOST: ${{ steps.setup-variables.outputs.APP_HOST }}
      #     API_PATH: ${{ inputs.API_PATH }}
      #     HEALTH_PATH: ${{ inputs.HEALTH_PATH }}
      #     HEALTH_RETRIES: ${{ inputs.HEALTH_RETRIES }}
      #     HEALTH_RETRY_DELAY: ${{ inputs.HEALTH_RETRY_DELAY }}
      #     STACKHAWK_SLEEP_DELAY: ${{ steps.set-stackhawk-sleep.outputs.STACKHAWK_SLEEP_DELAY }}
      #   run: |
      #     sleep ${STACKHAWK_SLEEP_DELAY}
      #     echo "CHECKING: ${APP_HOST}${API_PATH}${HEALTH_PATH}"
      #     curl --fail --retry ${HEALTH_RETRIES} --retry-delay ${HEALTH_RETRY_DELAY} ${{ inputs.CURL_ARGS }} ${APP_HOST}${API_PATH}${HEALTH_PATH}

      - name: "💓 Check that service is alive"
        env:
          EXPECTED_STATUS: 200
          HEALTH_RETRIES: ${{ inputs.HEALTH_RETRIES }}
          HEALTH_RETRY_DELAY: ${{ inputs.HEALTH_RETRY_DELAY }}
          STACKHAWK_SLEEP_DELAY: ${{ steps.set-stackhawk-sleep.outputs.STACKHAWK_SLEEP_DELAY }}
          TARGET_URL: ${{ steps.setup-variables.outputs.APP_HOST }}${{ inputs.API_PATH }}${{ inputs.HEALTH_PATH }}
        # This step will not fail until all retries are exhausted and the final exit code is non-zero
        run: |
          echo "Waiting for resource at ${TARGET_URL} to become available...  Initial wait ${STACKHAWK_SLEEP_DELAY}"
          sleep ${STACKHAWK_SLEEP_DELAY}

          for i in $(seq 1 $HEALTH_RETRIES); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${TARGET_URL}")

            if [ "$HTTP_CODE" -eq "$EXPECTED_STATUS" ]; then
              echo "Successfully received HTTP ${HTTP_CODE} on attempt $i."
              # Success, exit the script with a zero status
              exit 0
            fi

            if [ "$HTTP_CODE" -eq 404 ]; then
              echo "Attempt ${i}/${HEALTH_RETRIES}: Received HTTP 404. Retrying in ${HEALTH_RETRY_DELAY} seconds..."
              sleep "${HEALTH_RETRY_DELAY}"
            else
              # Handle other non-success status codes (e.g., 401, 500, etc.)
              echo "Attempt ${i}/${HEALTH_RETRIES}: Received unexpected HTTP ${HTTP_CODE}. Retrying in ${HEALTH_RETRY_DELAY} seconds..."
              sleep "${HEALTH_RETRY_DELAY}"
            fi
          done

          # If the loop finishes without success, the script will reach here and fail the step.
          echo "ERROR: Resource not available after ${HEALTH_RETRIES} attempts."
          exit 1

      - name: "🦅 Run Stackhawk (timeout ${{ inputs.JOBS_TIMEOUT }} minutes)"
        env:
          APP_HOST: ${{ steps.setup-variables.outputs.APP_HOST }}
          # APP_ID: ${{ inputs.STACKHAWK_APP_ID }}
          APP_ENV: ${{ inputs.STACKHAWK_APP_ENV }}
        # uses: stackhawk/hawkscan-action@v2.0.0
        # https://github.com/stackhawk/hawkscan-action
        uses: stackhawk/hawkscan-action@v2
        with:
          apiKey: ${{ env.HAWK_API_KEY }}
          dryRun: ${{ inputs.STACKHAWK_DRYRUN }}
          workspace: ./${{ inputs.STACKHAWK_DIRECTORY }}
          verbose: ${{ inputs.STACKHAWK_VERBOSE }}
          debug: ${{ inputs.STACKHAWK_DEBUG }}
          # codeScanningAlerts: ${{ inputs.STACKHAWK_CODESCANNINGALERTS }}
          githubToken: ${{ env.GH_TOKEN }}
          configurationFiles: |
            stackhawk.yml
