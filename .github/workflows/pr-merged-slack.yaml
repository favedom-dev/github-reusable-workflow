name: "PR Merged → Slack Notification"

on:
  workflow_call:
    inputs:

      channel-id:
        default: "#test-bot"
        description: "Slack channel ID or name (e.g. deploys or C1234567890)"
        required: false # true
        type: string

      marker:
        description: "Text to identify the changelog comment"
        default: "<!-- Image Generated:"
        type: string

      include-changed-files:
        description: "Include list of changed YAML files in message"
        default: false
        type: boolean

      CLUSTER_NAME:
        default: 'core'
        required: false
        type: string

      CLUSTER_PROJECT_ID:
        default: 'core-services-370815'
        required: false
        type: string

      LOCATION:
        default: 'us-central1'
        required: false
        type: string

      # TODO
      SECRETS_TO_FETCH:
        description: "Secrets to fetch from Google Secret Manager"
        required: false
        type: string
        # default: |
        #   SLACK_BOT_TOKEN:projects/1054075584205/secrets/cicd_prod_SLACK_BOT_TOKEN

      DEFAULT_SECRETS_TO_FETCH:
        description: "Default secrets to fetch from Google Secret Manager"
        required: false
        type: string
        default: |
          GH_TOKEN:projects/1054075584205/secrets/core_GITHUB_FAVEDOM_DEV_PASSWORD,
          SLACK_BOT_TOKEN:projects/1054075584205/secrets/cicd_SLACK_DEVOPS_TOKEN

      FILE_DOWNLOAD_BASE_URL:
        default: 'https://raw.githubusercontent.com/favedom-dev/github-reusable-workflow'
        required: false
        type: string

      FILE_GIT_BRANCH:
        default: 'v2' # 'v2.1'
        required: false
        type: string
        description: "Used typically for testing new non-merged helm changes"

    secrets:

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

jobs:
  check-yaml-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    outputs:
      has_yaml_changes: ${{ steps.check.outputs.has_yaml_changes }}
      changed_files: ${{ steps.check.outputs.changed_files }}
      UNIQUE_PAIRS: ${{ steps.check.outputs.UNIQUE_PAIRS }}
      CHANGED_LIST: ${{ steps.check.outputs.CHANGED_LIST }}
    steps:

      - name: "☁️ Checkout with full history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🔐 Get Secrets"
        uses: favedom-dev/github-reusable-workflow/.github/actions/get-google-secrets@v2.1
        id: get-secrets
        with:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          SECRETS_TO_FETCH: ${{ inputs.SECRETS_TO_FETCH }}
          DEFAULT_SECRETS_TO_FETCH: ${{ inputs.DEFAULT_SECRETS_TO_FETCH }}

      # - name: "🕵️ Detect YAML changes"
      #   id: check
      #   env:
      #     GITHUB_TOKEN: ${{ env.GH_TOKEN }}
      #   run: |
      #     BASE="${{ github.event.pull_request.base.sha }}"
      #     HEAD="${{ github.event.pull_request.head.sha }}"

      #     echo "Comparing $BASE..$HEAD"

      #     CHANGED=$(curl -s \
      #       -H "Authorization: token $GITHUB_TOKEN" \
      #       -H "Accept: application/vnd.github.v3+json" \
      #       "https://api.github.com/repos/${{ github.repository }}/compare/$BASE...$HEAD" \
      #       | jq -r '.files[].filename | select(test("\\.(yaml|yml)$"))')

      #     if [ -z "$CHANGED" ]; then
      #       echo "has_yaml_changes=false" >> $GITHUB_OUTPUT
      #       echo "No .yaml/.yml files changed"
      #     else
      #       echo "has_yaml_changes=true" >> $GITHUB_OUTPUT
      #       FORMATTED=$(echo "$CHANGED" | sed 's/^/  • /' || true)
      #       echo "changed_files<<EOF" >> $GITHUB_OUTPUT
      #       echo "$FORMATTED" >> $GITHUB_OUTPUT
      #       echo "EOF" >> $GITHUB_OUTPUT
      #       echo "YAML files changed:"
      #       echo "$CHANGED"
      #     fi

      - name: "🕵️ Detect YAML changes"
        id: check
        env:
          GITHUB_TOKEN: ${{ env.GH_TOKEN }}
        run: |
          set -euo pipefail

          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          echo "Comparing $BASE..$HEAD"

          DATA=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/compare/$BASE...$HEAD")

          # Extract only .yaml/.yml files under <env>/<tenant>/...
          # Output format: env tenant full-path
          PAIRS=$(echo "$DATA" | jq -r '
            .files[]
            | select(.filename | test("\\.(yaml|yml)$"; "i"))
            | .filename as $f
            | ($f | split("/")) as $parts
            | select($parts | length >= 3)
            | "\($parts[0])\t\($parts[1])\t$f"
          ')

          if [ -z "$PAIRS" ]; then
            echo "has_yaml_changes=false" >> $GITHUB_OUTPUT
            echo "env_tenant_pairs=" >> $GITHUB_OUTPUT
            echo "changed_files=" >> $GITHUB_OUTPUT
            echo "No YAML files changed under <env>/<tenant>/"
            exit 0
          fi

          echo "has_yaml_changes=true" >> $GITHUB_OUTPUT

          # Unique env-tenant pairs (preserves relationship!)
          UNIQUE_PAIRS=$(echo "$PAIRS" | cut -f1,2 | sort -u)

          # Format as JSON array of objects → perfect for matrix or fromJSON later
          MATRIX_JSON=$(echo "$UNIQUE_PAIRS" | jq -R 'split("\t") | {env: .[0], tenant: .[1]}' | jq -s .)

          # Pretty list of changed files
          CHANGED_LIST=$(echo "$PAIRS" | cut -f3 | sed 's/^/  • /')

          # Set outputs
          echo "env_tenant_pairs<<EOF" >> $GITHUB_OUTPUT
          echo "$UNIQUE_PAIRS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_LIST" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Human readable summary
          echo "YAML changes detected in these env/tenant combinations:"
          echo "$UNIQUE_PAIRS" | awk '{printf "  • %s/%s\n", $1, $2}'
          echo ""
          echo "Changed files:"
          echo "$CHANGED_LIST"

          echo "UNIQUE PAIRS:" >> $GITHUB_STEP_SUMMARY
          # echo "$UNIQUE_PAIRS" | awk '{printf "  • %s/%s\n", $1, $2}' >> $GITHUB_STEP_SUMMARY
          echo "Changed files:" >> $GITHUB_STEP_SUMMARY
          echo "$CHANGED_LIST" >> $GITHUB_STEP_SUMMARY

  notify-and-track:
    needs: check-yaml-changes
    if: needs.check-yaml-changes.outputs.has_yaml_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    outputs:
      thread_ts: ${{ steps.slack.outputs.thread_ts }}
    steps:

      - name: "☁️ Checkout"
        uses: actions/checkout@v4

      - name: "⬇️ Get reusable files"
        uses: favedom-dev/github-reusable-workflow/.github/actions/get-reusable-files@v2.1
        id: get-reusable-files
        with:
          FILE_GIT_BRANCH: ${{ inputs.FILE_GIT_BRANCH }}
          FILE_DOWNLOAD_BASE_URL: ${{ inputs.FILE_DOWNLOAD_BASE_URL }}
          FILES_TO_DOWNLOAD: |
            [
              { "subdirectory": ".github/scripts", "filename": "mrkdwn-slack.sh" }
            ]

      - name: "🔐 Get Secrets"
        uses: favedom-dev/github-reusable-workflow/.github/actions/get-google-secrets@v2.1
        id: get-secrets
        with:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          SECRETS_TO_FETCH: ${{ inputs.SECRETS_TO_FETCH }}
          DEFAULT_SECRETS_TO_FETCH: ${{ inputs.DEFAULT_SECRETS_TO_FETCH }}

      - name: "🔓 Get GKE Credentials cluster: ${{ inputs.CLUSTER_NAME }}"
        id: 'get-credentials'
        uses: 'google-github-actions/get-gke-credentials@v2'
        with:
          cluster_name: ${{ inputs.CLUSTER_NAME }}
          location: ${{ inputs.LOCATION }}
          project_id: ${{ inputs.CLUSTER_PROJECT_ID }}

      # ------------------------------------------------------------------
      # Find the changelog comment
      # ------------------------------------------------------------------
      - name: "🔎 Find Marker in PR Body"
        id: comment
        env:
          GITHUB_TOKEN: ${{ env.GH_TOKEN }}
        run: |
          # get the PR body directly in JSON format
          PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} \
            --json body \
            --jq '.body')

          # Note: We are now searching the PR_BODY variable
          # BODY=$(echo "$PR_BODY" | jq -R -r --arg m "${{ inputs.marker }}" \
          #   '. | select(contains($m))' | head -n 1)
          BODY=$(echo "$PR_BODY" | awk '/${{ inputs.marker }}/{found=1; next} found')

          pwd
          ls -la ../
          echo "BODY : ${BODY}"

          # Check if BODY is empty
          if [ -z "$BODY" ]; then
            # Simple case: single-line output works fine without a delimiter
            echo "comment=No changelog content found in PR body" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Convert Markdown to Slack mrkdwn
          # The -e flag ensures proper newline interpretation
          CLEAN=$(echo -e "${BODY}" | ../mrkdwn-slack.sh)
          echo "CLEAN : ${CLEAN}"

          # Use the EOT delimiter for multi-line output to GITHUB_OUTPUT
          # This correctly handles newlines and special characters in the converted text.
          echo "comment<<EOT" >> $GITHUB_OUTPUT
          echo "$CLEAN" >> $GITHUB_OUTPUT
          echo "EOT" >> $GITHUB_OUTPUT

          # if [ -z "$BODY" ]; then
          #   echo "comment=No changelog content found in PR body" >> $GITHUB_OUTPUT
          # else
          #   # Escape newlines and quotes for single-line output if necessary
          #   # CLEAN=$(echo "$BODY" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          #   # echo "1CLEAN : ${CLEAN}"
          #   CLEAN=$(echo -e "${BODY}" | ../mrkdwn-slack.sh)
          #   echo "CLEAN : ${CLEAN}"
          #   echo "comment=$CLEAN" >> $GITHUB_OUTPUT
          # fi

      # ------------------------------------------------------------------
      # Post to Slack and capture thread_ts
      # ------------------------------------------------------------------
      - name: "📝 Post PR message to Slack"
        id: slack
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ inputs.channel-id }}",
              "text": "🚀 Deployment Update Initiated: PR #${{ github.event.pull_request.number }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚀 Deployment Update Initiated"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🛠️ Key Details*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\nDeployment Started 🛠️"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Environment:*\n`${{ needs.check-yaml-changes.outputs.UNIQUE_PAIRS }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*GitHub PR Link:*\n<${{ github.event.pull_request.html_url }}|#${{ github.event.pull_request.number }}>"
                    }
                  ]
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*📰 Release Changelog*"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.comment.outputs.comment }}\n\n[Link to Full Changelog](${ env.CHANGELOG_URL })"
                  }
                }
              ]
            }



# {
#   "channel": "${{ inputs.channel-id }}",
#   "text": ":merged: *PR #${{ github.event.pull_request.number }} merged* by ${{ github.event.pull_request.user.login }}",
#   "blocks": [
#     {
#       "type": "section",
#       "text": {
#         "type": "mrkdwn",
#         "text": ":merged: *PR #${{ github.event.pull_request.number }} merged* by ${{ github.event.pull_request.user.login }}\n<${{ github.event.pull_request.html_url }}|View PR> | ${{ github.event.pull_request.title }}"
#       }
#     },
#     {
#       "type": "section",
#       "text": {
#         "type": "mrkdwn",
#         "text": "${{ steps.comment.outputs.comment }}"
#       }
#     }${{ inputs.include-changed-files && format(',{{"type":"section","text":{{"type":"mrkdwn","text":"*Changed YAML files:*\n{0}"}}}}', needs.check-yaml-changes.outputs.changed_files) || '' }}
#   ]
# }

      # ------------------------------------------------------------------
      # Write PR → Revision + thread_ts mapping to Kubernetes
      # ------------------------------------------------------------------
      - name: "☸️ kubectl"
        run: |
          kubectl get ns
          # echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          # export KUBECONFIG=kubeconfig

      - name: "☸️ Create/Update pr-to-revision ConfigMap"
        run: |
          COMMIT=${{ github.sha }}
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: pr-to-revision-$COMMIT
            namespace: argocd
            labels:
              app.kubernetes.io/part-of: pr-tracking
          data:
            pr: "${{ github.event.pull_request.number }}"
            url: "${{ github.event.pull_request.html_url }}"
            title: "${{ github.event.pull_request.title }}"
            author: "${{ github.event.pull_request.user.login }}"
            slack_thread_ts: "${{ steps.slack.outputs.thread_ts }}"
          EOF

      # Expose thread_ts for potential downstream jobs
      - name: "🩻 Expose thread_ts"
        run: |
          echo "thread_ts : ${{ steps.slack.outputs.thread_ts }}"
          echo "thread_ts=${{ steps.slack.outputs.thread_ts }}" >> $GITHUB_OUTPUT
