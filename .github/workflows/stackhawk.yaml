name: Stackhawk

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      NAME:  # name of service, (ex: users)
        required: true
        type: string

      NAMESPACE:
        required: true
        type: string

      API_PATH:
        required: true
        type: string

      APP_HOST:
        required: false
        type: string

      APP_ID:
        required: false
        type: string

      TEST_USERNAME:
        default: 'stackhawk@velocityz.com'
        required: false
        type: string

      BASE_DOMAIN:
        default: 'dev.fanfuzenil.com'
        required: false
        type: string

      KEYCLOAK_REALM:
        default: 'fanfuzenil'
        required: false
        type: string

      HEALTH_PATH:
        default: 'actuator/health'
        required: false
        type: string

      HEALTH_RETRIES:
        default: 6
        required: false
        type: number

      HEALTH_RETRY_DELAY:
        default: 10
        required: false
        type: number

      CURL_ARGS:
        default: ''
        required: false
        type: string

      JDK_VERSION:
        default: 21
        required: false
        type: number

      JDK_DISTRIBUTION:
        default: 'temurin'
        required: false
        type: string

      STACKHAWK_SLEEP_DELAY:
        required: false
        type: number

      STACKHAWK_SLEEP_DELAY_DEFAULT:
        default: 15
        required: false
        type: number

      STACKHAWK_SLEEP_DELAY_DEFAULT_JAVA:
        default: 30
        required: false
        type: number

      STACKHAWK_SETUP_SCRIPT_NAME:
        default: 'setup-stackhawk.sh'
        required: false
        type: string

      STACKHAWK_TMPL_YML:
        default: 'stackhawk-tmpl.yml'
        required: false
        type: string

      STACKHAWK_DIRECTORY:
        default: 'stackhawk'
        required: false
        type: string

      STACKHAWK_APP_ID:
        required: false
        type: string

      STACKHAWK_APP_ENV:
        default: 'Preview'
        required: false
        type: string

      STACKHAWK_DRYRUN:
        default: false
        required: false
        type: boolean

      STACKHAWK_VERBOSE:
        default: false
        required: false
        type: boolean

      STACKHAWK_DEBUG:
        default: true
        required: false
        type: boolean

      STACKHAWK_CODESCANNINGALERTS:
        default: true
        required: false
        type: boolean

      JOBS_TIMEOUT:
        default: 10
        required: false
        type: number

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:
      GH_TOKEN:  # GitHub token
        required: true

      HAWK_API_KEY:
        required: true

      TEST_PASSWORD:  # stackhawk peeq TEST_USERNAME password
        required: true

jobs:

  stackhawk:
    timeout-minutes: ${{ inputs.JOBS_TIMEOUT }}
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    steps:
      - name: "⚠️ Deprecation Warning"
        run: |
          echo "::warning title=Deprecation Notice::This workflow is deprecated. Please use the new workflow instead: security-stackhawk.yaml"
          exit 1
