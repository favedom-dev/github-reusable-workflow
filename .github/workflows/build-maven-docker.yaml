name: Maven and Docker

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:

      NAME:
        description: "Name of service"
        required: true
        type: string

      VERSION:
        required: true
        type: string

      SECRETS_TO_FETCH:
        description: "Secrets to fetch from Google Secret Manager"
        required: false
        type: string

      DEFAULT_SECRETS_TO_FETCH:
        description: "Default secrets to fetch from Google Secret Manager"
        required: false
        type: string
        default: |
          GH_TOKEN:projects/1054075584205/secrets/core_GITHUB_FAVEDOM_DEV_PASSWORD,
          SHIFTLEFT_ACCESS_TOKEN:projects/1054075584205/secrets/cicd_SHIFTLEFT_ACCESS_TOKEN

      FILE_DOWNLOAD_BASE_URL:
        default: 'https://raw.githubusercontent.com/favedom-dev/github-reusable-workflow'
        required: false
        type: string

      FILE_GIT_BRANCH:
        default: 'v2.1'
        required: false
        type: string
        description: "Used typically for testing new non-merged helm changes"

      VAR_DOCKER_SCRIPT_NAME:
        default: 'var-docker.sh'
        required: false
        type: string

      APP_WORKING_DIR:
        default: '.'
        required: false
        type: string

      JDK_VERSION:
        default: 21
        required: false
        type: number

      JDK_DISTRIBUTION:
        # default: 'temurin'
        default: 'corretto'
        required: false
        type: string

      MVN_VERSION:
        description: "See https://maven.apache.org/docs/history.html"
        default: "3.9.9"
        required: false
        type: string

      MVN_ENV_VARS:
        description: "-DmyVariable=someValue"
        required: false
        type: string

      MVN_ARGS:
        default: 'clean install'
        required: false
        type: string

      MVN_ARGS_EXTRA:
        required: false
        type: string

      PLATFORMS:
        required: false
        type: string
        default: linux/amd64,linux/arm64

      DOCKER_NAME:
        required: false
        type: string

      DOCKER_ENABLE_CACHE:
        type: string
        default: 'false'
        required: false
        description: "Enable Docker layer caching (true or false)"

      DOCKER_FILE:
        required: false
        type: string

      DOCKER_PUSH:
        default: 'true'
        required: false
        type: string

      DOCKER_PUSH_PR:
        default: ''
        required: false
        type: string

      TAG2:
        default: 'latest'
        required: false
        type: string

      PROJECT_ID:
        default: 'favedom-dev'
        required: false
        type: string

      GAR_LOCATION:
        default: 'us-central1'
        required: false
        type: string

      DOCKER_REGISTRY:
        default: 'docker'
        required: false
        type: string

      CREATE_CREDENTIALS_FILE:
        default: true
        required: false
        type: boolean

      EXPORT_ENVIRONMENT_VARIABLES:
        default: true
        required: false
        type: boolean

      RUN_GCP_JSON_KEY:
        default: false
        required: false
        type: boolean

      SCAN_JAR:
        default: './target/*.jar'
        required: false
        type: string

      VCS_PREFIX_CORRECTION:
        default: 'src/main/java'
        required: false
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

      # GCP_JSON_KEY:
      #   required: false

      # SHIFTLEFT_ACCESS_TOKEN:
      #   description: "Shiftleft/Qwiet token"
      #   required: false

    outputs:

      ARTIFACT_URL:
        description: "Artifcat URL to specific tag"
        value: ${{ jobs.maven-docker.outputs.ARTIFACT_URL }}

jobs:

  maven-docker:
    timeout-minutes: 15
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    env:
      # GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      # DOCKER_BUILDKIT: 1
      ARTIFACT_LINK_SCRIPT_NAME: artifact-link.sh
      MVN_SETTINGS_SCRIPT_NAME: mvn-settings.xml.sh
      MVN_SETTINGS_FILE: settings.xml
    outputs:
      ARTIFACT_URL: ${{ steps.build-docker.outputs.ARTIFACT_URL }}

    steps:

      # - name: "📄 GITHUB INFO"
      #   uses: favedom-dev/github-reusable-workflow/.github/actions/debug-github-info@v2.1
      #   with:
      #     github-context: ${{ toJSON(github) }}
      #     event-name: ${{ github.event_name }}
      #     run-attempt: ${{ github.run_attempt }}
      #     run-number: ${{ github.run_number }}
      #     pr-number: ${{ github.event.pull_request.number }}

      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "⬇️ Get reusable files"
        uses: favedom-dev/github-reusable-workflow/.github/actions/get-reusable-files@v2.1
        id: get-reusable-files
        with:
          FILE_GIT_BRANCH: ${{ inputs.FILE_GIT_BRANCH }}
          FILE_DOWNLOAD_BASE_URL: ${{ inputs.FILE_DOWNLOAD_BASE_URL }}
          FILES_TO_DOWNLOAD: |
            [
              { "subdirectory": ".github/scripts", "filename": "${{ inputs.VAR_DOCKER_SCRIPT_NAME }}" },
              { "subdirectory": ".github/scripts", "filename": "${{ env.ARTIFACT_LINK_SCRIPT_NAME }}" },
              { "subdirectory": ".github/scripts", "filename": "${{ env.MVN_SETTINGS_SCRIPT_NAME }}" },
              { "subdirectory": ".m2", "filename": "${{ env.MVN_SETTINGS_FILE }}" }
            ]

      - name: "🏷️ Set up variables"
        id: setup-variables
        env:
          DOCKER_NAME: ${{ inputs.DOCKER_NAME }}
          DOCKER_PUSH: ${{ inputs.DOCKER_PUSH }}
          DOCKER_PUSH_PR: ${{ inputs.DOCKER_PUSH_PR }}
          DOCKER_REGISTRY: ${{ inputs.DOCKER_REGISTRY }}
          GAR_LOCATION: ${{ inputs.GAR_LOCATION }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NAME: ${{ inputs.NAME }}
          PROJECT_ID: ${{ inputs.PROJECT_ID }}
        run: ../${{ inputs.VAR_DOCKER_SCRIPT_NAME }}

      - name: "🔐 Get Secrets"
        uses: favedom-dev/github-reusable-workflow/.github/actions/get-google-secrets@v2.1
        id: get-secrets
        with:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          SECRETS_TO_FETCH: ${{ inputs.SECRETS_TO_FETCH }}
          DEFAULT_SECRETS_TO_FETCH: ${{ inputs.DEFAULT_SECRETS_TO_FETCH }}

      - name: "⚙️ Set MVN_ARGS_SECRETS"
        id: set-mvn-args-secrets
        env:
          SECRETS_TO_FETCH: '${{ inputs.SECRETS_TO_FETCH }}'
        run: |
          MVN_ARGS_SECRETS=""
          echo "inputs.SECRETS_TO_FETCH : $SECRETS_TO_FETCH"

          if [ -n "${SECRETS_TO_FETCH}" ]; then
            # Remove possible newlines and extra whitespace
            CLEANED_SECRETS=$(echo "${SECRETS_TO_FETCH}" | tr -d '\n' | sed 's/ //g')

            IFS=',' read -ra SECRETS <<< "${CLEANED_SECRETS}"
            for secret in "${SECRETS[@]}"; do
              secret_key=$(echo "${secret}" | cut -d':' -f1)
              secret_value=$(echo "${secret}" | cut -d':' -f2-)

              echo "secret_key   : ${secret_key}"
              echo "secret_value : ${secret_value}"

              if [[ "${secret_key}" == MVN_ARGS__* ]]; then
                mvn_arg_key="${secret_key#MVN_ARGS__}"
                echo "mvn_arg_key  : ${mvn_arg_key}"

                mvn_arg_value=$(echo "${!secret_key}")
                # echo "mvn_arg_value: ${mvn_arg_value}"

                if [[ -z "$MVN_ARGS_SECRETS" ]]; then
                  MVN_ARGS_SECRETS="-D${mvn_arg_key}=${mvn_arg_value}"
                else
                  MVN_ARGS_SECRETS="${MVN_ARGS_SECRETS} -D${mvn_arg_key}=${mvn_arg_value}"
                fi
              else
                echo "Variable does NOT start with MVN_ARGS__"
              fi
            done
          fi

          echo "MVN_ARGS_SECRETS : ${MVN_ARGS_SECRETS}"
          echo "MVN_ARGS_SECRETS=${MVN_ARGS_SECRETS}" >> $GITHUB_OUTPUT

      - name: "🧰 Set up build basics"
        uses: favedom-dev/github-reusable-workflow/.github/actions/build-setup-basics@v2.1
        id: build-setup-basics
        with:
          GH_RUNS_ON: ${{ inputs.GH_RUNS_ON }}
          PLATFORMS: ${{ inputs.PLATFORMS }}

      - name: "🧰 Set up build maven"
        uses: favedom-dev/github-reusable-workflow/.github/actions/build-setup-maven@v2.1
        id: build-setup-maven
        with:
          GH_RUNS_ON: ${{ inputs.GH_RUNS_ON }}
          JDK_DISTRIBUTION: ${{ inputs.JDK_DISTRIBUTION }}
          JDK_VERSION: ${{ inputs.JDK_VERSION }}
          MAVEN_CACHE: 'true'
          MAVEN_WORKING_DIR: ${{ inputs.APP_WORKING_DIR }}
          MVN_VERSION: ${{ inputs.MVN_VERSION }}
          NAME: ${{ inputs.NAME }}
          VERSION: ${{ inputs.VERSION }}

      - name: "🛠️ Build with Maven"
        working-directory: ${{ inputs.APP_WORKING_DIR }}
        # env:
        #   GCP_ACCESS_TOKEN: '${{ steps.auth-gcp-token.outputs.access_token }}'
        #   GCP_ACCESS_TOKEN_EXPIRATION: '${{ steps.auth-gcp-token.outputs.access_token_expiration }}'
        run: |
          echo "MVN_ARGS        : ${{ inputs.MVN_ARGS }}"
          echo "MVN_ENV_VARS    : ${{ inputs.MVN_ENV_VARS }}"
          echo "MVN_ARGS_EXTRA  : ${{ inputs.MVN_ARGS_EXTRA }}"
          echo "MVN_ARGS_SECRETS: ${{ steps.set-mvn-args-secrets.outputs.MVN_ARGS_SECRETS }}"
          mvn -B \
          ${{ steps.set-mvn-args-secrets.outputs.MVN_ARGS_SECRETS }} \
          ${{ inputs.MVN_ENV_VARS }} \
          ${{ inputs.MVN_ARGS }} \
          ${{ inputs.MVN_ARGS_EXTRA }}

      - name: "🐳 Docker"
        uses: favedom-dev/github-reusable-workflow/.github/actions/build-docker@v2.1
        id: build-docker
        with:
          ACCESS_TOKEN: ${{ steps.get-secrets.outputs.access-token }}
          ARTIFACT_LINK_SCRIPT_NAME: ${{ env.ARTIFACT_LINK_SCRIPT_NAME }}
          DOCKER_CONTEXT: ${{ inputs.APP_WORKING_DIR }}
          DOCKER_ENABLE_CACHE: ${{ inputs. DOCKER_ENABLE_CACHE }}
          DOCKER_FILE: ${{ inputs.DOCKER_FILE }}
          DOCKER_LOCATION: ${{ steps.setup-variables.outputs.DOCKER_LOCATION }}
          DOCKER_PUSH: ${{ steps.setup-variables.outputs.DOCKER_PUSH }}
          DOCKER_URL: ${{ steps.setup-variables.outputs.DOCKER_URL }}
          GAR_LOCATION:  ${{ inputs.GAR_LOCATION }}
          GH_RUNS_ON: ${{ inputs.GH_RUNS_ON }}
          NAME: ${{ inputs.NAME }}
          PLATFORMS: ${{ inputs.PLATFORMS }}
          VERSION: ${{ inputs.VERSION }}

      # - name: "⬇️ Download Qwiet CLI"
      #   uses: favedom-dev/github-reusable-workflow/.github/actions/qwiet-download-cli@v2.1
      #   with:
      #     shiftleft-access-token: ${{ env.SHIFTLEFT_ACCESS_TOKEN }}

      # - name: "🔍 Qwiet Analyze with NextGen Static Analysis"
      #   uses: favedom-dev/github-reusable-workflow/.github/actions/qwiet-analyze@v2.1
      #   with:
      #     shiftleft-access-token: ${{ env.SHIFTLEFT_ACCESS_TOKEN }}
      #     name: ${{ inputs.NAME }}
      #     vcs-prefix-correction: ${{ inputs.VCS_PREFIX_CORRECTION }}
      #     scan-jar: ${{ inputs.SCAN_JAR }}
