name: Maven and Docker

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      NAME:
        description: "Name of service"
        required: true
        type: string

      VERSION:
        required: true
        type: string

      FILE_DOWNLOAD_BASE_URL:
        default: 'https://raw.githubusercontent.com/favedom-dev/github-reusable-workflow'
        required: false
        type: string

      FILE_GIT_BRANCH:
        default: 'v2'
        required: false
        type: string
        description: "Used typically for testing new non-merged helm changes"

      VAR_DOCKER_SCRIPT_NAME:
        default: 'var-docker.sh'
        required: false
        type: string

      APP_WORKING_DIR:
        default: '.'
        required: false
        type: string

      JDK_VERSION:
        default: 21
        required: false
        type: number

      JDK_DISTRIBUTION:
        # default: 'temurin'
        default: 'corretto'
        required: false
        type: string

      MVN_VERSION:
        description: "See https://maven.apache.org/docs/history.html"
        default: "3.9.9"
        required: false
        type: string

      MVN_ENV_VARS:
        description: "-DmyVariable=someValue"
        required: false
        type: string

      MVN_ARGS:
        default: 'clean install'
        required: false
        type: string

      MVN_ARGS_EXTRA:
        required: false
        type: string

      PLATFORMS:
        required: false
        type: string
        default: linux/amd64,linux/arm64

      DOCKER_NAME:
        required: false
        type: string

      DOCKERFILE_FILE:
        default: './Dockerfile'
        required: false
        type: string

      DOCKER_PUSH:
        default: 'true'
        required: false
        type: string

      DOCKER_PUSH_PR:
        default: ''
        required: false
        type: string

      TAG2:
        default: 'latest'
        required: false
        type: string

      PROJECT_ID:
        default: 'favedom-dev'
        required: false
        type: string

      GAR_LOCATION:
        default: 'us-central1'
        required: false
        type: string

      DOCKER_REGISTRY:
        default: 'docker'
        required: false
        type: string

      CREATE_CREDENTIALS_FILE:
        default: true
        required: false
        type: boolean

      EXPORT_ENVIRONMENT_VARIABLES:
        default: true
        required: false
        type: boolean

      RUN_GCP_JSON_KEY:
        default: false
        required: false
        type: boolean

      SCAN_JAR:
        default: './target/*.jar'
        required: false
        type: string

      VCS_PREFIX_CORRECTION:
        default: 'src/main/java'
        required: false
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:
      GH_TOKEN:
        description: "GitHub token"
        required: true

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

      MVN_ARGS_SECRETS:
        description: "Maven args that contain secrets"
        required: false

      GCP_JSON_KEY:
        required: false

      SHIFTLEFT_ACCESS_TOKEN:
        description: "Shiftleft/Qwiet token"
        required: false

jobs:

  maven-docker:
    timeout-minutes: 15
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    env:
      # GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      # DOCKER_BUILDKIT: 1
      # DOCKER_LINK_SCRIPT_NAME: docker-link.sh
      ARTIFACT_LINK_SCRIPT_NAME: artifact-link.sh
      MVN_SETTINGS_FILE: settings.xml
    steps:

      - name: "📄 GITHUB INFO"
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: |-
          echo "PR number          : ${{ github.event.pull_request.number }}"
          echo "github.event_name  : ${{ github.event_name }}"
          echo "github.run_attempt : ${{ github.run_attempt }}"
          echo "github.run_number  : ${{ github.run_number }}"
          # echo "GH_RUNS_ON         : ${{ github.event.inputs.GH_RUNS_ON }}"
          echo "GH_RUNS_ON         : ${{ inputs.GH_RUNS_ON }}"
          echo "--------------------------------------"
          echo "GITHUB_CONTEXT: ${GITHUB_CONTEXT}"

      - name: "⬇️ Get reusable files"
        # TODO update to v2
        # uses: favedom-dev/github-reusable-workflow/.github/actions/get-reusable-files@v2
        uses: favedom-dev/github-reusable-workflow/.github/actions/get-reusable-files@FAN-6340
        id: get-reusable-files
        with:
          # FILE_GIT_BRANCH: ${{ inputs.FILE_GIT_BRANCH }}
          # TODO update to v2
          FILE_GIT_BRANCH: FAN-6340
          FILE_DOWNLOAD_BASE_URL: ${{ inputs.FILE_DOWNLOAD_BASE_URL }}
          FILES_TO_DOWNLOAD: |
            [
              { "subdirectory": ".github/scripts", "filename": "${{ inputs.VAR_DOCKER_SCRIPT_NAME }}" },
              { "subdirectory": ".github/scripts", "filename": "${{ env.ARTIFACT_LINK_SCRIPT_NAME }}" },
              { "subdirectory": ".github/scripts", "filename": "mvn-settings.xml.sh" },
              { "subdirectory": ".m2", "filename": "${MVN_SETTINGS_FILE}" }
            ]

      - name: "🏷️ Set up variables"
        id: setup-variables
        env:
          DOCKER_NAME: ${{ inputs.DOCKER_NAME }}
          DOCKER_PUSH: ${{ inputs.DOCKER_PUSH }}
          DOCKER_PUSH_PR: ${{ inputs.DOCKER_PUSH_PR }}
          DOCKER_REGISTRY: ${{ inputs.DOCKER_REGISTRY }}
          GAR_LOCATION: ${{ inputs.GAR_LOCATION }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NAME: ${{ inputs.NAME }}
          PROJECT_ID: ${{ inputs.PROJECT_ID }}
        run: ../${{ inputs.VAR_DOCKER_SCRIPT_NAME }}

      - name: "🧰 Set up gh cli"
        uses: dev-hanz-ops/install-gh-cli-action@v0.2.1
        if: ${{ !startsWith(inputs.GH_RUNS_ON, 'ubuntu') }}

      - name: "🧰 Set up QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "🧰 Set up Docker Buildx ${{ inputs.PLATFORMS }}"
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ inputs.PLATFORMS }}

      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "🔑 Google Auth Token"
        id: auth-gcp-token
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'
          create_credentials_file: ${{ inputs.CREATE_CREDENTIALS_FILE }}
          export_environment_variables: ${{ inputs.EXPORT_ENVIRONMENT_VARIABLES }}

      - name: "🗝️ Google Auth JSON Key"
        id: auth-gcp-key
        if: inputs.RUN_GCP_JSON_KEY
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_JSON_KEY }}'

      # https://github.com/google-github-actions/setup-gcloud
      # - name: "🧰 Set up Cloud SDK"
      #   uses: 'google-github-actions/setup-gcloud@v0'

      - name: "🔑 Docker Auth: GAR"
        if: ${{ !env.ACT }}
        id: auth-docker
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth-gcp-token.outputs.access_token }}'
          registry: '${{ inputs.GAR_LOCATION }}-docker.pkg.dev'  # Google Artifact Registry

      - name: "⚙️ Set up JDK ${{ inputs.JDK_DISTRIBUTION }} ${{ inputs.JDK_VERSION }}"
        uses: actions/setup-java@v4
        with:
          java-version: '${{ inputs.JDK_VERSION }}'
          distribution: '${{ inputs.JDK_DISTRIBUTION }}'

      - name: "⚙️ Set up Maven ${{ inputs.MVN_VERSION }}"
        uses: stCarolas/setup-maven@v5
        if: ${{ !startsWith(inputs.GH_RUNS_ON, 'ubuntu') }}
        with:
          maven-version: '${{ inputs.MVN_VERSION }}'

      - name: "📦 Cache local Maven repository"
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ inputs.NAME }}-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ inputs.NAME }}-${{ runner.os }}-maven-

      - name: "🧰 Maven ~/.m2/settings.xml"
        run: ../mvn-settings.xml.sh

      - name: "⚙️ Maven set app version ${{ inputs.VERSION }}"
        working-directory: ${{ inputs.APP_WORKING_DIR }}
        env:
          VERSION: ${{ inputs.VERSION }}
        run: |
          mvn -B versions:set -DnewVersion=${VERSION}

      - name: "🛠️ Build with Maven"
        working-directory: ${{ inputs.APP_WORKING_DIR }}
        env:
          GCP_ACCESS_TOKEN: '${{ steps.auth-gcp-token.outputs.access_token }}'
          GCP_ACCESS_TOKEN_EXPIRATION: '${{ steps.auth-gcp-token.outputs.access_token_expiration }}'
        run: |
          echo "MVN_ARGS        : ${{ inputs.MVN_ARGS }}"
          echo "MVN_ENV_VARS    : ${{ inputs.MVN_ENV_VARS }}"
          echo "MVN_ARGS_EXTRA  : ${{ inputs.MVN_ARGS_EXTRA }}"
          echo "MVN_ARGS_SECRETS: ${{ secrets.MVN_ARGS_SECRETS }}"
          mvn -B \
          ${{ secrets.MVN_ARGS_SECRETS }} \
          ${{ inputs.MVN_ENV_VARS }} \
          ${{ inputs.MVN_ARGS }} \
          ${{ inputs.MVN_ARGS_EXTRA }}

      - name: "⬇️ Download Qwiet CLI"
        if: ${{ env.SHIFTLEFT_ACCESS_TOKEN != '' }}
        env:
          SHIFTLEFT_ACCESS_TOKEN: ${{ secrets.SHIFTLEFT_ACCESS_TOKEN }}
        run: |
          curl https://cdn.shiftleft.io/download/sl > $HOME/sl && chmod a+rx $HOME/sl

      # https://docs.shiftleft.io/cli/reference/analyze
      - name: "🔍 Qwiet Analyze with NextGen Static Analysis"
        if: ${{ env.SHIFTLEFT_ACCESS_TOKEN != '' }}
        env:
          SHIFTLEFT_ACCESS_TOKEN: ${{ secrets.SHIFTLEFT_ACCESS_TOKEN }}
        run: |
          $HOME/sl analyze \
          --app ${{ inputs.NAME }} \
          --java \
          --vcs-prefix-correction "*=${{ inputs.VCS_PREFIX_CORRECTION }}" \
          --cpg \
          ${{ inputs.SCAN_JAR }}

      - name: "# Set up Docker tags"
        uses: favedom-dev/github-reusable-workflow/.github/actions/set-docker-tags@FAN-6340
        id: docker-tags
        with:
          VERSION: ${{ inputs.VERSION }}
          DOCKER_LOCATION: ${{ steps.setup-variables.outputs.DOCKER_LOCATION }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: "🕸️ DEBUG: docker-tags"
        run: |
          echo "Tags: ${{ steps.docker-tags.outputs.tags }}"

      # - name: "# Set up Docker tags"
      #   id: docker-tags
      #   working-directory: ${{ inputs.APP_WORKING_DIR }}
      #   env:
      #     DOCKER_LOCATION: ${{ steps.setup-variables.outputs.DOCKER_LOCATION }}
      #   run: |-
      #     DOCKER_TAGS=${{ env.DOCKER_LOCATION }}:${{ inputs.VERSION }}
      #     if [ "${{ github.event_name }}" != "pull_request" ]; then
      #       DOCKER_TAGS=${DOCKER_TAGS},${{ env.DOCKER_LOCATION }}:latest
      #     fi
      #     echo "DOCKER_TAGS: ${DOCKER_TAGS}"
      #     echo "tags=${DOCKER_TAGS}" >> $GITHUB_OUTPUT

      - name: "🐳 Docker: build, tag, and push"
        uses: docker/build-push-action@v6
        id: docker-build
        if: ${{ !env.ACT }}
        with:
          context: ${{ inputs.APP_WORKING_DIR }}
          # file: ${{ env.DOCKERFILE_FILE }}
          platforms: ${{ inputs.PLATFORMS }}
          push: ${{ steps.setup-variables.outputs.DOCKER_PUSH }}
          tags: ${{ steps.docker-tags.outputs.tags }}

      - name: "🔗 Link to Container"
        if: steps.setup-variables.outputs.DOCKER_PUSH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ARTIFACT_DIGEST: ${{ steps.docker-build.outputs.digest }}
          # ARTIFACT_TYPE: docker
          ARTIFACT_URL: ${{ steps.setup-variables.outputs.DOCKER_URL }}
          NAME: ${{ inputs.NAME }}
          VERSION: ${{ inputs.VERSION }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ../${ARTIFACT_LINK_SCRIPT_NAME}
