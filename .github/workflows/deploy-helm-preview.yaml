name: Helm Preview

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      NAME:
        description: "Name of service"
        required: true
        type: string

      VERSION:
        required: true
        type: string

      SECRETS_TO_FETCH:
        description: "Secrets to fetch from Google Secret Manager"
        required: false
        type: string

      DEFAULT_SECRETS_TO_FETCH:
        description: "Default secrets to fetch from Google Secret Manager"
        required: false
        type: string
        default: |
          GH_TOKEN:projects/1054075584205/secrets/core_GITHUB_FAVEDOM_DEV_PASSWORD

      # IS_FRONTEND:
      #   default: false
      #   required: false
      #   type: boolean
      # IS_MONOREPO:
      #   default: false
      #   required: false
      #   type: boolean
      # VALUES_ISTIO_HOST:
      #   required: false
      #   type: string

      EXTRA_VARS:
        default: ''
        required: false
        type: string

      TENANT:
        default: ''
        required: false
        type: string

      YQ_VERSION:
        required: false
        type: string
        description: "Version of yq to install"

      PREVIEW_NAMESPACE:
        required: true
        type: string

      PREVIEW_SUBDOMAIN:
        required: false
        type: string

      CHARTS_DIR:
        default: 'charts'
        type: string
        required: false

      HELM_CHARTS_GIT_REPO:
        default: 'helm-charts'
        required: false
        type: string

      HELM_CHARTS_GIT_ORG:
        default: 'favedom-dev'
        required: false
        type: string

      HELM_CHARTS_GIT_BRANCH:
        default: 'master'
        required: false
        type: string
        description: "Repo {{HELM_CHARTS_GIT_REPO}} branch to use.  Used typically for testing new non-merged helm changes"

      HELM_USE_LOCAL_COMMON:
        required: false
        type: string
        description: "Use the local common chart from the repo {{HELM_CHARTS_GIT_REPO}}.  Used typically for testing new non-merged helm changes"

      DO_PR_MERGE:
        default: 'true'
        required: false
        type: string

      MONOREPO_APP:
        default: ''
        required: false
        type: string

      PREVIEW_GIT_REPO:
        default: 'argocd-previews'
        required: false
        type: string

      PREVIEW_GIT_BRANCH:
        default: 'master'
        required: false
        type: string
        description: "Repo {{PREVIEW_GIT_REPO}} branch to use.  Used typically for previews"

      PREVIEW_GIT_ORG:
        default: 'favedom-dev'
        required: false
        type: string

      GH_USER_EMAIL:
        # default: 'github@powervz.com'
        default: ''
        required: false
        type: string

      GH_USER_NAME:
        default: 'PowerVZ GitHub Bot'
        required: false
        type: string

      HELM_REGISTRY_BASE_URL:
        default: "https://console.cloud.google.com/artifacts/docker"
        required: false
        type: string

      HELM_DOCKER_REGISTRY:
        description: "Use GAR oci://"
        default: 'us-central1-docker.pkg.dev'
        required: false
        type: string

      HELM_REGISTRY_NAME:
        default: 'helm'
        required: false
        type: string

      HELM_PROJECT_ID:
        default: 'favedom-dev'
        required: false
        type: string

      HELM_LOCATION:
        default: 'us-central1'
        required: false
        type: string

      HELM_VERSION:
        default: 'v3.17.1'
        required: false
        type: string

      HELM_ENABLE_DEBUG:
        default: true
        required: false
        type: boolean

      KUBECTL_APPLY:
        default: false
        required: false
        type: boolean

      DOCKER_REGISTRY:
        description: "Use GAR"
        default: 'us-central1-docker.pkg.dev'
        required: false
        type: string

      DOCKER_REGISTRY_NAME:
        default: 'docker'
        required: false
        type: string

      DOCKER_PROJECT_ID:
        default: 'favedom-dev'
        required: false
        type: string

      VALUES_GLOBALS_YAML:
        default: 'values-preview.yaml'
        required: false
        type: string

      VALUES_PREVIEW_YAML:
        default: 'values-preview.yaml'
        required: false
        type: string

      VALUES_PREVIEW_YAML_TPL:
        default: 'values-preview.yaml.tpl'
        required: false
        type: string

      OVERRIDE_CHART_NAME:
        required: false
        type: string

      CLUSTER_PROJECT_ID:
        default: 'development-375017'
        required: false
        type: string

      CLUSTER_NAME:
        default: 'fanfuzenil'
        required: false
        type: string

      CLUSTER_LOCATION:
        default: 'us-central1-a'
        required: false
        type: string

      HELM_PREVIEW_ARGS:
        default: ''
        required: false
        type: string

      PREVIEW_BASE_DOMAIN:
        default: 'dev.fanfuzenil.com'
        required: false
        type: string

      PREVIEW_HEALTHCHECK:
        default: 'actuator/health'
        required: false
        type: string

      SECRETS_FROM_NAMESPACE:
        default: fanfuze
        required: false
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:
      # GH_TOKEN:
      #   description: "GitHub token"
      #   required: true

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

    outputs:
      API_PATH:
        value: ${{ jobs.helm-preview.outputs.API_PATH }}

      APP_HOST:
        value: ${{ jobs.helm-preview.outputs.APP_HOST }}

jobs:

  helm-preview:
    timeout-minutes: 10
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    outputs:
      API_PATH: ${{ steps.get-api-path.outputs.API_PATH }}
      APP_HOST: ${{ steps.setup-variables.outputs.PREVIEW_URL }}
    # env:
    #   GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:

      # Not really used here to remove warning
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "🔐 Get Secrets"
        uses: favedom-dev/github-reusable-workflow/.github/actions/get-google-secrets@v2.1
        id: get-secrets
        with:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          SECRETS_TO_FETCH: ${{ inputs.SECRETS_TO_FETCH }}
          DEFAULT_SECRETS_TO_FETCH: ${{ inputs.DEFAULT_SECRETS_TO_FETCH }}

      - name: "🧰 Set up gh cli"
        uses: dev-hanz-ops/install-gh-cli-action@v0.2.1
        if: ${{ !startsWith(inputs.GH_RUNS_ON, 'ubuntu') }}

      - name: "🧰 Set up yq ${{ inputs.YQ_VERSION }}"
        uses: dcarbone/install-yq-action@v1
        if: ${{ !startsWith(inputs.GH_RUNS_ON, 'ubuntu') }}
        with:
          version: '${{ inputs.YQ_VERSION }}'

      - name: "🔩 Git config"
        uses: favedom-dev/github-reusable-workflow/.github/actions/setup-git-config@v2.1
        with:
          GH_USER_NAME: ${{ inputs.GH_USER_NAME }}
          GH_USER_EMAIL: ${{ inputs.GH_USER_EMAIL }}

      - name: "☁️ Checkout helm repository: ${{ inputs.HELM_CHARTS_GIT_REPO }} branch: ${{ inputs.HELM_CHARTS_GIT_BRANCH }}"
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.HELM_CHARTS_GIT_ORG }}/${{ inputs.HELM_CHARTS_GIT_REPO }}
          token: ${{ env.GH_TOKEN }}
          ref: ${{ inputs.HELM_CHARTS_GIT_BRANCH }}
          path: ${{ inputs.HELM_CHARTS_GIT_REPO }}

      - name: "☁️ Checkout previews repository: ${{ inputs.PREVIEW_GIT_REPO }} branch: ${{ inputs.PREVIEW_GIT_BRANCH }}"
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.PREVIEW_GIT_ORG }}/${{ inputs.PREVIEW_GIT_REPO }}
          token: ${{ env.GH_TOKEN }}
          ref: ${{ inputs.PREVIEW_GIT_BRANCH }}
          path: ${{ inputs.PREVIEW_GIT_REPO }}

      - name: "🏷️ Set up variables"
        id: setup-variables
        env:
          GH_REF: ${{ github.ref }}
          CHART_NAME: ${{ inputs.NAME }}
          OVERRIDE_CHART_NAME: ${{ inputs.OVERRIDE_CHART_NAME }}
          EXTRA_VARS: ${{ inputs.EXTRA_VARS }}
          ARG_PREVIEW_SUBDOMAIN: ${{ inputs.PREVIEW_SUBDOMAIN }}
          # ARG_VALUES_ISTIO_HOST: ${{ inputs.VALUES_ISTIO_HOST }}
        run: |
          HELM_REGISTRY_LOCATION=${{ inputs.HELM_DOCKER_REGISTRY }}/${{ inputs.HELM_PROJECT_ID }}/${{ inputs.HELM_REGISTRY_NAME }}/${{ inputs.NAME }}
          HELM_REGISTRY_URL="${{ inputs.HELM_REGISTRY_BASE_URL }}/${{ inputs.HELM_PROJECT_ID }}/${{ inputs.HELM_LOCATION }}/${{ inputs.HELM_REGISTRY_NAME }}/${{ inputs.NAME }}?project=${{ inputs.HELM_PROJECT_ID }}/"
          DOCKER_REPOSITORY=${{ inputs.DOCKER_REGISTRY }}/${{ inputs.DOCKER_PROJECT_ID }}/${{ inputs.DOCKER_REGISTRY_NAME }}/${{ inputs.NAME }}
          CHARTS_WORKING_DIR=${{ inputs.HELM_CHARTS_GIT_REPO }}/${{ inputs.CHARTS_DIR }}
          # PREVIEW_WORKING_DIR=${{ inputs.PREVIEW_GIT_REPO }}/apps/${app dir}
          # BASE_DIR=$(dirname $(pwd))
          # PREVIEW_WORKING_DIR=${BASE_DIR}/${{ inputs.PREVIEW_GIT_REPO }}/apps/mono-web
          PREVIEW_WORKING_DIR=$(pwd)/${{ inputs.PREVIEW_GIT_REPO }}/apps/mono-web

          # echo "OVERRIDE_CHART_NAME: ${OVERRIDE_CHART_NAME}"
          if [ -n "${OVERRIDE_CHART_NAME}" ]; then
            CHART_NAME=${OVERRIDE_CHART_NAME}
          fi
          if [ -n "${EXTRA_VARS}" ]; then
            ARG_EXTRA_VARS="-ev ${EXTRA_VARS}"
          else
            ARG_EXTRA_VARS=""
          fi
          ARG_CHART_VALUES="-f ./${CHART_NAME}/values.yaml"
          ARG_COMMON_VALUES="-f ./common/values.yaml"
          ARG_PREVIEW_GLOBALS_VALUES="-f ./${{ inputs.VALUES_PREVIEW_YAML }}"
          PREVIEW_CHART_VALUES="./${CHART_NAME}/${{ inputs.VALUES_PREVIEW_YAML }}"
          ARG_PREVIEW_CHART_VALUES="-f ${PREVIEW_CHART_VALUES}"

          TENANT=${{ inputs.TENANT }}
          if [ -n "${TENANT}" ]; then
            ARG_PREVIEW_TENANT_VALUES="-f ./${TENANT}-preview.yaml"
          else
            ARG_PREVIEW_TENANT_VALUES=""
          fi

          PREVIEW_SUBDOMAIN=${{ inputs.PREVIEW_NAMESPACE }}
          if [ -n "${ARG_PREVIEW_SUBDOMAIN}" ]; then
            # PREVIEW_SUBDOMAIN=${PREVIEW_SUBDOMAIN}-${CHART_NAME}
            PREVIEW_SUBDOMAIN=${PREVIEW_SUBDOMAIN}-${{ inputs.NAME }}
          fi

          PREVIEW_DOMAIN="${PREVIEW_SUBDOMAIN}.${{ inputs.PREVIEW_BASE_DOMAIN }}"
          if [ -n "${ARG_PREVIEW_SUBDOMAIN}" ]; then
            HELM_VALUES_ISTIO_HOST="--set istio.host=${PREVIEW_DOMAIN}"
          fi

          # PREVIEW_URL=https://${PREVIEW_SUBDOMAIN}.${{ inputs.PREVIEW_BASE_DOMAIN }}
          PREVIEW_URL=https://${PREVIEW_DOMAIN}

          ARG_USE_LOCAL=""
          if [ -n "${HELM_USE_LOCAL_COMMON}" ]; then
            ARG_USE_LOCAL="-ul"
          fi

          # Display values
          echo "ACT                        : ${ACT}"
          echo "HELM_REGISTRY_LOCATION     : ${HELM_REGISTRY_LOCATION}"
          echo "HELM_REGISTRY_URL          : ${HELM_REGISTRY_URL}"
          echo "DOCKER_REPOSITORY          : ${DOCKER_REPOSITORY}"
          echo "CHART_NAME                 : ${CHART_NAME}"
          echo "CHARTS_WORKING_DIR         : ${CHARTS_WORKING_DIR}"
          echo "ARG_EXTRA_VARS             : ${ARG_EXTRA_VARS}"
          echo "ARG_USE_LOCAL              : ${ARG_USE_LOCAL}"
          echo "ARG_CHART_VALUES           : ${ARG_CHART_VALUES}"
          echo "ARG_COMMON_VALUES          : ${ARG_COMMON_VALUES}"
          echo "ARG_PREVIEW_GLOBALS_VALUES : ${ARG_PREVIEW_GLOBALS_VALUES}"
          echo "ARG_PREVIEW_TENANT_VALUES  : ${ARG_PREVIEW_TENANT_VALUES}"
          echo "ARG_PREVIEW_CHART_VALUES   : ${ARG_PREVIEW_CHART_VALUES}"
          echo "PREVIEW_WORKING_DIR        : ${PREVIEW_WORKING_DIR}"
          echo "PREVIEW_CHART_VALUES       : ${PREVIEW_CHART_VALUES}"
          echo "PREVIEW_SUBDOMAIN          : ${PREVIEW_SUBDOMAIN}"
          echo "PREVIEW_DOMAIN             : ${PREVIEW_DOMAIN}"
          echo "PREVIEW_URL                : ${PREVIEW_URL}"
          echo "HELM_VALUES_ISTIO_HOST     : ${HELM_VALUES_ISTIO_HOST}"

          # set to output and env
          echo "HELM_REGISTRY_LOCATION=${HELM_REGISTRY_LOCATION}" >> $GITHUB_ENV
          echo "HELM_REGISTRY_LOCATION=${HELM_REGISTRY_LOCATION}" >> $GITHUB_OUTPUT
          echo "HELM_REGISTRY_URL=${HELM_REGISTRY_URL}" >> $GITHUB_ENV
          echo "HELM_REGISTRY_URL=${HELM_REGISTRY_URL}" >> $GITHUB_OUTPUT
          echo "DOCKER_REPOSITORY=${DOCKER_REPOSITORY}" >> $GITHUB_ENV
          echo "DOCKER_REPOSITORY=${DOCKER_REPOSITORY}" >> $GITHUB_OUTPUT
          echo "CHART_NAME=${CHART_NAME}" >> $GITHUB_ENV
          echo "CHART_NAME=${CHART_NAME}" >> $GITHUB_OUTPUT
          echo "CHARTS_WORKING_DIR=${CHARTS_WORKING_DIR}" >> $GITHUB_ENV
          echo "CHARTS_WORKING_DIR=${CHARTS_WORKING_DIR}" >> $GITHUB_OUTPUT
          echo "ARG_EXTRA_VARS=${ARG_EXTRA_VARS}" >> $GITHUB_ENV
          echo "ARG_EXTRA_VARS=${ARG_EXTRA_VARS}" >> $GITHUB_OUTPUT
          echo "ARG_CHART_VALUES=${ARG_CHART_VALUES}" >> $GITHUB_ENV
          echo "ARG_CHART_VALUES=${ARG_CHART_VALUES}" >> $GITHUB_OUTPUT
          echo "ARG_COMMON_VALUES=${ARG_COMMON_VALUES}" >> $GITHUB_ENV
          echo "ARG_COMMON_VALUES=${ARG_COMMON_VALUES}" >> $GITHUB_OUTPUT
          echo "ARG_PREVIEW_GLOBALS_VALUES=${ARG_PREVIEW_GLOBALS_VALUES}" >> $GITHUB_ENV
          echo "ARG_PREVIEW_GLOBALS_VALUES=${ARG_PREVIEW_GLOBALS_VALUES}" >> $GITHUB_OUTPUT
          echo "ARG_PREVIEW_TENANT_VALUES=${ARG_PREVIEW_TENANT_VALUES}" >> $GITHUB_ENV
          echo "ARG_PREVIEW_TENANT_VALUES=${ARG_PREVIEW_TENANT_VALUES}" >> $GITHUB_OUTPUT
          echo "ARG_PREVIEW_CHART_VALUES=${ARG_PREVIEW_CHART_VALUES}" >> $GITHUB_ENV
          echo "ARG_PREVIEW_CHART_VALUES=${ARG_PREVIEW_CHART_VALUES}" >> $GITHUB_OUTPUT
          echo "PREVIEW_WORKING_DIR=${PREVIEW_WORKING_DIR}" >> $GITHUB_ENV
          echo "PREVIEW_WORKING_DIR=${PREVIEW_WORKING_DIR}" >> $GITHUB_OUTPUT
          echo "PREVIEW_CHART_VALUES=${PREVIEW_CHART_VALUES}" >> $GITHUB_ENV
          echo "PREVIEW_CHART_VALUES=${PREVIEW_CHART_VALUES}" >> $GITHUB_OUTPUT
          echo "PREVIEW_DOMAIN=${PREVIEW_DOMAIN}" >> $GITHUB_ENV
          echo "PREVIEW_DOMAIN=${PREVIEW_DOMAIN}" >> $GITHUB_OUTPUT
          echo "PREVIEW_URL=${PREVIEW_URL}" >> $GITHUB_ENV
          echo "PREVIEW_URL=${PREVIEW_URL}" >> $GITHUB_OUTPUT
          echo "HELM_VALUES_ISTIO_HOST=${HELM_VALUES_ISTIO_HOST}" >> $GITHUB_ENV
          echo "HELM_VALUES_ISTIO_HOST=${HELM_VALUES_ISTIO_HOST}" >> $GITHUB_OUTPUT

          echo "pwd"
          pwd
          echo "ls"
          ls -la

          echo "ls PREVIEW_WORKING_DIR: ${PREVIEW_WORKING_DIR}"
          ls -la ${PREVIEW_WORKING_DIR}

      - name: "🔧 Enable helm debug"
        if: inputs.HELM_ENABLE_DEBUG == true
        run: |
          echo "HELM_DEBUG_FLAG=--debug" >> $GITHUB_ENV
          echo "HELM_DEBUG_SCRIPT_FLAG=-d" >> $GITHUB_ENV

      - name: "⚙️ Set up helm version: ${{ inputs.HELM_VERSION }}"
        # https://github.com/Azure/setup-helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ inputs.HELM_VERSION }}
        id: install

      - name: "🔓 Get GKE Credentials cluster: ${{ inputs.CLUSTER_NAME }}"
        # if: ${{ !env.ACT }}
        id: 'get-credentials'
        uses: 'google-github-actions/get-gke-credentials@v2'
        with:
          cluster_name: ${{ inputs.CLUSTER_NAME }}
          location: ${{ inputs.CLUSTER_LOCATION }}
          project_id: ${{ inputs.CLUSTER_PROJECT_ID }}

      # - name: '🔧 Set up Cloud SDK'
      #   uses: 'google-github-actions/setup-gcloud@v2'

      - name: "🔐 [GAR] (oci://): Helm login"
        # if: ${{ !env.ACT }}
        working-directory: ${{ steps.setup-variables.outputs.CHARTS_WORKING_DIR }}
        env:
          HELM_DOCKER_REGISTRY: ${{ inputs.HELM_DOCKER_REGISTRY }}
          HELM_REGISTRY_NAME: ${{ inputs.HELM_REGISTRY_NAME }}
          HELM_EXPERIMENTAL_OCI: 1
        run: |
          gcloud auth print-access-token | \
          helm registry login -u oauth2accesstoken \
          --password-stdin https://${HELM_DOCKER_REGISTRY}

      - name: "☸ Helm in ${{ inputs.HELM_CHARTS_GIT_REPO }}"
        working-directory: ${{ inputs.HELM_CHARTS_GIT_REPO }}
        env:
          CHART_NAME: ${{ steps.setup-variables.outputs.CHART_NAME }}
          VERSION: ${{ inputs.VERSION }}
          IMAGE_VERSION: ${{ inputs.VERSION }}
          HELM_DOCKER_REGISTRY: ${{ inputs.HELM_DOCKER_REGISTRY }}
          HELM_EXPERIMENTAL_OCI: 1
          ARG_USE_LOCAL: ${{ steps.setup-variables.outputs.ARG_USE_LOCAL }}
          PREVIEW_CHART_VALUES: ${{ steps.setup-variables.outputs.PREVIEW_CHART_VALUES }}
          PREVIEW_NAMESPACE: ${{ inputs.PREVIEW_NAMESPACE }}
          DOCKER_REPOSITORY: ${{ steps.setup-variables.outputs.DOCKER_REPOSITORY }}
          ARG_EXTRA_VARS: ${{ steps.setup-variables.outputs.ARG_EXTRA_VARS }}
        run: |
          echo "ARG_USE_LOCAL         : ${ARG_USE_LOCAL}"
          echo "HELM_DEBUG_SCRIPT_FLAG: ${HELM_DEBUG_SCRIPT_FLAG}"
          echo "working-directory     : $(pwd)"
          echo "---------------"
          env | sort
          echo "==============="

          # NOTE: script uses env vars CHART_NAME, VERSION, PREVIEW_NAMESPACE, DOCKER_REPOSITORY
          ./.github/scripts/run-helm.sh ${HELM_DEBUG_SCRIPT_FLAG} ${ARG_USE_LOCAL} -t -p -c "${CHART_NAME}" -v "${VERSION}" -iv "${IMAGE_VERSION}" ${ARG_EXTRA_VARS}
          echo ""
          echo "./charts/${PREVIEW_CHART_VALUES}:"
          cat "./charts/${PREVIEW_CHART_VALUES}" | yq

          # TODO output yaml to argocd-previews/apps/<app>/

      - name: "📦 Stage PR yaml file"
        # working-directory: ${{ inputs.HELM_CHARTS_GIT_REPO }}
        # env:
        #   CHART_NAME: ${{ steps.setup-variables.outputs.CHART_NAME }}
        #   VERSION: ${{ inputs.VERSION }}
        #   IMAGE_VERSION: ${{ inputs.VERSION }}
        #   HELM_DOCKER_REGISTRY: ${{ inputs.HELM_DOCKER_REGISTRY }}
        #   HELM_EXPERIMENTAL_OCI: 1
        #   ARG_USE_LOCAL: ${{ steps.setup-variables.outputs.ARG_USE_LOCAL }}
        #   PREVIEW_CHART_VALUES: ${{ steps.setup-variables.outputs.PREVIEW_CHART_VALUES }}
        #   PREVIEW_NAMESPACE: ${{ inputs.PREVIEW_NAMESPACE }}
        #   DOCKER_REPOSITORY: ${{ steps.setup-variables.outputs.DOCKER_REPOSITORY }}
        #   ARG_EXTRA_VARS: ${{ steps.setup-variables.outputs.ARG_EXTRA_VARS }}
        run: |
          # echo "pwd"
          # pwd
          # echo "ls ${{ inputs.HELM_CHARTS_GIT_REPO }}"
          # ls -la ${{ inputs.HELM_CHARTS_GIT_REPO }}
          # echo "ls ${{ inputs.HELM_CHARTS_GIT_REPO }}/.output/${CHART_NAME}/${CHART_NAME}-*.yaml"
          # ls -la ${{ inputs.HELM_CHARTS_GIT_REPO }}/.output/${CHART_NAME}/${CHART_NAME}-*.yaml

          echo "cp"
          # cp ${{ inputs.HELM_CHARTS_GIT_REPO }}/.output/${CHART_NAME}/${CHART_NAME}-*.yaml ${PREVIEW_WORKING_DIR}/pr-${CHART_NAME}-000.yaml
          cp ${{ inputs.HELM_CHARTS_GIT_REPO }}/.output/${CHART_NAME}/${CHART_NAME}-*.yaml ${PREVIEW_WORKING_DIR}/${{ inputs.PREVIEW_NAMESPACE }}.yaml
          echo "ls ${PREVIEW_WORKING_DIR}"
          ls -la ${PREVIEW_WORKING_DIR}
          echo "cat ${PREVIEW_WORKING_DIR}/${{ inputs.PREVIEW_NAMESPACE }}.yaml:"
          cat ${PREVIEW_WORKING_DIR}/${{ inputs.PREVIEW_NAMESPACE }}.yaml} | yq

          # TODO
          # git add


      - name: "🡢 Create preview PR in repo: ${{ inputs.PREVIEW_GIT_REPO }}"
        uses: favedom-dev/github-reusable-workflow/.github/actions/create-env-pr@v2.1
        with:
          env-repo-name: ${{ inputs.PREVIEW_GIT_REPO }}
          env-repo-path: ${PREVIEW_WORKING_DIR}
          name: ${{ inputs.NAME }}
          version: ${{ inputs.VERSION }}
          do-pr-merge: ${{ inputs.DO_PR_MERGE }}
          is-helm-chart: 'false'
          monorepo-app: ${{ inputs.MONOREPO_APP }}
          gh-token: ${{ env.GH_TOKEN }}


      # - name: "🏗️ PREVIEW: Create namespace: ${{ inputs.PREVIEW_NAMESPACE }}"
      #   env:
      #     PREVIEW_NAMESPACE: ${{ inputs.PREVIEW_NAMESPACE }}
      #   run: |
      #     echo "Create Preview Namespace: ${PREVIEW_NAMESPACE}"
      #     kubectl create namespace ${PREVIEW_NAMESPACE} --dry-run=client -o json | kubectl apply -f -
      #     kubectl config set-context $(kubectl config current-context) --namespace ${PREVIEW_NAMESPACE}

      # - name: "🔐 PREVIEW: Copy secrets"
      #   working-directory: ${{ steps.setup-variables.outputs.CHARTS_WORKING_DIR }}
      #   env:
      #     CHART_NAME: ${{ steps.setup-variables.outputs.CHART_NAME }}
      #     PREVIEW_NAMESPACE: ${{ inputs.PREVIEW_NAMESPACE }}
      #     FROM_NAMESPACE: ${{ inputs.SECRETS_FROM_NAMESPACE }}
      #   run: |
      #     ../.github/scripts/preview_copy_secrets.sh -c "${CHART_NAME}" -p "${PREVIEW_NAMESPACE}" -n "${FROM_NAMESPACE}"

