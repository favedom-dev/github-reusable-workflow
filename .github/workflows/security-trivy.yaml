name: Trivy

on:  # yamllint disable-line rule:truthy
  workflow_call:

    inputs:
      NAME:
        required: true
        type: string
        description: "Name of service"

      VERSION:
        required: true
        type: string

      SECRETS_TO_FETCH:
        description: "Secrets to fetch from Google Secret Manager"
        required: false
        type: string

      DEFAULT_SECRETS_TO_FETCH:
        description: "Default secrets to fetch from Google Secret Manager"
        required: false
        type: string
        default: |
          GH_TOKEN:projects/1054075584205/secrets/core_GITHUB_FAVEDOM_DEV_PASSWORD,
          SLACK_TRIVY_WEBHOOK_URL:projects/1054075584205/secrets/cicd_SLACK_TRIVY_WEBHOOK_URL,
          SLACK_DEVOPS_TOKEN:projects/1054075584205/secrets/cicd_SLACK_DEVOPS_TOKEN

      ARTIFACT_URL:
        description: "Link to the specific version in GAR"
        required: false
        type: string

      RUN_PR:
        description: "Set to true to run Trivy on PRs"
        required: false
        type: string

      ARCHITECTURES:
        default: "linux/amd64,linux/arm64"
        description: "Comma-separated list of architectures to scan (e.g., 'linux/amd64,linux/arm64')"
        required: false
        type: string

      PROJECT_ID:
        default: 'favedom-dev'
        required: false
        type: string

      GAR_LOCATION:
        default: 'us-central1'
        required: false
        type: string

      DOCKER_REGISTRY:
        default: 'docker'
        required: false
        type: string

      CREATE_CREDENTIALS_FILE:
        default: true
        required: false
        type: boolean

      EXPORT_ENVIRONMENT_VARIABLES:
        default: true
        required: false
        type: boolean

      TRIVY_CONTINUE_ON_ERROR:
        default: true
        required: false
        type: boolean

      TRIVY_TEMPLATE_FILE:
        default: 'trivy-template'
        required: false
        type: string

      TRIVY_OUTPUT:
        # default: 'trivy-results.md'
        default: 'trivy-results'
        required: false
        type: string

      TRIVY_IGNORE_UNFIXED:
        default: true   # Change to false
        required: false
        type: boolean

      TRIVY_EXIT_CODE:
        default: '0'  # Change to 1
        required: false
        type: string

      GH_USER_NAME:
        default: 'PowerVZ GitHub Bot'
        required: false
        type: string

      GH_USER_EMAIL:
        # default: 'github@powervz.com'
        default: ''
        required: false
        type: string

      TRIVY_REPO_NAME:
        default: 'trivy-scans'
        required: false
        type: string

      TRIVY_REPO_ORG_NAME:
        default: 'favedom-dev'
        required: false
        type: string

      TRIVY_MAIN_BRANCH:
        default: 'master'
        required: false
        type: string

      SLACK_CHANNEL:
        default: 'trivy-scans'
        required: false
        type: string

      SLACK_ICON:
        # default: ''
        required: false
        type: string

      SLACK_USERNAME:
        default: 'Trivy Scanner'
        required: false
        type: string

      SLACK_COLOR:
        default: "#0a0b23"
        required: false
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

jobs:

  trivy-setup:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && inputs.RUN_PR == 'true')
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    outputs:
      DOCKER_LOCATION: ${{ steps.setup-variables.outputs.DOCKER_LOCATION }}
      DOCKER_URL: ${{ steps.setup-variables.outputs.DOCKER_URL }}
      GHA_RUN_URL: ${{ steps.setup-variables.outputs.GHA_RUN_URL }}
      MATRIX_ARCH: ${{ steps.setup-variables.outputs.MATRIX_ARCH }}
      REPO_URL: ${{ steps.setup-variables.outputs.REPO_URL }}
      TRIVY_DIR: ${{ steps.setup-variables.outputs.TRIVY_DIR }}
      TRIVY_BASE_FILE: ${{ steps.setup-variables.outputs.TRIVY_BASE_FILE }}
      TRIVY_REPO_NAME: ${{ steps.setup-variables.outputs.TRIVY_REPO_NAME }}
      TRIVY_REPO_FULLNAME: ${{ steps.setup-variables.outputs.TRIVY_REPO_FULLNAME }}
      TRIVY_REPO_URL: ${{ steps.setup-variables.outputs.TRIVY_REPO_URL }}
      ACCESS_TOKEN: ${{ steps.get-secrets.outputs.access-token }}
      GH_TOKEN: ${{ steps.set-secrets.outputs.GH_TOKEN }}
      SLACK_TRIVY_WEBHOOK_URL: ${{ steps.set-secrets.outputs.SLACK_TRIVY_WEBHOOK_URL }}
      SLACK_DEVOPS_TOKEN: ${{ steps.set-secrets.outputs.SLACK_DEVOPS_TOKEN }}
    steps:

      # Not really used here to remove warning
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "🏷️ Set up variables"
        id: setup-variables
        run: |
          ARCHES="${{ inputs.architectures }}"
          MATRIX_JSON=$(echo "$ARCHES" | jq -R 'split(",")' | jq -c '{arch: .}')
          echo "MATRIX_JSON : ${MATRIX_JSON}"
          echo "MATRIX_ARCH=$MATRIX_JSON" >> $GITHUB_ENV
          echo "MATRIX_ARCH=$MATRIX_JSON" >> $GITHUB_OUTPUT

          DOCKER_LOCATION=${{ inputs.GAR_LOCATION }}-docker.pkg.dev/${{ inputs.PROJECT_ID }}/${{ inputs.DOCKER_REGISTRY }}/${{ inputs.NAME }}
          echo "DOCKER_LOCATION : ${DOCKER_LOCATION}"
          echo "DOCKER_LOCATION=${DOCKER_LOCATION}" >> $GITHUB_ENV
          echo "DOCKER_LOCATION=${DOCKER_LOCATION}" >> $GITHUB_OUTPUT

          DOCKER_URL="https://console.cloud.google.com/artifacts/docker/${{ inputs.PROJECT_ID }}/${{ inputs.GAR_LOCATION }}/${{ inputs.DOCKER_REGISTRY }}/${{ inputs.NAME }}?project=${{ inputs.PROJECT_ID }}/"
          echo "DOCKER_URL : ${DOCKER_URL}"
          echo "DOCKER_URL=${DOCKER_URL}" >> $GITHUB_ENV
          echo "DOCKER_URL=${DOCKER_URL}" >> $GITHUB_OUTPUT

          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          echo "REPO_URL : ${REPO_URL}"
          echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
          echo "REPO_URL=${REPO_URL}" >> $GITHUB_OUTPUT

          GHA_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "GHA_RUN_URL : ${GHA_RUN_URL}"
          echo "GHA_RUN_URL=${GHA_RUN_URL}" >> $GITHUB_ENV
          echo "GHA_RUN_URL=${GHA_RUN_URL}" >> $GITHUB_OUTPUT

          TRIVY_REPO_NAME="${{ inputs.TRIVY_REPO_NAME }}"
          echo "TRIVY_REPO_NAME : ${TRIVY_REPO_NAME}"
          echo "TRIVY_REPO_NAME=${TRIVY_REPO_NAME}" >> $GITHUB_ENV
          echo "TRIVY_REPO_NAME=${TRIVY_REPO_NAME}" >> $GITHUB_OUTPUT

          TRIVY_REPO_FULLNAME="${{ inputs.TRIVY_REPO_ORG_NAME }}/${TRIVY_REPO_NAME}"
          echo "TRIVY_REPO_FULLNAME : ${TRIVY_REPO_FULLNAME}"
          echo "TRIVY_REPO_FULLNAME=${TRIVY_REPO_FULLNAME}" >> $GITHUB_ENV
          echo "TRIVY_REPO_FULLNAME=${TRIVY_REPO_FULLNAME}" >> $GITHUB_OUTPUT

          TRIVY_REPO_URL="https://github.com/${TRIVY_REPO_FULLNAME}"
          echo "TRIVY_REPO_URL : ${TRIVY_REPO_URL}"
          echo "TRIVY_REPO_URL=${TRIVY_REPO_URL}" >> $GITHUB_ENV
          echo "TRIVY_REPO_URL=${TRIVY_REPO_URL}" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RELEASE_TYPE="PR"
          else
            RELEASE_TYPE="Release"
          fi
          TRIVY_DIR="${{ inputs.NAME }}/${RELEASE_TYPE}"
          echo "TRIVY_DIR : ${TRIVY_DIR}"
          echo "TRIVY_DIR=${TRIVY_DIR}" >> $GITHUB_ENV
          echo "TRIVY_DIR=${TRIVY_DIR}" >> $GITHUB_OUTPUT

          # TRIVY_BASE_FILE="Trivy-Scan-Results-${{ inputs.VERSION }}"
          TRIVY_BASE_FILE="${{ inputs.VERSION }}"
          echo "TRIVY_BASE_FILE : ${TRIVY_BASE_FILE}"
          echo "TRIVY_BASE_FILE=${TRIVY_BASE_FILE}" >> $GITHUB_ENV
          echo "TRIVY_BASE_FILE=${TRIVY_BASE_FILE}" >> $GITHUB_OUTPUT

      - name: "🔐 Get Secrets"
        # TODO
        # uses: favedom-dev/github-reusable-workflow/.github/actions/get-google-secrets@v2
        uses: favedom-dev/github-reusable-workflow/.github/actions/get-google-secrets@FAN-6956-secrets
        id: get-secrets
        with:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          SECRETS_TO_FETCH: ${{ inputs.SECRETS_TO_FETCH }}
          DEFAULT_SECRETS_TO_FETCH: ${{ inputs.DEFAULT_SECRETS_TO_FETCH }}

      - name: "🤫 Set Secrets as Outputs"
        id: set-secrets
        shell: bash
        run: |
          set -x  # Enable debug mode to trace commands
          echo "Debug: GH_TOKEN is set (length: ${#GH_TOKEN})"
          echo "Debug: SLACK_TRIVY_WEBHOOK_URL is set (length: ${#SLACK_TRIVY_WEBHOOK_URL})"
          echo "Debug: SLACK_DEVOPS_TOKEN is set (length: ${#SLACK_DEVOPS_TOKEN})"
          echo "GH_TOKEN=${GH_TOKEN}" >> $GITHUB_OUTPUT
          echo "SLACK_TRIVY_WEBHOOK_URL=${SLACK_TRIVY_WEBHOOK_URL}" >> $GITHUB_OUTPUT
          echo "SLACK_DEVOPS_TOKEN=${SLACK_DEVOPS_TOKEN}" >> $GITHUB_OUTPUT\
          echo "Debug: Contents of GITHUB_OUTPUT"
          cat $GITHUB_OUTPUT

  trivy-scan:
    needs: trivy-setup
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && inputs.RUN_PR == 'true')
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    strategy:
      matrix: ${{ fromJson(needs.trivy-setup.outputs.MATRIX_ARCH) }}
    steps:

      - name: "🏷️ Set up arch variables"
        id: setup-arch-variables
        run: |
          ARCH="${{ matrix.arch }}"
          echo "ARCH : ${ARCH}"

          ARCH_OUTPUT_FILE=${{ inputs.TRIVY_OUTPUT }}-${ARCH//\//-}
          echo "ARCH_OUTPUT_FILE : ${ARCH_OUTPUT_FILE}"
          echo "ARCH_OUTPUT_FILE=$ARCH_OUTPUT_FILE" >> $GITHUB_ENV
          echo "ARCH_OUTPUT_FILE=$ARCH_OUTPUT_FILE" >> $GITHUB_OUTPUT

          ARCH_TEMPLATE_FILE=${{ inputs.TRIVY_TEMPLATE_FILE }}-${ARCH//\//-}.tpl
          echo "ARCH_TEMPLATE_FILE : ${ARCH_TEMPLATE_FILE}"
          echo "ARCH_TEMPLATE_FILE=$ARCH_TEMPLATE_FILE" >> $GITHUB_ENV
          echo "ARCH_TEMPLATE_FILE=$ARCH_TEMPLATE_FILE" >> $GITHUB_OUTPUT

          ARCH_TRIVY_FILE=${{ needs.trivy-setup.outputs.TRIVY_BASE_FILE }}-${ARCH//\//-}
          echo "ARCH_TRIVY_FILE : ${ARCH_TRIVY_FILE}"
          echo "ARCH_TRIVY_FILE=$ARCH_TRIVY_FILE" >> $GITHUB_ENV
          echo "ARCH_TRIVY_FILE=$ARCH_TRIVY_FILE" >> $GITHUB_OUTPUT

          ARCH_TRIVY_LINK=https://github.com/${{ needs.trivy-setup.outputs.TRIVY_REPO_FULLNAME }}/blob/${{ inputs.TRIVY_MAIN_BRANCH }}/${{ needs.trivy-setup.outputs.TRIVY_DIR }}/${ARCH_TRIVY_FILE}.md
          echo "ARCH_TRIVY_LINK : ${ARCH_TRIVY_LINK}"
          echo "ARCH_TRIVY_LINK=$ARCH_TRIVY_LINK" >> $GITHUB_ENV
          echo "ARCH_TRIVY_LINK=$ARCH_TRIVY_LINK" >> $GITHUB_OUTPUT

      # - name: "🔐 Get Secrets"
      #   # TODO
      #   # uses: favedom-dev/github-reusable-workflow/.github/actions/get-google-secrets@v2
      #   uses: favedom-dev/github-reusable-workflow/.github/actions/get-google-secrets@FAN-6956-secrets
      #   id: get-secrets
      #   with:
      #     WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      #     WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      #     SECRETS_TO_FETCH: ${{ inputs.SECRETS_TO_FETCH }}
      #     DEFAULT_SECRETS_TO_FETCH: ${{ inputs.DEFAULT_SECRETS_TO_FETCH }}

      - name: "🔩 Git config"
        uses: favedom-dev/github-reusable-workflow/.github/actions/setup-git-config@v2
        with:
          GH_USER_NAME: ${{ inputs.GH_USER_NAME }}
          GH_USER_EMAIL: ${{ inputs.GH_USER_EMAIL }}

      - name: "🔍 Debug All trivy-setup Outputs"
        shell: bash
        run: |
          set -x
          echo "Dumping all needs.trivy-setup.outputs.*:"
          echo "DOCKER_LOCATION: ${{ needs.trivy-setup.outputs.DOCKER_LOCATION }}"
          echo "DOCKER_URL: ${{ needs.trivy-setup.outputs.DOCKER_URL }}"
          echo "GHA_RUN_URL: ${{ needs.trivy-setup.outputs.GHA_RUN_URL }}"
          echo "MATRIX_ARCH: ${{ needs.trivy-setup.outputs.MATRIX_ARCH }}"
          echo "REPO_URL: ${{ needs.trivy-setup.outputs.REPO_URL }}"
          echo "TRIVY_DIR: ${{ needs.trivy-setup.outputs.TRIVY_DIR }}"
          echo "TRIVY_BASE_FILE: ${{ needs.trivy-setup.outputs.TRIVY_BASE_FILE }}"
          echo "TRIVY_REPO_NAME: ${{ needs.trivy-setup.outputs.TRIVY_REPO_NAME }}"
          echo "TRIVY_REPO_FULLNAME: ${{ needs.trivy-setup.outputs.TRIVY_REPO_FULLNAME }}"
          echo "TRIVY_REPO_URL: ${{ needs.trivy-setup.outputs.TRIVY_REPO_URL }}"
          echo "ACCESS_TOKEN: $(if [ -n "${{ needs.trivy-setup.outputs.ACCESS_TOKEN }}" ]; then echo 'set (length: ${#{{ needs.trivy-setup.outputs.ACCESS_TOKEN }}})'; else echo 'NOT set'; fi)"
          echo "GH_TOKEN: $(if [ -n "${{ needs.trivy-setup.outputs.GH_TOKEN }}" ]; then echo 'set (length: ${#{{ needs.trivy-setup.outputs.GH_TOKEN }}})'; else echo 'NOT set'; fi)"
          echo "SLACK_TRIVY_WEBHOOK_URL: $(if [ -n "${{ needs.trivy-setup.outputs.SLACK_TRIVY_WEBHOOK_URL }}" ]; then echo 'set (length: ${#{{ needs.trivy-setup.outputs.SLACK_TRIVY_WEBHOOK_URL }}})'; else echo 'NOT set'; fi)"
          echo "SLACK_DEVOPS_TOKEN: $(if [ -n "${{ needs.trivy-setup.outputs.SLACK_DEVOPS_TOKEN }}" ]; then echo 'set (length: ${#{{ needs.trivy-setup.outputs.SLACK_DEVOPS_TOKEN }}})'; else echo 'NOT set'; fi)"

      # - name: "🔍 Debug GH_TOKEN"
      #   shell: bash
      #   run: |
      #     set -x  # Enable debug mode to trace commands
      #     if [ -n "${{ needs.trivy-setup.outputs.GH_TOKEN }}" ]; then
      #       echo "GH_TOKEN output is set (length: ${#{{ needs.trivy-setup.outputs.GH_TOKEN }})"
      #     else
      #       echo "GH_TOKEN output is NOT set"
      #       exit 1
      #     fi

      - name: "☁️ Checkout repository ${{ needs.trivy-setup.outputs.TRIVY_REPO_FULLNAME }}"
        uses: actions/checkout@v4
        with:
          token: ${{ needs.trivy-setup.outputs.GH_TOKEN }}
          repository: ${{ needs.trivy-setup.outputs.TRIVY_REPO_FULLNAME }}
          path: '${{ needs.trivy-setup.outputs.TRIVY_REPO_NAME }}'

      - name: "🔑 Docker Auth: GAR"
        id: auth-docker
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          # password: '${{ steps.auth-gcp-token.outputs.access_token }}'
          password: '${{ needs.trivy-setup.outputs.ACCESS_TOKEN }}'
          registry: '${{ inputs.GAR_LOCATION }}-docker.pkg.dev'  # Google Artifact Registry

      - name: "🚀 Run Trivy vulnerability scanner: ${{ matrix.arch }}"
        uses: aquasecurity/trivy-action@0.29.0
        env:
          TRIVY_PLATFORMS: ${{ matrix.arch }}
        with:
          image-ref: '${{ needs.trivy-setup.outputs.DOCKER_LOCATION }}:${{ inputs.VERSION }}'
          output: "${{ steps.setup-arch-variables.outputs.ARCH_OUTPUT_FILE }}.JSON"
          format: "json"
          exit-code: ${{ inputs.TRIVY_EXIT_CODE }}
          ignore-unfixed: ${{ inputs.TRIVY_IGNORE_UNFIXED }}
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
        continue-on-error: ${{ inputs.TRIVY_CONTINUE_ON_ERROR }}

      - name: "👀 Trivy JSON"
        run: |
          cat ${{ steps.setup-arch-variables.outputs.ARCH_OUTPUT_FILE }}.JSON

      - name: "🔍 Extract vulnerability counts"
        id: trivy-summary
        env:
          JSON_FILE: ${{ steps.setup-arch-variables.outputs.ARCH_OUTPUT_FILE }}.JSON
        run: |
          CRITICAL_COUNT=$(jq '[.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[] | select(.Severity=="CRITICAL")] | length' ${JSON_FILE} || echo 0)
          HIGH_COUNT=$(jq '[.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[] | select(.Severity=="HIGH")] | length' ${JSON_FILE} || echo 0)

          echo "CRITICAL_COUNT : ${CRITICAL_COUNT}"
          echo "HIGH_COUNT     : ${HIGH_COUNT}"
          echo "CRITICAL_COUNT=${CRITICAL_COUNT}" >> $GITHUB_ENV
          echo "CRITICAL_COUNT=${CRITICAL_COUNT}" >> $GITHUB_OUTPUT
          echo "HIGH_COUNT=${HIGH_COUNT}" >> $GITHUB_ENV
          echo "HIGH_COUNT=${HIGH_COUNT}" >> $GITHUB_OUTPUT

      - name: "📄 Convert JSON to Markdown"
        env:
          ARTIFACT_URL: ${{ inputs.ARTIFACT_URL }}
          DOCKER_URL: ${{ needs.trivy-setup.outputs.DOCKER_URL }}
          REPO_URL: ${{ needs.trivy-setup.outputs.REPO_URL }}
          GHA_RUN_URL: ${{ needs.trivy-setup.outputs.GHA_RUN_URL }}
          TEMPLATE_FILE: ${{ steps.setup-arch-variables.outputs.ARCH_TEMPLATE_FILE }}
          MARKDOWN_FILE: ${{ steps.setup-arch-variables.outputs.ARCH_OUTPUT_FILE }}.md
          JSON_FILE: ${{ steps.setup-arch-variables.outputs.ARCH_OUTPUT_FILE }}.JSON
        run: |
          echo "# ${{ inputs.NAME }} ${{ inputs.VERSION }} ${{ matrix.arch }}" > ${MARKDOWN_FILE}
          echo "- GitHub repo  : [${{ github.repository }}](${REPO_URL})" >> ${MARKDOWN_FILE}
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "- GitHub tag   : [${{ github.repository }}](${REPO_URL}/releases/tag/v${{ inputs.VERSION }})" >> ${MARKDOWN_FILE}
          fi
          echo "- GHA run      : [${{ github.run_id }}](${GHA_RUN_URL})" >> ${MARKDOWN_FILE}
          echo "- GAR registry : [${{ inputs.NAME }}](${DOCKER_URL})" >> ${MARKDOWN_FILE}
          if [ -n "${ARTIFACT_URL}" ]; then
            echo "- GAR version  : [${{ inputs.NAME }}:${{ inputs.VERSION }}](${{ inputs.ARTIFACT_URL }})" >> ${MARKDOWN_FILE}
          fi
          echo "---" >> ${MARKDOWN_FILE}

          jq -r '
          if (.Results? // [] | length) == 0 then
            "## No vulnerabilities found."
          else
            [.Results[]? | select(.Vulnerabilities != null)]
            | group_by(.Target)[]
            | "# " + .[0].Target + "\n" +
              "| CVE ID | Severity | Package | Installed Version | Fixed Version |\n" +
              "|--------|----------|---------|-------------------|--------------|\n" +
              (map(select(.Vulnerabilities != null) | .Vulnerabilities[]? |
                "| [" + .VulnerabilityID + "](" + (.PrimaryURL // "N/A") + ") | " + .Severity + " | " + .PkgName + " | " + .InstalledVersion + " | " + (.FixedVersion // "N/A") + " |"
              ) | join("\n"))
          end' "${JSON_FILE}" >> "${MARKDOWN_FILE}"

      - name: "👀 View updated scan results"
        run: |
          cat ${{ steps.setup-arch-variables.outputs.ARCH_OUTPUT_FILE }}.md

      - name: "📖 Commit Scan Results to GitHub ${{ needs.trivy-setup.outputs.TRIVY_REPO_FULLNAME }}"
        working-directory: ${{ needs.trivy-setup.outputs.TRIVY_REPO_NAME }}
        env:
          OUTPUT_JSON_FILE: ../${{ steps.setup-arch-variables.outputs.ARCH_OUTPUT_FILE }}.JSON
          OUTPUT_MD_FILE: ../${{ steps.setup-arch-variables.outputs.ARCH_OUTPUT_FILE }}.md
          TRIVY_DIR: ${{ needs.trivy-setup.outputs.TRIVY_DIR }}
          TRIVY_JSON_FILE: ${{ steps.setup-arch-variables.outputs.ARCH_TRIVY_FILE }}.JSON
          TRIVY_MD_FILE: ${{ steps.setup-arch-variables.outputs.ARCH_TRIVY_FILE }}.md
        run: |
          echo "TRIVY_DIR        : ${TRIVY_DIR}"
          echo "TRIVY_JSON_FILE  : ${TRIVY_JSON_FILE}"
          echo "TRIVY_MD_FILE    : ${TRIVY_MD_FILE}"
          echo "OUTPUT_JSON_FILE : ${OUTPUT_JSON_FILE}"
          echo "OUTPUT_MD_FILE   : ${OUTPUT_MD_FILE}"
          if [ ! -d "${TRIVY_DIR}" ]; then
            echo "Creating dir: ${TRIVY_DIR}"
            mkdir -p "${TRIVY_DIR}"
          fi

          echo "Move ${OUTPUT_JSON_FILE}..."
          mv ${OUTPUT_JSON_FILE} "${TRIVY_DIR}/${TRIVY_JSON_FILE}"
          echo "Move ${OUTPUT_MD_FILE}..."
          mv ${OUTPUT_MD_FILE} "${TRIVY_DIR}/${TRIVY_MD_FILE}"

          echo "${TRIVY_MD_FILE}:"
          cat "${TRIVY_DIR}/${TRIVY_MD_FILE}"

          echo "Staging and committing trivy files..."
          git add "${TRIVY_DIR}/${TRIVY_MD_FILE}" "${TRIVY_DIR}/${TRIVY_JSON_FILE}"
          git commit -m "chore: ${{ inputs.NAME }} : ${{ inputs.VERSION }} Update Trivy scan results "

          echo "Pushing to remote..."
          for i in {1..5}; do
            git pull --rebase origin ${{ inputs.TRIVY_MAIN_BRANCH }} && git push origin ${{ inputs.TRIVY_MAIN_BRANCH }} && break
            echo "Retrying push... attempt $i"
            sleep 5
          done

          echo "Link to Trivy scan: ${{ steps.setup-arch-variables.outputs.ARCH_TRIVY_LINK}}"

  trivy-notification:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && inputs.RUN_PR == 'true')
    needs: [trivy-setup, trivy-scan]
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    steps:

      - name: "🔩 Git config"
        uses: favedom-dev/github-reusable-workflow/.github/actions/setup-git-config@v2
        with:
          GH_USER_NAME: ${{ inputs.GH_USER_NAME }}
          GH_USER_EMAIL: ${{ inputs.GH_USER_EMAIL }}

      - name: "☁️ Checkout repository ${{ needs.trivy-setup.outputs.TRIVY_REPO_FULLNAME }}"
        uses: actions/checkout@v4
        with:
          token: ${{ needs.trivy-setup.outputs.GH_TOKEN }}
          repository: ${{ needs.trivy-setup.outputs.TRIVY_REPO_FULLNAME }}
          path: '${{ needs.trivy-setup.outputs.TRIVY_REPO_NAME }}'

      - name: "🏷️ Set up notification variables"
        id: setup-notification-variables
        working-directory: ${{ needs.trivy-setup.outputs.TRIVY_REPO_NAME }}
        run: |
          MATRIX_ARCH='${{ needs.trivy-setup.outputs.MATRIX_ARCH }}'
          ARCH_LIST=$(echo "$MATRIX_ARCH" | jq -r '.arch | join(", ")')

          echo "ARCH_LIST : ${ARCH_LIST}"
          echo "ARCH_LIST=${ARCH_LIST}" >> $GITHUB_ENV
          echo "ARCH_LIST=${ARCH_LIST}" >> $GITHUB_OUTPUT

          SUMMARY=""
          echo "# Trivy scans:" >> $GITHUB_STEP_SUMMARY
          echo "| 🏛️ | 🔍  | 🛑 | ⚠️ |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          for ARCH in $(echo "$MATRIX_ARCH" | jq -r '.arch[]'); do
            TRIVY_MD_FILE="${{ needs.trivy-setup.outputs.TRIVY_BASE_FILE }}-${ARCH//\//-}.md"
            TRIVY_JSON_FILE="${{ needs.trivy-setup.outputs.TRIVY_BASE_FILE }}-${ARCH//\//-}.JSON"
            TRIVY_MD_FILE_PATH="${{ needs.trivy-setup.outputs.TRIVY_DIR }}/${TRIVY_MD_FILE}"
            TRIVY_JSON_FILE_PATH="${{ needs.trivy-setup.outputs.TRIVY_DIR }}/${TRIVY_JSON_FILE}"
            TRIVY_LINK="https://github.com/${{ needs.trivy-setup.outputs.TRIVY_REPO_FULLNAME }}/blob/${{ inputs.TRIVY_MAIN_BRANCH }}/${{ needs.trivy-setup.outputs.TRIVY_DIR }}/${TRIVY_MD_FILE}"

            echo "TRIVY_MD_FILE        : ${TRIVY_MD_FILE}"
            echo "TRIVY_MD_FILE_PATH   : ${TRIVY_MD_FILE_PATH}"
            echo "TRIVY_JSON_FILE      : ${TRIVY_JSON_FILE}"
            echo "TRIVY_JSON_FILE_PATH : ${TRIVY_JSON_FILE_PATH}"
            echo "TRIVY_LINK           : ${TRIVY_LINK}"

            CRITICAL=$(jq '[.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[] | select(.Severity=="CRITICAL")] | length' "${TRIVY_JSON_FILE_PATH}" || echo 0)
            HIGH=$(jq '[.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[] | select(.Severity=="HIGH")] | length' "${TRIVY_JSON_FILE_PATH}" || echo 0)

            SUMMARY="${SUMMARY}\n🔍 *${ARCH}* → <${TRIVY_LINK}|Scan Results> | 🛑 Critical: ${CRITICAL} ⚠️ High: ${HIGH}"
            # echo "| 🔍 *${ARCH}* → [Scan Results](${TRIVY_LINK}) | 🛑 Critical: ${CRITICAL} | ⚠️ High: ${HIGH} |" >> $GITHUB_STEP_SUMMARY
            echo "| 🏛️ *${ARCH}* | 🔍 [Scan Results](${TRIVY_LINK}) | 🛑 Critical: ${CRITICAL} | ⚠️ High: ${HIGH} |" >> $GITHUB_STEP_SUMMARY
          done

          echo "SUMMARY : ${SUMMARY}"
          echo "SUMMARY=${SUMMARY}" >> $GITHUB_ENV
          echo "SUMMARY=${SUMMARY}" >> $GITHUB_OUTPUT

      # https://github.com/slackapi/slack-github-action
      - name: "📢 Notify Slack"
        uses: slackapi/slack-github-action@v2.0.0
        with:
          errors: true
          # webhook: ${{ secrets.SLACK_TRIVY_WEBHOOK_URL }}
          webhook: ${{ needs.trivy-setup.outputs.SLACK_TRIVY_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🚨 *Trivy Scan: ${{ inputs.NAME }} ${{ inputs.VERSION }} (${{ steps.setup-notification-variables.outputs.ARCH_LIST }})*"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "🚨 ${{ inputs.NAME }} | ${{ inputs.VERSION }} | (${{ steps.setup-notification-variables.outputs.ARCH_LIST }})"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "🔗 Workflow Run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}>"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.setup-notification-variables.outputs.SUMMARY }}"
              - type: "divider"

