name: Trivy

on:  # yamllint disable-line rule:truthy
  workflow_call:

    inputs:
      NAME:
        required: true
        type: string
        description: "Name of service"

      VERSION:
        required: true
        type: string

      ARCHITECTURES:
        default: "linux/amd64,linux/arm64"
        description: "Comma-separated list of architectures to scan (e.g., 'linux/amd64,linux/arm64')"
        required: false
        type: string

      PROJECT_ID:
        default: 'favedom-dev'
        required: false
        type: string

      GAR_LOCATION:
        default: 'us-central1'
        required: false
        type: string

      DOCKER_REGISTRY:
        default: 'docker'
        required: false
        type: string

      CREATE_CREDENTIALS_FILE:
        default: true
        required: false
        type: boolean

      EXPORT_ENVIRONMENT_VARIABLES:
        default: true
        required: false
        type: boolean

      TRIVY_CONTINUE_ON_ERROR:
        default: true
        required: false
        type: boolean

      TRIVY_TEMPLATE_FILE:
        default: 'trivy-template'
        required: false
        type: string

      TRIVY_OUTPUT:
        # default: 'trivy-results.md'
        default: 'trivy-results'
        required: false
        type: string

      TRIVY_IGNORE_UNFIXED:
        default: true   # Change to false
        required: false
        type: boolean

      TRIVY_EXIT_CODE:
        default: '0'  # Change to 1
        required: false
        type: string

      GH_USER_NAME:
        default: 'PowerVZ GitHub Bot'
        required: false
        type: string

      WIKI_REPO_NAME:
        default: 'favedom-dev/trivy-scans'
        required: false
        type: string

      WIKI_MAIN_BRANCH:
        default: 'master'
        required: false
        type: string

      SLACK_USERNAME:
        default: 'Trivy Scanner'
        required: false
        type: string

      SLACK_COLOR:
        default: "#0a0b23"
        required: false
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:
      GH_TOKEN:
        description: "GitHub token"
        required: true

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

      SLACK_TRIVY_WEBHOOK_URL:
        description: "Slack webhook url for trivy"
        required: false

jobs:

  setup:
    # timeout-minutes: 15
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    outputs:
      DOCKER_LOCATION: ${{ steps.setup-variables.outputs.DOCKER_LOCATION }}
      DOCKER_URL: ${{ steps.setup-variables.outputs.DOCKER_URL }}
      GHA_RUN_URL: ${{ steps.setup-variables.outputs.GHA_RUN_URL }}
      MATRIX_ARCH: ${{ steps.setup-variables.outputs.MATRIX_ARCH }}
      REPO_URL: ${{ steps.setup-variables.outputs.REPO_URL }}
      WIKI_DIR: ${{ steps.setup-variables.outputs.WIKI_DIR }}
      WIKI_BASE_FILE: ${{ steps.setup-variables.outputs.WIKI_BASE_FILE }}
      WIKI_REPO_NAME: ${{ steps.setup-variables.outputs.WIKI_REPO_NAME }}
      WIKI_REPO_URL: ${{ steps.setup-variables.outputs.WIKI_REPO_URL }}
    steps:

      - name: "🏷️ Set up variables"
        id: setup-variables
        run: |
          ARCHES="${{ inputs.architectures }}"
          MATRIX_JSON=$(echo "$ARCHES" | jq -R 'split(",")' | jq -c '{arch: .}')
          echo "MATRIX_JSON : ${MATRIX_JSON}"
          echo "MATRIX_ARCH=$MATRIX_JSON" >> $GITHUB_ENV
          echo "MATRIX_ARCH=$MATRIX_JSON" >> $GITHUB_OUTPUT

          DOCKER_LOCATION=${{ inputs.GAR_LOCATION }}-docker.pkg.dev/${{ inputs.PROJECT_ID }}/${{ inputs.DOCKER_REGISTRY }}/${{ inputs.NAME }}
          echo "DOCKER_LOCATION : ${DOCKER_LOCATION}"
          echo "DOCKER_LOCATION=${DOCKER_LOCATION}" >> $GITHUB_ENV
          echo "DOCKER_LOCATION=${DOCKER_LOCATION}" >> $GITHUB_OUTPUT

          DOCKER_URL="https://console.cloud.google.com/artifacts/docker/${{ inputs.PROJECT_ID }}/${{ inputs.GAR_LOCATION }}/${{ inputs.DOCKER_REGISTRY }}/${{ inputs.NAME }}?project=${{ inputs.PROJECT_ID }}/"
          echo "DOCKER_URL : ${DOCKER_URL}"
          echo "DOCKER_URL=${DOCKER_URL}" >> $GITHUB_ENV
          echo "DOCKER_URL=${DOCKER_URL}" >> $GITHUB_OUTPUT

          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          echo "REPO_URL : ${REPO_URL}"
          echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
          echo "REPO_URL=${REPO_URL}" >> $GITHUB_OUTPUT

          GHA_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "GHA_RUN_URL : ${GHA_RUN_URL}"
          echo "GHA_RUN_URL=${GHA_RUN_URL}" >> $GITHUB_ENV
          echo "GHA_RUN_URL=${GHA_RUN_URL}" >> $GITHUB_OUTPUT

          WIKI_REPO_NAME="${{ inputs.WIKI_REPO_NAME }}"
          echo "WIKI_REPO_NAME : ${WIKI_REPO_NAME}"
          echo "WIKI_REPO_NAME=${WIKI_REPO_NAME}" >> $GITHUB_ENV
          echo "WIKI_REPO_NAME=${WIKI_REPO_NAME}" >> $GITHUB_OUTPUT

          WIKI_REPO_URL="https://github.com/${WIKI_REPO_NAME}.wiki"
          echo "WIKI_REPO_URL : ${WIKI_REPO_URL}"
          echo "WIKI_REPO_URL=${WIKI_REPO_URL}" >> $GITHUB_ENV
          echo "WIKI_REPO_URL=${WIKI_REPO_URL}" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RELEASE_TYPE="PR"
          else
            RELEASE_TYPE="Release"
          fi
          WIKI_DIR="${{ inputs.NAME }}/${RELEASE_TYPE}"
          echo "WIKI_DIR : ${WIKI_DIR}"
          echo "WIKI_DIR=${WIKI_DIR}" >> $GITHUB_ENV
          echo "WIKI_DIR=${WIKI_DIR}" >> $GITHUB_OUTPUT

          # WIKI_BASE_FILE="Trivy-Scan-Results-${{ inputs.VERSION }}"
          WIKI_BASE_FILE="${{ inputs.VERSION }}"
          echo "WIKI_BASE_FILE : ${WIKI_BASE_FILE}"
          echo "WIKI_BASE_FILE=${WIKI_BASE_FILE}" >> $GITHUB_ENV
          echo "WIKI_BASE_FILE=${WIKI_BASE_FILE}" >> $GITHUB_OUTPUT

      # - name: "🔩 Git config"
      #   run: |
      #     git config --global user.email ""
      #     git config --global user.name "${{ inputs.GH_USER_NAME }}"

      # - name: "☁️ Checkout wiki repository ${{ steps.setup-variables.outputs.WIKI_REPO_NAME }}"
      #   uses: actions/checkout@v4
      #   with:
      #     token: ${{ secrets.GH_TOKEN }}
      #     repository: ${{ steps.setup-variables.outputs.WIKI_REPO_NAME }}
      #     path: 'wiki'


  # TODO
  trivy-scan:
    needs: setup
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.MATRIX_ARCH) }}
    steps:

      - name: "🏷️ Set up arch variables"
        id: setup-arch-variables
        run: |
          ARCH="${{ matrix.arch }}"
          echo "ARCH : ${ARCH}"

          ARCH_OUTPUT_FILE=${{ inputs.TRIVY_OUTPUT }}-${ARCH//\//-}.md
          echo "ARCH_OUTPUT_FILE : ${ARCH_OUTPUT_FILE}"
          echo "ARCH_OUTPUT_FILE=$ARCH_OUTPUT_FILE" >> $GITHUB_ENV
          echo "ARCH_OUTPUT_FILE=$ARCH_OUTPUT_FILE" >> $GITHUB_OUTPUT

          ARCH_TEMPLATE_FILE=${{ inputs.TRIVY_TEMPLATE_FILE }}-${ARCH//\//-}.tpl
          echo "ARCH_TEMPLATE_FILE : ${ARCH_TEMPLATE_FILE}"
          echo "ARCH_TEMPLATE_FILE=$ARCH_TEMPLATE_FILE" >> $GITHUB_ENV
          echo "ARCH_TEMPLATE_FILE=$ARCH_TEMPLATE_FILE" >> $GITHUB_OUTPUT

          ARCH_WIKI_FILE=${{ needs.setup.outputs.WIKI_BASE_FILE }}-${ARCH//\//-}.md
          echo "ARCH_WIKI_FILE : ${ARCH_WIKI_FILE}"
          echo "ARCH_WIKI_FILE=$ARCH_WIKI_FILE" >> $GITHUB_ENV
          echo "ARCH_WIKI_FILE=$ARCH_WIKI_FILE" >> $GITHUB_OUTPUT

          ARCH_WIKI_LINK=https://github.com/${{ needs.setup.outputs.WIKI_REPO_NAME }}/wiki/${ARCH_WIKI_FILE%.*}
          echo "ARCH_WIKI_LINK : ${ARCH_WIKI_LINK}"
          echo "ARCH_WIKI_LINK=$ARCH_WIKI_LINK" >> $GITHUB_ENV
          echo "ARCH_WIKI_LINK=$ARCH_WIKI_LINK" >> $GITHUB_OUTPUT



      - name: "🔩 Git config"
        run: |
          git config --global user.email ""
          git config --global user.name "${{ inputs.GH_USER_NAME }}"

      - name: "☁️ Checkout wiki repository ${{ needs.setup.outputs.WIKI_REPO_NAME }}"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          repository: ${{ needs.setup.outputs.WIKI_REPO_NAME }}.wiki
          path: 'wiki'

      - name: "🔑 Google Auth Token"
        id: auth-gcp-token
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'
          create_credentials_file: ${{ inputs.CREATE_CREDENTIALS_FILE }}
          export_environment_variables: ${{ inputs.EXPORT_ENVIRONMENT_VARIABLES }}

      - name: "🔑 Docker Auth: GAR"
        id: auth-docker
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth-gcp-token.outputs.access_token }}'
          registry: '${{ inputs.GAR_LOCATION }}-docker.pkg.dev'  # Google Artifact Registry

      - name: "📄 Trivy template"
        env:
          DOCKER_URL: ${{ needs.setup.outputs.DOCKER_URL }}
          REPO_URL: ${{ needs.setup.outputs.REPO_URL }}
          GHA_RUN_URL: ${{ needs.setup.outputs.GHA_RUN_URL }}
          TEMPLATE_FILE: ${{ steps.setup-arch-variables.outputs.ARCH_TEMPLATE_FILE }}
        run: |
          echo "github.repositoryUrl : ${{ github.repositoryUrl }}"
          echo "github.run_id        : ${{ github.run_id }}"
          echo "github.server_url    : ${{ github.server_url }}"
          echo "github.repository    : ${{ github.repository }}"
          echo "DOCKER_URL           : ${DOCKER_URL}"
          echo "REPO_URL             : ${REPO_URL}"
          echo "GHA_RUN_URL          : ${GHA_RUN_URL}"
          echo "TEMPLATE_FILE        : ${TEMPLATE_FILE}"

          cat <<EOF > ${TEMPLATE_FILE}
          # ${{ inputs.NAME }} ${{ inputs.VERSION }} ${{ matrix.arch }}
            - GitHub repo: [${{ github.repository }}](${REPO_URL})
            - GHA run: [${{ github.run_id }}](${GHA_RUN_URL})
            - GAR registry: [${{ inputs.NAME }}](${DOCKER_URL})
          ---
          {{- range . }}
          ## {{ .Target }}
          | CVE ID | Severity | Package | Installed Version | Fixed Version |
          |--------|----------|---------|-------------------|--------------|
          {{- range .Vulnerabilities }}
          | [{{ .VulnerabilityID }}]({{ .PrimaryURL }}) | {{ .Severity }} | {{ .PkgName }} | {{ .InstalledVersion }} | {{ .FixedVersion }} |
          {{- end }}
          {{- end }}
          EOF

          echo "TEMPLATE_FILE ${TEMPLATE_FILE}":
            cat ${TEMPLATE_FILE}

      - name: "🚀 Run Trivy vulnerability scanner: ${{ matrix.arch }}"
        uses: aquasecurity/trivy-action@0.29.0
        env:
          TRIVY_PLATFORMS: ${{ matrix.arch }}
          # DOCKER_LOCATION: ${{ steps.setup-variables.outputs.DOCKER_LOCATION }}
        with:
          image-ref: '${{ needs.setup.outputs.DOCKER_LOCATION }}:${{ inputs.VERSION }}'
          output: "${{ steps.setup-arch-variables.outputs.ARCH_OUTPUT_FILE }}"
          format: 'template'
          template: "@${{ steps.setup-arch-variables.outputs.ARCH_TEMPLATE_FILE }}"
          exit-code: ${{ inputs.TRIVY_EXIT_CODE }}
          ignore-unfixed: ${{ inputs.TRIVY_IGNORE_UNFIXED }}
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        continue-on-error: ${{ inputs.TRIVY_CONTINUE_ON_ERROR }}

      - name: "👀 View updated scan results"
        run: |
          cat ${{ steps.setup-arch-variables.outputs.ARCH_OUTPUT_FILE }}

  # # TODO
  # trivy-results:
  #   # name: "Commit Scan Results and Notify"
  #   permissions:
  #     contents: 'read'
  #     id-token: 'write'
  #   runs-on: ${{ inputs.GH_RUNS_ON }}
  #   needs: [setup, trivy-scan]
  #   steps:

      - name: "📖 Commit Scan Results to GitHub Wiki"
        working-directory: wiki
        env:
          OUTPUT_FILE: ../${{ steps.setup-arch-variables.outputs.ARCH_OUTPUT_FILE }}
          WIKI_DIR: ${{ needs.setup.outputs.WIKI_DIR }}
          # WIKI_BASE_FILE: ${{ steps.setup-arch-variables.outputs.ARCH_WIKI_FILE }}
          WIKI_FILE: ${{ steps.setup-arch-variables.outputs.ARCH_WIKI_FILE }}
        run: |
          echo "WIKI_DIR    : ${WIKI_DIR}"
          echo "WIKI_FILE   : ${WIKI_FILE}"
          echo "OUTPUT_FILE : ${OUTPUT_FILE}"
          if [ ! -d "${WIKI_DIR}" ]; then
            echo "Creating dir: ${WIKI_DIR}"
            mkdir -p "${WIKI_DIR}"
          fi
          mv ${OUTPUT_FILE} "${WIKI_DIR}/${WIKI_FILE}"
          cat "${WIKI_DIR}/${WIKI_FILE}"
          git add "${WIKI_DIR}/${WIKI_FILE}"

          git commit -m "chore: ${{ inputs.NAME }} : ${{ inputs.VERSION }} Update Trivy scan results "

          for i in {1..5}; do
            git pull --rebase origin ${{ inputs.WIKI_MAIN_BRANCH }} && git push origin ${{ inputs.WIKI_MAIN_BRANCH }} && break
            echo "Retrying push... attempt $i"
            sleep 5
          done

          echo "Link to wiki page: ${{ steps.setup-arch-variables.outputs.ARCH_WIKI_LINK}}"

      - name: "📢 Notify Slack"
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_TRIVY_WEBHOOK_URL }}
          SLACK_USERNAME: ${{ inputs.SLACK_USERNAME }}
          SLACK_TITLE: "Trivy Scan Results | ${{ inputs.NAME }} : ${{ inputs.VERSION }} ${{ matrix.arch }}"
          SLACK_MESSAGE: "Trivy scan completed. [See results in GitHub Wiki](${{ steps.setup-arch-variables.outputs.ARCH_WIKI_LINK}})"
          SLACK_COLOR: ${{ inputs.SLACK_COLOR }}
