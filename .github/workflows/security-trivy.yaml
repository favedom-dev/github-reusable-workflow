name: Trivy

on:  # yamllint disable-line rule:truthy
  workflow_call:

    inputs:
      NAME:
        required: true
        type: string
        description: "Name of service"

      VERSION:
        required: true
        type: string

      PROJECT_ID:
        default: 'favedom-dev'
        required: false
        type: string

      GAR_LOCATION:
        default: 'us-central1'
        required: false
        type: string

      DOCKER_REGISTRY:
        default: 'docker'
        required: false
        type: string

      CREATE_CREDENTIALS_FILE:
        default: true
        required: false
        type: boolean

      EXPORT_ENVIRONMENT_VARIABLES:
        default: true
        required: false
        type: boolean

      TRIVY_CONTINUE_ON_ERROR:
        default: true
        required: false
        type: boolean

      TRIVY_TEMPLATE_FILE:
        default: 'trivy-template.tpl'
        required: false
        type: string

      TRIVY_OUTPUT:
        default: 'trivy-results.md'
        required: false
        type: string

      TRIVY_IGNORE_UNFIXED:
        default: true   # Change to false
        required: false
        type: boolean

      TRIVY_EXIT_CODE:
        default: '0'  # Change to 1
        required: false
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:
      # GH_TOKEN:
      #   description: "GitHub token"
      #   required: true

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

jobs:

  trivy:
    # timeout-minutes: 15
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    steps:

      # - name: "☁️ Checkout repository"
      #   uses: actions/checkout@v4

      - name: "🔑 Google Auth Token"
        id: auth-gcp-token
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'
          create_credentials_file: ${{ inputs.CREATE_CREDENTIALS_FILE }}
          export_environment_variables: ${{ inputs.EXPORT_ENVIRONMENT_VARIABLES }}

      - name: "🔑 Docker Auth: GAR"
        id: auth-docker
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth-gcp-token.outputs.access_token }}'
          registry: '${{ inputs.GAR_LOCATION }}-docker.pkg.dev'  # Google Artifact Registry

      - name: "🏷️ Set up variables"
        id: setup-variables
        run: |
          DOCKER_LOCATION=${{ inputs.GAR_LOCATION }}-docker.pkg.dev/${{ inputs.PROJECT_ID }}/${{ inputs.DOCKER_REGISTRY }}/${{ inputs.NAME }}
          echo "DOCKER_LOCATION : ${DOCKER_LOCATION}"
          echo "DOCKER_LOCATION=${DOCKER_LOCATION}" >> $GITHUB_ENV
          echo "DOCKER_LOCATION=${DOCKER_LOCATION}" >> $GITHUB_OUTPUT
          DOCKER_URL="https://console.cloud.google.com/artifacts/docker/${{ inputs.PROJECT_ID }}/${{ inputs.GAR_LOCATION }}/${{ inputs.DOCKER_REGISTRY }}/${{ inputs.NAME }}?project=${{ inputs.PROJECT_ID }}/"
          echo "DOCKER_URL : ${DOCKER_URL}"
          echo "DOCKER_URL=${DOCKER_URL}" >> $GITHUB_ENV
          echo "DOCKER_URL=${DOCKER_URL}" >> $GITHUB_OUTPUT

      - name: " Trivy template"
        env:
          DOCKER_URL: ${{ steps.setup-variables.outputs.DOCKER_URL }}
          TEMPLATE_FILE: ${{ inputs.TRIVY_TEMPLATE_FILE }}
        run: |
          echo "github.repositoryUrl : ${{ github.repositoryUrl }}"
          echo "github.run_id        : ${{ github.run_id }}"
          echo "github.server_url    : ${{ github.server_url }}"
          echo "github.repository    : ${{ github.repository }}"
          echo "DOCKER_URL           : ${DOCKER_URL}"
          echo "TEMPLATE_FILE        : ${TEMPLATE_FILE}"

          cat <<EOF > ${TEMPLATE_FILE}
          # ${{ inputs.NAME }} ${{ inputs.VERSION }}
            - GitHub [repo ${{ inputs.NAME }}](${{ github.repositoryUrl }})
            - GHA [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - GAR [registry ${{ inputs.NAME }}](${DOCKER_URL})
          {{- range . }}
          ## {{ .Target }}
          | CVE ID | Severity | Package | Installed Version | Fixed Version |
          |--------|----------|---------|-------------------|--------------|
          {{- range .Vulnerabilities }}
          | [{{ .VulnerabilityID }}]({{ .PrimaryURL }}) | {{ .Severity }} | {{ .PkgName }} | {{ .InstalledVersion }} | {{ .FixedVersion }} |
          {{- end }}
          {{- end }}
          EOF

      - name: "🚀 Run Trivy vulnerability scanner: arm64"
        # uses: aquasecurity/trivy-action@master
        uses: aquasecurity/trivy-action@0.29.0
        env:
          TRIVY_PLATFORMS: linux/arm64
          DOCKER_LOCATION: ${{ steps.setup-variables.outputs.DOCKER_LOCATION }}
          TEMPLATE_FILE: trivy-template.tpl
        with:
          image-ref: '${{ env.DOCKER_LOCATION }}:${{ inputs.VERSION }}'
          # output: 'trivy-results.txt'
          # output: 'trivy-results.json'
          output: '${{ inputs.TRIVY_OUTPUT }}'
          # format: 'table'
          # format: 'json'
          format: 'template'
          template: "@${{ inputs.TRIVY_TEMPLATE_FILE }}"
          exit-code: ${{ inputs.TRIVY_EXIT_CODE }}
          ignore-unfixed: ${{ inputs.TRIVY_IGNORE_UNFIXED }}
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        continue-on-error: ${{ inputs.TRIVY_CONTINUE_ON_ERROR }}

      # - name: " Update Scan Results"
      #   env:
      #     DOCKER_LOCATION: ${{ steps.setup-variables.outputs.DOCKER_LOCATION }}
      #   run: |
      #     echo "## Trivy Scan Results" > trivy-report.md
      #     echo "Scanned Image: ${IMAGE_NAME}" >> trivy-report.md
      #     echo "" >> trivy-report.md
      #     # cat trivy-results.txt >> trivy-report.md
      #     # echo "" >> trivy-report.md
      #     echo "\`\`\`json" >> trivy-report.md
      #     cat trivy-results.json >> trivy-report.md
      #     echo "\`\`\`" >> trivy-report.md

      - name: " View updated scan results"
        run: |
          cat ${{ inputs.TRIVY_OUTPUT }}

      # - name: "⬆️ Upload Scan Results"
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: trivy-report
      #     path: trivy-results.json
