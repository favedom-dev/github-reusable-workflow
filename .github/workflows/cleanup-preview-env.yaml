name: PR Cleanup

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      NAME:
        description: "Name of service"
        required: false
        type: string

      NAMES:
        description: "Name of services space separated (ex: admin-fe celeb-fe)"
        required: false
        type: string

      SECRETS_TO_FETCH:
        description: "Secrets to fetch from Google Secret Manager"
        required: false
        type: string

      DEFAULT_SECRETS_TO_FETCH:
        description: "Default secrets to fetch from Google Secret Manager"
        required: false
        type: string
        default: |
          GH_TOKEN:projects/1054075584205/secrets/core_GITHUB_FAVEDOM_DEV_PASSWORD

      PREVIEW_NAMESPACE:
        required: false
        type: string
        description: "OBSOLETE"

      PR_PREFIX:
        default: '0.0.0-SNAPSHOT-PR-'
        required: false
        type: string

      PROJECT_ID:
        default: 'favedom-dev'
        required: false
        type: string

      GAR_LOCATION:
        default: 'us-central1'
        required: false
        type: string

      DOCKER_REGISTRY:
        default: 'docker'
        required: false
        type: string

      CREATE_CREDENTIALS_FILE:
        default: true
        required: false
        type: boolean

      EXPORT_ENVIRONMENT_VARIABLES:
        default: true
        required: false
        type: boolean

      CLUSTER_NAME:
        default: 'fanfuzenil'
        # default: 'favedom-dev'
        required: false
        type: string

      CLUSTER_PROJECT_ID:
        default: 'development-375017'
        required: false
        type: string

      LOCATION:
        default: 'us-central1-a'
        required: false
        type: string

      GH_USER_NAME:
        default: 'PowerVZ GitHub Bot'
        required: false
        type: string

      GH_USER_EMAIL:
        # default: 'github@powervz.com'
        default: ''
        required: false
        type: string

      PREVIEW_REPO_NAME:
        default: 'argocd-previews'
        required: false
        type: string

      PREVIEW_REPO_ORG_NAME:
        default: 'favedom-dev'
        required: false
        type: string

      PREVIEW_MAIN_BRANCH:
        default: 'master'
        required: false
        type: string

      TRIVY_REPO_NAME:
        default: 'trivy-scans'
        required: false
        type: string

      TRIVY_REPO_ORG_NAME:
        default: 'favedom-dev'
        required: false
        type: string

      TRIVY_MAIN_BRANCH:
        default: 'master'
        required: false
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:
      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true
jobs:

  preview-environment-cleanup:
    timeout-minutes: 10
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    steps:

      # - name: "📄 GITHUB INFO"
      #   uses: favedom-dev/github-reusable-workflow/.github/actions/debug-github-info@v2.1
      #   with:
      #     github-context: ${{ toJSON(github) }}
      #     event-name: ${{ github.event_name }}
      #     run-attempt: ${{ github.run_attempt }}
      #     run-number: ${{ github.run_number }}
      #     pr-number: ${{ github.event.pull_request.number }}

      # Not really used here to remove warning
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "🏷️ Set up variables"
        id: setup-variables
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          echo "PR_NUM=${PR_NUM}" >> $GITHUB_ENV
          echo "PR_NUM=${PR_NUM}" >> $GITHUB_OUTPUT
          # ===
          PR_VERSION=${{ inputs.PR_PREFIX }}${PR_NUM}
          echo "PR_VERSION=${PR_VERSION}" >> $GITHUB_ENV
          echo "PR_VERSION=${PR_VERSION}" >> $GITHUB_OUTPUT
          # ===
          GAR=${{ inputs.GAR_LOCATION }}-docker.pkg.dev
          echo "GAR=${GAR}" >> $GITHUB_ENV
          echo "GAR=${GAR}" >> $GITHUB_OUTPUT
          # ===
          DOCKER_BASE_LOCATION=${GAR}/${{ inputs.PROJECT_ID }}/${{ inputs.DOCKER_REGISTRY }}
          echo "DOCKER_BASE_LOCATION=${DOCKER_BASE_LOCATION}" >> $GITHUB_ENV
          echo "DOCKER_BASE_LOCATION=${DOCKER_BASE_LOCATION}" >> $GITHUB_OUTPUT
          # ===
          DOCKER_LOCATION=${DOCKER_BASE_LOCATION}/${{ inputs.NAME }}
          echo "DOCKER_LOCATION=${DOCKER_LOCATION}" >> $GITHUB_ENV
          echo "DOCKER_LOCATION=${DOCKER_LOCATION}" >> $GITHUB_OUTPUT
          # ===
          DOCKER_URL="https://console.cloud.google.com/artifacts/docker/${{ inputs.PROJECT_ID }}/${{ inputs.GAR_LOCATION }}/${{ inputs.DOCKER_REGISTRY }}/${{ inputs.NAME }}?project=${{ inputs.PROJECT_ID }}/"
          echo "DOCKER_URL=${DOCKER_URL}" >> $GITHUB_ENV
          echo "DOCKER_URL=${DOCKER_URL}" >> $GITHUB_OUTPUT
          # ===
          DOCKER_TAG_PREFIX="${PR_VERSION}-"
          echo "DOCKER_TAG_PREFIX=${DOCKER_TAG_PREFIX}" >> $GITHUB_ENV
          echo "DOCKER_TAG_PREFIX=${DOCKER_TAG_PREFIX}" >> $GITHUB_OUTPUT
          # ===
          PREVIEW_REPO_FULLNAME="${{ inputs.PREVIEW_REPO_ORG_NAME }}/${{ inputs.PREVIEW_REPO_NAME }}"
          echo "PREVIEW_REPO_FULLNAME : ${PREVIEW_REPO_FULLNAME}"
          echo "PREVIEW_REPO_FULLNAME=${PREVIEW_REPO_FULLNAME}" >> $GITHUB_ENV
          echo "PREVIEW_REPO_FULLNAME=${PREVIEW_REPO_FULLNAME}" >> $GITHUB_OUTPUT
          # ===
          PREVIEW_BASE_DIR="${{ inputs.PREVIEW_REPO_NAME }}/apps
          echo "PREVIEW_BASE_DIR : ${PREVIEW_BASE_DIR}"
          echo "PREVIEW_BASE_DIR=${PREVIEW_BASE_DIR}" >> $GITHUB_ENV
          echo "PREVIEW_BASE_DIR=${PREVIEW_BASE_DIR}" >> $GITHUB_OUTPUT
          # ===
          # PREVIEW_WORKING_DIR="${PREVIEW_BASE_DIR}/${{ inputs.NAME }}/${{ inputs.PREVIEW_NAMESPACE }}"
          # echo "PREVIEW_WORKING_DIR : ${PREVIEW_WORKING_DIR}"
          # echo "PREVIEW_WORKING_DIR=${PREVIEW_WORKING_DIR}" >> $GITHUB_ENV
          # echo "PREVIEW_WORKING_DIR=${PREVIEW_WORKING_DIR}" >> $GITHUB_OUTPUT
          # ===
          TRIVY_REPO_FULLNAME="${{ inputs.TRIVY_REPO_ORG_NAME }}/${{ inputs.TRIVY_REPO_NAME }}"
          echo "TRIVY_REPO_FULLNAME : ${TRIVY_REPO_FULLNAME}"
          echo "TRIVY_REPO_FULLNAME=${TRIVY_REPO_FULLNAME}" >> $GITHUB_ENV
          echo "TRIVY_REPO_FULLNAME=${TRIVY_REPO_FULLNAME}" >> $GITHUB_OUTPUT
          # ===
          TRIVY_WORKING_DIR="${{ inputs.TRIVY_REPO_NAME }}/${{ inputs.NAME }}/PR"
          echo "TRIVY_WORKING_DIR : ${TRIVY_WORKING_DIR}"
          echo "TRIVY_WORKING_DIR=${TRIVY_WORKING_DIR}" >> $GITHUB_ENV
          echo "TRIVY_WORKING_DIR=${TRIVY_WORKING_DIR}" >> $GITHUB_OUTPUT

          echo "-----------------------"
          echo "GAR                   : ${GAR}"
          echo "PR_NUM                : ${PR_NUM}"
          echo "PR_VERSION            : ${PR_VERSION}"
          echo "DOCKER_BASE_LOCATION  : ${DOCKER_BASE_LOCATION}"
          echo "DOCKER_LOCATION       : ${DOCKER_LOCATION}"
          echo "DOCKER_URL            : ${DOCKER_URL}"
          echo "DOCKER_TAG_PREFIX     : ${DOCKER_TAG_PREFIX}"
          echo "PREVIEW_REPO_FULLNAME : ${PREVIEW_REPO_FULLNAME}"
          echo "PREVIEW_BASE_DIR      : ${PREVIEW_BASE_DIR}"
          # echo "PREVIEW_WORKING_DIR   : ${PREVIEW_WORKING_DIR}"
          echo "TRIVY_REPO_FULLNAME   : ${TRIVY_REPO_FULLNAME}"
          echo "TRIVY_WORKING_DIR     : ${TRIVY_WORKING_DIR}"
          echo "======================="

      - name: "🔐 Get Secrets"
        uses: favedom-dev/github-reusable-workflow/.github/actions/get-google-secrets@v2.1
        id: get-secrets
        with:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          SECRETS_TO_FETCH: ${{ inputs.SECRETS_TO_FETCH }}
          DEFAULT_SECRETS_TO_FETCH: ${{ inputs.DEFAULT_SECRETS_TO_FETCH }}

      - name: "🔑 Docker Auth: GAR"
        id: auth-docker
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: ${{ steps.get-secrets.outputs.access-token }}
          registry: "${{ steps.setup-variables.outputs.GAR }}"

      # https://github.com/google-github-actions/setup-gcloud
      - name: '🔧 Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: "🗑️ Delete PR ${{ steps.setup-variables.outputs.PR_NUM }} container(s)"
        env:
          NAME: ${{ inputs.NAME }}
          NAMES: ${{ inputs.NAMES }}
        run: |
          name=${NAMES:-${NAME}}
          echo "## 🗑️ Container(s) PR: \`${DOCKER_TAG_PREFIX}\`" >> $GITHUB_STEP_SUMMARY

          delete_images() {
            declare -a PR_TAG_LIST
            for tag in $(gcloud artifacts docker tags list ${CURRENT_DOCKER_LOCATION} | grep "${DOCKER_TAG_PREFIX}" | cut -f1 -d ' '); do
              CURRENT_CONTAINER="${CURRENT_DOCKER_LOCATION}:${tag}"
              PR_TAG_LIST[${#PR_TAG_LIST[@]}]="${tag}"
              echo ""
              echo ">>>>>>>>>>>>>>"
              echo "START DELETING: ${CURRENT_CONTAINER}"
              echo "- ${CURRENT_CONTAINER}" >> $GITHUB_STEP_SUMMARY
              gcloud artifacts docker images delete "${CURRENT_CONTAINER}" --delete-tags --quiet
              echo "DONE  DELETING: ${CURRENT_CONTAINER}"
              echo "<<<<<<<<<<<<<<"
            done
            echo ""
            echo "Can verify PR containers \"${PR_VERSION}*\" deleted at URL:"
            echo "${DOCKER_URL}"
            echo "Containers removed had tags:"
            printf '%s\n' "${PR_TAG_LIST[@]}"
          }

          declare -a ARR_DOCKER_LOCATIONS
          if [ "${#NAMES}" -gt 0 ]; then
            read -a ARR_NAMES <<< "${NAMES}"
            for name in "${ARR_NAMES[@]}"; do
              echo "Adding ${DOCKER_BASE_LOCATION}/${name}"
              ARR_DOCKER_LOCATIONS+=("${DOCKER_BASE_LOCATION}/${name}")
            done
          else
            echo "Adding DOCKER_LOCATION ${DOCKER_LOCATION}"
            ARR_DOCKER_LOCATIONS+=("${DOCKER_LOCATION}")
          fi

          echo "ARR_DOCKER_LOCATIONS:"
          printf '%s\n' "${ARR_DOCKER_LOCATIONS[@]}"

          # delete for each item in ARR_DOCKER_LOCATIONS
          for CURRENT_DOCKER_LOCATION in "${ARR_DOCKER_LOCATIONS[@]}"; do
            echo ""
            echo ">>> START >>>"
            delete_images
            echo "<<<  END  <<<"
          done

      - name: "🔩 Git config"
        uses: favedom-dev/github-reusable-workflow/.github/actions/setup-git-config@v2
        with:
          GH_USER_NAME: ${{ inputs.GH_USER_NAME }}
          GH_USER_EMAIL: ${{ inputs.GH_USER_EMAIL }}

      - name: "☁️ Checkout repository ${{ steps.setup-variables.outputs.PREVIEW_REPO_FULLNAME }}"
        uses: actions/checkout@v4
        with:
          token: ${{ env.GH_TOKEN }}
          repository: ${{ steps.setup-variables.outputs.PREVIEW_REPO_FULLNAME }}
          path: '${{ inputs.PREVIEW_REPO_NAME }}'

      - name: "🗑️ Delete ArgoCD preview files: ${{ steps.setup-variables.outputs.PR_VERSION }}*"
        working-directory: ${{ inputs.PREVIEW_REPO_NAME }}
        env:
          NAME: ${{ inputs.NAME }}
          NAMES: ${{ inputs.NAMES }}
          # PR_DIR: ./${{ steps.setup-variables.outputs.PREVIEW_WORKING_DIR }}
          PR_DIR: ./${{ steps.setup-variables.outputs.PREVIEW_BASE_DIR }}
        run: |
          echo "DEBUG >>>"
          echo "pwd:"
          pwd
          echo "ls:"
          ls -la
          echo "<<< DEBUG"

          name=${NAMES:-${NAME}}
          echo "name   : ${name}"
          echo "NAME   : ${NAME}"
          echo "NAMES  : ${NAMES}"
          echo "PR_DIR : ${PR_DIR}"
          echo "## 🗑️ ArgoCD Preview" >> $GITHUB_STEP_SUMMARY

          declare -a ARR_PREVIEWS
          if [ "${#NAMES}" -gt 0 ]; then
            read -a ARR_NAMES <<< "${NAMES}"
            for name in "${ARR_NAMES[@]}"; do
              echo "Adding \"names\" ${PR_DIR}/${name}/pr-${name}-${{ github.event.number }}"
              ARR_PREVIEWS+=("${PR_DIR}/${name}")
            done
          else
            echo "Adding \"name\" ${PR_DIR}/${name}/pr-${name}-${{ github.event.number }}"
            ARR_PREVIEWS+=("${PR_DIR}/${name}/pr-${name}-${{ github.event.number }}")
          fi

          echo "ARR_PREVIEWS:"
          printf '%s\n' "${ARR_PREVIEWS[@]}"

          # delete for each item in ARR_PREVIEWS
          for CURRENT_PREVIEW in "${ARR_PREVIEWS[@]}"; do
            echo "Directory exists: ${CURRENT_PREVIEW}"
            rm -rf "${CURRENT_PREVIEW}"
            echo "Deleted: ${CURRENT_PREVIEW}"
            echo "-  \`${CURRENT_PREVIEW}\`" >> $GITHUB_STEP_SUMMARY
            PR_DELETED="true"
          done

          if [ "${PR_DELETED}" = "true" ]; then
            echo "git..."
            git status
            git add .
            git commit -m "chore: ${{ inputs.NAME }} PR: ${{ steps.setup-variables.outputs.PR_NUM }} Delete: ${ARR_PREVIEWS[@]}"

            for i in {1..5}; do
              git pull --rebase origin ${{ inputs.PREVIEW_MAIN_BRANCH }} && git push origin ${{ inputs.PREVIEW_MAIN_BRANCH }} && break
              echo "Retrying push... attempt $i"
              sleep 5
            done
          else
            echo "No directory deleted... tried:"
            printf '%s\n' "${ARR_PREVIEWS[@]}"
            echo "No directory deleted... tried:" >> $GITHUB_STEP_SUMMARY
            printf '%s\n' "- ${ARR_PREVIEWS[@]}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "☁️ Checkout repository ${{ steps.setup-variables.outputs.TRIVY_REPO_FULLNAME }}"
        uses: actions/checkout@v4
        with:
          token: ${{ env.GH_TOKEN }}
          repository: ${{ steps.setup-variables.outputs.TRIVY_REPO_FULLNAME }}
          path: '${{ inputs.TRIVY_REPO_NAME }}'

      - name: "🗑️ Delete PR trivy scan(s): ${{ steps.setup-variables.outputs.PR_VERSION }}*"
        # working-directory: ${{ steps.setup-variables.outputs.TRIVY_WORKING_DIR }}
        working-directory: ${{ inputs.TRIVY_REPO_NAME }}
        env:
          NAME: ${{ inputs.NAME }}
          NAMES: ${{ inputs.NAMES }}
        run: |
          name=${NAMES:-${NAME}}
          echo "## 🗑️ Trivy: \`${{ inputs.TRIVY_REPO_NAME }}/${name}/PR/${{ steps.setup-variables.outputs.PR_VERSION }}*\`" >> $GITHUB_STEP_SUMMARY
          pwd

          declare -a ARR_APPS
          if [ "${#NAMES}" -gt 0 ]; then
            read -a ARR_NAMES <<< "${NAMES}"
            for name in "${ARR_NAMES[@]}"; do
              echo "Adding ./${name}/PR/${{ steps.setup-variables.outputs.PR_VERSION }}*"
              ARR_APPS+=("./${name}/PR/${{ steps.setup-variables.outputs.PR_VERSION }}*")
            done
          else
            echo "Adding ./${{ inputs.NAME }}/PR/${{ steps.setup-variables.outputs.PR_VERSION }}*"
            ARR_APPS+=("./${{ inputs.NAME }}/PR/${{ steps.setup-variables.outputs.PR_VERSION }}*")
          fi

          # Build the find command for multiple patterns
          FIND_CMD="find . -type f"
          for pattern in "${ARR_APPS[@]}"; do
            FIND_CMD+=" -o -path \"$pattern\""
          done

          # Remove first "-o" to avoid syntax error
          FIND_CMD=$(echo "$FIND_CMD" | sed 's/-o //')

          echo "Executing: $FIND_CMD"
          MATCHED_FILES=$(eval "$FIND_CMD")

          if [ -n "$MATCHED_FILES" ]; then
            echo "Deleting files:"
            echo "${MATCHED_FILES}"
            echo "${MATCHED_FILES}" >> $GITHUB_STEP_SUMMARY
            rm -f ${MATCHED_FILES}

            git status
            git add .
            git commit -m "chore: ${{ inputs.NAME }} PR ${{ steps.setup-variables.outputs.PR_NUM }} Delete Trivy scan results"

            for i in {1..5}; do
              git pull --rebase origin ${{ inputs.TRIVY_MAIN_BRANCH }} && git push origin ${{ inputs.TRIVY_MAIN_BRANCH }} && break
              echo "Retrying push... attempt $i"
              sleep 5
            done
          else
            echo "No matching files found. Skipping deletion."
            echo "SKIPPING: No matching files found" >> $GITHUB_STEP_SUMMARY
          fi
