name: Flyway Cloud Run Job
# Reusable workflow to run Flyway database migrations via a Cloud Run job.

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      NAME:
        description: "Name of service"
        required: true
        type: string

      VERSION:
        description: "Version tag for the build artifact"
        default: 'latest'
        required: false
        type: string

      PROJECT_ID:
        description: "GCP project ID"
        default: 'favedom-dev'
        required: false
        type: string

      GAR_LOCATION:
        description: "Google Artifact Registry location"
        default: 'us-central1'
        required: false
        type: string

      GCR_LOCATION:
        description: "Google Container Registry location"
        default: 'gcr.io'
        required: false
        type: string

      DOCKER_REGISTRY:
        description: "Docker registry name in Artifact Registry"
        default: 'peeq-docker'
        required: false
        type: string

      JOB_NAME:
        description: "Cloud Run job name for Flyway migration"
        required: true
        type: string

      REGION:
        description: "GCP region for Cloud Run job"
        default: 'europe-west9'
        required: false
        type: string

      CLOUDSQL_INSTANCES:
        description: "Cloud SQL instance connection string"
        required: true
        type: string

      CLOUD_SQL_CONNECTION_NAME:
        description: "Cloud SQL connection name"
        required: true
        type: string

      DB_DRIVER:
        description: "Database driver class name"
        default: 'jdbc:postgresql:'
        required: false
        type: string

      DB_HOST:
        description: "Database host address"
        default: 127.0.0.1
        required: true
        type: string

      DB_PORT:
        description: "Database port number"
        default: "5432"
        required: false
        type: string

      DB_NAME:
        description: "Database name"
        required: true
        type: string

      DB_USER:
        description: "Database username"
        required: true
        type: string

      DB_PASSWORD:
        description: "Database password secret reference"
        required: true
        type: string

      SQL_PROXY_KEY:
        description: "Cloud SQL proxy service account key"
        required: true
        type: string

      GH_RUNS_ON:
        description: "GitHub Actions runner label to use"
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:
      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

jobs:
  flyway_deploy:
    timeout-minutes: 10
    # Add 'id-token' with the intended permissions for workload identity federation
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    steps:

      - name: "🔑 Google Auth Token"
        id: auth-gcp-token
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: "🔧 Set up Cloud SDK"
        uses: 'google-github-actions/setup-gcloud@v0'

      # - name: 'Use gcloud CLI'
      #   run: 'gcloud info'

      - name: "🔧 Install gcloud beta"
        run: gcloud components install beta

      - name: "❔ Does Cloud Run Job exist"
        id: job-exist
        continue-on-error: true
        run: |-
          gcloud beta run jobs list --filter=${{ inputs.JOB_NAME }} | cut -f 3 -d ' ' | grep ^${{ inputs.JOB_NAME }}$
          echo "JOB_EXISTS=$?" >> $GITHUB_ENV

      - name: "🏗️ Create Cloud Run Job"
        if: steps.job-exist.outcome == 'failure'
        run: |-
          gcloud beta run jobs create ${{ inputs.JOB_NAME }} \
          --image ${{ inputs.GAR_LOCATION }}-docker.pkg.dev/${{ inputs.PROJECT_ID }}/${{ inputs.DOCKER_REGISTRY }}/${{ inputs.NAME }}:${{ inputs.VERSION }}  \
          --set-cloudsql-instances=${{ inputs.CLOUDSQL_INSTANCES }} \
          --set-env-vars CLOUD_SQL_CONNECTION_NAME=${{ inputs.CLOUD_SQL_CONNECTION_NAME }} \
          --set-env-vars DB_DRIVER=${{ inputs.DB_DRIVER }} \
          --set-env-vars DB_HOST=${{ inputs.DB_HOST }} \
          --set-env-vars DB_PORT=${{ inputs.DB_PORT }} \
          --set-env-vars DB_NAME=${{ inputs.DB_NAME }} \
          --set-env-vars DB_USER=${{ inputs.DB_USER }} \
          --set-secrets DB_PASSWORD=${{ inputs.DB_PASSWORD }} \
          --set-secrets SQL_PROXY_KEY=${{ inputs.SQL_PROXY_KEY }} \
          --command sh \
          --args="-c" \
          --args="./flyway_migrate.sh" \
          --max-retries 1 \
          --region ${{ inputs.REGION }} \
          --quiet

      - name: "🔄 Update Cloud Run Job"
        if: steps.job-exist.outcome == 'success'
        run: |-
          gcloud beta run jobs update ${{ inputs.JOB_NAME }} \
          --image=${{ inputs.GAR_LOCATION }}-docker.pkg.dev/${{ inputs.PROJECT_ID }}/${{ inputs.DOCKER_REGISTRY }}/${{ inputs.NAME }}:${{ inputs.VERSION }} \
          --region ${{ inputs.REGION }}

      # https://console.cloud.google.com/run/jobs/details/europe-west9/staging-peeq-tracking-db/executions?project=favedom-dev
      - name: "🔗 Link to Cloud Run Job"
        run: |-
          echo "https://console.cloud.google.com/run/jobs/details/${{ inputs.REGION }}/${{ inputs.JOB_NAME }}/executions?project=${{ inputs.PROJECT_ID }}"

      - name: "🚀 Execute Cloud Run Job"
        run: |-
          gcloud beta run jobs execute ${{ inputs.JOB_NAME }} --wait --region ${{ inputs.REGION }}
