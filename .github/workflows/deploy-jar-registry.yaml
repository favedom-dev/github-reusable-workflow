name: Deploy jar registry

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      NAME:
        description: "Name of service"
        required: true
        type: string

      VERSION:
        required: true
        type: string

      JDK_VERSION:
        default: 21
        required: false
        type: number

      JDK_DISTRIBUTION:
        # default: 'temurin'
        default: 'corretto'
        required: false
        type: string

      MVN_VERSION:
        description: "See https://maven.apache.org/docs/history.html"
        default: "3.9.9"
        required: false
        type: string

      MVN_ARGS:
        default: 'clean deploy'
        required: false
        type: string

      MAVEN_WORKING_DIR:
        default: '.'
        required: false
        type: string

      MAVEN_SETTINGS_URL:
        default: 'https://raw.githubusercontent.com/favedom-dev/github-reusable-workflow/master/.m2'
        required: false
        type: string

      PLATFORMS:
        required: false
        type: string
        default: linux/amd64,linux/arm64

      PROJECT_ID:
        default: 'favedom-dev'
        required: false
        type: string

      GAR_LOCATION:
        default: 'us-central1'
        required: false
        type: string

      GAR_MAVEN_URL:
        default: 'https://console.cloud.google.com/artifacts/maven/'
        required: false
        type: string

      MAVEN_REGISTRY:
        default: 'java'
        required: false
        type: string

      JAR_PATH:
        default: 'com.velocityz'
        required: false
        type: string

      SCAN_JAR:
        default: './target/*.jar'
        required: false
        type: string

      VCS_PREFIX_CORRECTION:
        default: 'src/main/java'
        required: false
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:
      GH_TOKEN:
        description: "GitHub token"
        required: true

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

      SHIFTLEFT_ACCESS_TOKEN:
        description: "Shiftleft/Qwiet token"
        required: false

jobs:

  deploy-jar-registry:
    timeout-minutes: 15
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    steps:

      - name: "⚠️ Deprecation Warning"
        run: |
          echo "::warning title=Deprecation Notice::This workflow is deprecated. Please use the new workflow instead: build-maven-jar.yaml"
          exit 1
