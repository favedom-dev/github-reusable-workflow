name: Helm Preview

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      NAME:
        description: "Name of service"
        required: true
        type: string

      VERSION:
        required: true
        type: string

      # IS_FRONTEND:
      #   default: false
      #   required: false
      #   type: boolean
      # IS_MONOREPO:
      #   default: false
      #   required: false
      #   type: boolean
      # VALUES_ISTIO_HOST:
      #   required: false
      #   type: string

      EXTRA_VARS:
        default: ''
        required: false
        type: string

      YQ_VERSION:
        required: false
        type: string
        description: "Version of yq to install"

      PREVIEW_NAMESPACE:
        required: true
        type: string

      PREVIEW_SUBDOMAIN:
        required: false
        type: string

      CHARTS_DIR:
        default: 'charts'
        type: string
        required: false

      HELM_CHARTS_GIT_REPO:
        default: 'helm-charts'
        required: false
        type: string

      HELM_CHARTS_GIT_ORG:
        default: 'favedom-dev'
        required: false
        type: string

      HELM_CHARTS_GIT_BRANCH:
        default: 'master'
        required: false
        type: string

      HELM_USE_LOCAL_COMMON:
        required: false
        type: string

      GH_USER_EMAIL:
        default: 'github@powervz.com'
        required: false
        type: string

      GH_USER_NAME:
        default: 'PowerVZ GitHub Bot'
        required: false
        type: string

      HELM_REGISTRY_BASE_URL:
        default: "https://console.cloud.google.com/artifacts/docker"
        required: false
        type: string

      HELM_DOCKER_REGISTRY:
        description: "Use GAR oci://"
        default: 'us-central1-docker.pkg.dev'
        required: false
        type: string

      HELM_REGISTRY_NAME:
        default: 'helm'
        required: false
        type: string

      HELM_PROJECT_ID:
        default: 'favedom-dev'
        required: false
        type: string

      HELM_LOCATION:
        default: 'us-central1'
        required: false
        type: string

      HELM_VERSION:
        default: 'v3.15.2'
        required: false
        type: string

      HELM_ENABLE_DEBUG:
        default: true
        required: false
        type: boolean

      KUBECTL_APPLY:
        default: false
        required: false
        type: boolean

      DOCKER_REGISTRY:
        description: "Use GAR"
        default: 'us-central1-docker.pkg.dev'
        required: false
        type: string

      DOCKER_REGISTRY_NAME:
        default: 'docker'
        required: false
        type: string

      DOCKER_PROJECT_ID:
        default: 'favedom-dev'
        required: false
        type: string

      VALUES_GLOBALS_YAML:
        default: 'values-preview.yaml'
        required: false
        type: string

      VALUES_PREVIEW_YAML:
        default: 'values-preview.yaml'
        required: false
        type: string

      VALUES_PREVIEW_YAML_TPL:
        default: 'values-preview.yaml.tpl'
        required: false
        type: string

      OVERRIDE_CHART_NAME:
        required: false
        type: string

      CLUSTER_PROJECT_ID:
        default: 'development-375017'
        required: false
        type: string

      CLUSTER_NAME:
        default: 'fanfuzenil'
        required: false
        type: string

      CLUSTER_LOCATION:
        default: 'us-central1-a'
        required: false
        type: string

      HELM_PREVIEW_ARGS:
        default: ''
        required: false
        type: string

      PREVIEW_BASE_DOMAIN:
        default: 'dev.fanfuzenil.com'
        required: false
        type: string

      PREVIEW_HEALTHCHECK:
        default: 'actuator/health'
        required: false
        type: string

      SECRETS_FROM_NAMESPACE:
        default: fanfuze
        required: false
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:
      GH_TOKEN:
        description: "GitHub token"
        required: true

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

    outputs:
      API_PATH:
        value: ${{ jobs.helm-preview.outputs.API_PATH }}

      APP_HOST:
        value: ${{ jobs.helm-preview.outputs.APP_HOST }}

jobs:

  helm-preview:
    timeout-minutes: 10
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    outputs:
      API_PATH: ${{ steps.get-api-path.outputs.API_PATH }}
      APP_HOST: ${{ steps.setup-variables.outputs.PREVIEW_URL }}
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:

      - name: "⚠️ Deprecation Warning"
        run: |
          echo "::warning title=Deprecation Notice::This workflow is deprecated. Please use the new workflow instead: deploy-helm-preview.yaml"
          exit 1
