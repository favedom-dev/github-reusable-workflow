name: Qwiet

on:  # yamllint disable-line rule:truthy
  workflow_call:

    inputs:
      NAME:  # name of service, (ex: peeq-tracking)
        required: true
        type: string

      ARG_LANGUAGE:
        default: '--js'
        required: false
        type: string

      ARG_STANDARD:
        default: '--cpg'
        required: false
        type: string

      SCAN_DIR:
        default: './'
        required: false
        type: string

      VCS_PREFIX_CORRECTION:
        default: ''
        required: false
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:
      GH_TOKEN:  # GitHub token
        required: true

      SHIFTLEFT_ACCESS_TOKEN:
        required: true

jobs:

  qwiet:
    # timeout-minutes: 15
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    steps:

      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "⬇️ Download Qwiet CLI"
        uses: favedom-dev/github-reusable-workflow/.github/actions/qwiet-download-cli@v2.1
        with:
          shiftleft-access-token: ${{ secrets.SHIFTLEFT_ACCESS_TOKEN }}

      # https://docs.shiftleft.io/cli/reference/analyze
      - name: "🔍 Qwiet Analyze with NextGen Static Analysis"
        env:
          SHIFTLEFT_ACCESS_TOKEN: ${{ secrets.SHIFTLEFT_ACCESS_TOKEN }}
        run: |
          $HOME/sl analyze \
          --app ${{ inputs.NAME }} \
          ${{ inputs.ARG_LANGUAGE }} \
          ${{ inputs.ARG_STANDARD }} \
          ${{ inputs.VCS_PREFIX_CORRECTION }} \
          ${{ inputs.SCAN_DIR }} | tee qwiet-analysis.log

      - name: "⬆️ Upload Qwiet Analyze Artifacts"
        uses: actions/upload-artifact@v3
        with:
          name: qwiet-analysis.log
          path: qwiet-analysis.log