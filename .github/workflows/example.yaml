name: Example

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      VER:
        required: true
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

jobs:

  debug:
    timeout-minutes: 2
    runs-on: ${{ inputs.GH_RUNS_ON }}
    steps:

      # - name: "📄 GITHUB INFO"
      #   uses: favedom-dev/github-reusable-workflow/.github/actions/debug-github-info@v2
      #   with:
      #     github-context: ${{ toJSON(github) }}
      #     event-name: ${{ github.event_name }}
      #     run-attempt: ${{ github.run_attempt }}
      #     run-number: ${{ github.run_number }}
      #     pr-number: ${{ github.event.pull_request.number }}

      - name: "Fetch workflow runs for PR"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number=${{ github.event.number }}
          repo_name=${{ github.repository }}

          # Get the workflow runs for the PR
          runs=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
          "https://api.github.com/repos/${repo_name}/actions/runs?event=pull_request&branch=${{ github.head_ref }}")

          echo "Workflow runs: ${runs}"
