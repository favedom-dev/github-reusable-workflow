name: pnpm docker

on:
  workflow_call:
    inputs:
      NAME:
        description: "Name of service"
        required: true
        type: string

      VERSION:
        required: true
        type: string

      SECRETS_TO_FETCH:
        description: "Secrets to fetch from Google Secret Manager"
        required: false
        type: string

      DEFAULT_SECRETS_TO_FETCH:
        description: "Default secrets to fetch from Google Secret Manager"
        required: false
        type: string
        default: |
          GH_TOKEN:projects/1054075584205/secrets/core_GITHUB_FAVEDOM_DEV_PASSWORD

      FILE_DOWNLOAD_BASE_URL:
        default: 'https://raw.githubusercontent.com/favedom-dev/github-reusable-workflow'
        required: false
        type: string

      FILE_GIT_BRANCH:
        default: 'v2.1'
        required: false
        type: string
        description: "Used typically for testing new non-merged helm changes"

      VAR_DOCKER_SCRIPT_NAME:
        default: 'var-docker.sh'
        required: false
        type: string

      PLATFORMS:
        required: false
        type: string
        default: linux/amd64,linux/arm64

      PNPM_VERSION:
        default: 8
        required: false
        type: number

      NODE_VERSION:
        default: 18
        required: false
        type: number

      TAG2:
        default: 'latest'
        required: false
        type: string

      PROJECT_ID:
        default: 'favedom-dev'
        required: false
        type: string

      GAR_LOCATION:
        default: 'us-central1'
        required: false
        type: string

      GCR_LOCATION:
        default: 'gcr.io'
        required: false
        type: string

      DOCKER_REGISTRY:
        default: 'docker'
        required: false
        type: string

      DOCKER_CONTEXT:
        default: '.'
        required: false
        type: string

      DOCKER_NAME:
        required: false
        type: string

      DOCKERFILE_FILE:
        default: ./packages/api/Dockerfile
        required: false
        type: string

      DOCKER_PUSH:
        default: 'true'
        required: false
        type: string

      DOCKER_PUSH_PR:
        default: ''
        required: false
        type: string

      GH_RUNS_ON:
        default: 'ubuntu-latest'
        required: false
        type: string

    secrets:
      GH_TOKEN:
        description: "GitHub token"
        required: true

      WIF_PROVIDER:
        description: "Workload Identity Federation Provider"
        required: true

      WIF_SERVICE_ACCOUNT:
        description: "Workload Identity Federation Service Account"
        required: true

    outputs:
      ARTIFACT_URL:
        description: "Artifcat URL to specific tag"
        value: ${{ jobs.pnpm-docker.outputs.ARTIFACT_URL }}

jobs:

  pnpm-docker:
    timeout-minutes: 15
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ${{ inputs.GH_RUNS_ON }}
    env:
      # GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      # DOCKER_BUILDKIT: 1
      ARTIFACT_LINK_SCRIPT_NAME: artifact-link.sh
    outputs:
      ARTIFACT_URL: ${{ steps.build-docker.outputs.ARTIFACT_URL }}

    steps:

      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "⬇️ Get reusable files"
        uses: favedom-dev/github-reusable-workflow/.github/actions/get-reusable-files@v2.1
        id: get-reusable-files
        with:
          FILE_GIT_BRANCH: ${{ inputs.FILE_GIT_BRANCH }}
          FILE_DOWNLOAD_BASE_URL: ${{ inputs.FILE_DOWNLOAD_BASE_URL }}
          FILES_TO_DOWNLOAD: |
            [
              { "subdirectory": ".github/scripts", "filename": "${{ inputs.VAR_DOCKER_SCRIPT_NAME }}" },
              { "subdirectory": ".github/scripts", "filename": "${{ env.ARTIFACT_LINK_SCRIPT_NAME }}" }
            ]

      - name: "🏷️ Set up variables"
        id: setup-variables
        env:
          DOCKER_NAME: ${{ inputs.DOCKER_NAME }}
          DOCKER_PUSH: ${{ inputs.DOCKER_PUSH }}
          DOCKER_PUSH_PR: ${{ inputs.DOCKER_PUSH_PR }}
          DOCKER_REGISTRY: ${{ inputs.DOCKER_REGISTRY }}
          GAR_LOCATION: ${{ inputs.GAR_LOCATION }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NAME: ${{ inputs.NAME }}
          PROJECT_ID: ${{ inputs.PROJECT_ID }}
        run: ../${{ inputs.VAR_DOCKER_SCRIPT_NAME }}

      - name: "🔐 Get Secrets"
        uses: favedom-dev/github-reusable-workflow/.github/actions/get-google-secrets@v2.1
        id: get-secrets
        with:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          SECRETS_TO_FETCH: ${{ inputs.SECRETS_TO_FETCH }}
          DEFAULT_SECRETS_TO_FETCH: ${{ inputs.DEFAULT_SECRETS_TO_FETCH }}

      - name: "🧰 Set up build basics"
        uses: favedom-dev/github-reusable-workflow/.github/actions/build-setup-basics@v2.1
        id: build-setup-basics
        with:
          GH_RUNS_ON: ${{ inputs.GH_RUNS_ON }}
          PLATFORMS: ${{ inputs.PLATFORMS }}

      - name: "⚙️ Set up pnpm ${{ inputs.PNPM_VERSION }}"
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.PNPM_VERSION }}

      - name: "⚙️ Set up node.js ${{ inputs.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: pnpm

      - name: "🛠️ Install dependencies"
        run: pnpm install

      - name: "🐳 Docker"
        uses: favedom-dev/github-reusable-workflow/.github/actions/build-docker@v2.1
        id: build-docker
        with:
          ACCESS_TOKEN: ${{ steps.get-secrets.outputs.access-token }}
          ARTIFACT_LINK_SCRIPT_NAME: ${{ env.ARTIFACT_LINK_SCRIPT_NAME }}
          DOCKER_CONTEXT: ${{ inputs.DOCKER_CONTEXT }}
          DOCKER_LOCATION: ${{ steps.setup-variables.outputs.DOCKER_LOCATION }}
          DOCKER_PUSH: ${{ steps.setup-variables.outputs.DOCKER_PUSH }}
          DOCKER_URL: ${{ steps.setup-variables.outputs.DOCKER_URL }}
          GAR_LOCATION:  ${{ inputs.GAR_LOCATION }}
          GH_RUNS_ON: ${{ inputs.GH_RUNS_ON }}
          NAME: ${{ inputs.NAME }}
          PLATFORMS: ${{ inputs.PLATFORMS }}
          VERSION: ${{ inputs.VERSION }}
